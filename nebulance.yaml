name: Nebulance
schema: gazelle
search_entry: /torrents.php
search_param: searchtext
selectors:
    fields:
        category:
            attr: html
            filters:
                - args: taglist=season=Season:::taglist=episode=Episode
                  name: contains_map
            selector: div.tags
        detail:
            attr: href
            selector: a[href*='torrents.php?id=']
        download:
            attr: href
            selector: a[href*='torrents.php?action=download']
        size:
            data: filesize
            selector: a[href*='torrents.php?id=']
        subtitle:
            selector: div.tags
        title:
            data: src
            selector: a[href*='torrents.php?id=']
tags:
    - 电视剧
timezone_offset: "-1100"
urls:
    - https://nebulance.io/
user_info:
    fields:
        bonus:
            filters:
                - name: parse_number
            selector: a[href='bonus.php']
        bonus_per_hour:
            filters:
                - name: parse_number
            selector: li:contains('Cubits per hour')
        downloaded:
            filters:
                - name: parse_size
            selector: 'li:contains(''Downloaded: '')'
        id:
            selector: response.id
        join_date:
            attr: title
            filters:
                - args: '[MMM d yyyy, HH:mm]'
                  name: parse_time
            selector: li:contains('Joined') > span.time
        last_access_at:
            attr: title
            filters:
                - args: '[MMM d yyyy, HH:mm]'
                  name: parse_time
            selector: li:contains('Last Seen') > span.time
        level:
            filters:
                - args: 'Class:\s*(.+)'
                  name: regexp
            selector: li:contains('Class:')
        name:
            selector: response.username
        ratio:
            text: N/A
        seeding:
            filters:
                - name: parse_number
            selector: li:contains('Seeding') > span
        seeding_size:
            filters:
                - name: parse_size
            selector: li:contains('Seeding Size')
        snatches:
            filters:
                - name: parse_number
            selector: li:contains('Snatched') > span:nth-child(2)
        uploaded:
            filters:
                - name: parse_size
            selector: 'li:contains(''Uploaded: '')'
        uploads:
            filters:
                - name: parse_number
            selector: li:contains('Uploaded') > span:nth-child(2)
    pages:
        - path: /ajax.php
          format: json
          params:
            action: index
          use_fields:
            - id
            - name
        - path: /user.php
          params:
            id: "{id}"
          use_fields:
            - join_date
            - last_access_at
            - level
            - downloaded
            - uploaded
            - uploads
            - bonus
            - bonus_per_hour
            - seeding
            - seeding_size
            - snatches
