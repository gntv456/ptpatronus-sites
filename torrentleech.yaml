# torrentleech — 自动生成自 PT-depiler（tools/convert-definitions.go）。
# schema: 。selectors/user_info 若未列出则由 EnsureDefaults 自填校准默认。
aka:
    - TL
description: TorrentLeech (TL) is a Private Torrent Tracker for 0DAY / GENERAL. not here _ not scene
id: torrentleech
level_requirements:
    - name: User
    - id: 1
      interval: P2W
      name: Power User
      privilege: 'Increased Points: 3%, Minimum Seeding Time: 8 days'
      ratio: 1.1
      uploaded: 200GB
    - id: 2
      interval: P12W
      name: Super User
      privilege: 'Increased Points: 5%, Minimum Seeding Time: 7 days'
      ratio: 2
      uploaded: 1TB
    - id: 3
      interval: P24W
      name: Extreme User
      privilege: 'Increased Points: 6%, Minimum Seeding Time: 6 days'
      ratio: 5
      uploaded: 10TB
    - id: 4
      interval: P52W
      name: TL GOD
      privilege: 'Increased Points: 8%, Minimum Seeding Time: 4 days'
      ratio: 8
      uploaded: 50TB
name: TorrentLeech
no_login:
    selector: div.login-container form[name='login-form']
search_entry: /torrents/browse/list/query
selectors:
    fields:
        category:
            filters:
                - args: "8=Movies :: Cam:::9=Movies :: TS/TC:::11=Movies :: DVDRip/DVDScreener:::37=Movies :: WEBRip:::43=Movies :: HDRip:::14=Movies :: BlurayRip:::12=Movies :: DVD-R:::13=Movies :: Bluray:::47=Movies :: 4K:::15=Movies :: Boxsets:::29=Movies :: Documentaries:::26=TV :: Episodes:::32=TV :: Episodes HD:::27=TV :: Boxsets:::17=Games :: PC:::42=Games :: Mac:::18=Games :: XBOX:::19=Games :: XBOX360:::40=Games :: XBOXONE:::20=Games :: PS2:::21=Games :: PS3:::39=Games :: PS4:::22=Games :: PSP:::28=Games :: Wii:::30=Games :: Nintendo DS:::48=Games :: Nintendo Switch:::23=Apps :: PC-ISO:::24=Apps :: Mac:::25=Apps :: Mobile:::33=Apps :: 0-day:::38=Education:::34=Animation :: Anime:::35=Animation :: Cartoons:::45=Books :: EBooks:::46=Books :: Comics:::31=Music :: Audio:::16=Music :: Music videos:::36=Foreign :: Movies:::44=Foreign :: TV Series"
                  name: map
            selector: categoryID
        completed:
            selector: numComments
        detail:
            filters:
                - args: /torrent/
                  name: prepend
            selector: fid
        download:
            filters:
                - args: /download/{fid}/{filename}
                  name: json_format
            selector: :self
        leechers:
            selector: leechers
        seeders:
            selector: seeders
        size:
            selector: size
        time:
            filters:
                - name: parse_time
            selector: addedTimestamp
        title:
            selector: name
    rows:
        selector: torrentList
tags:
    - 综合
timezone_offset: "+0000"
urls:
    - https://www.torrentleech.org/
    - https://www.torrentleech.cc/
    - https://www.torrentleech.me/
    - https://www.tleechreload.org/
    - https://www.tlgetin.cc/
