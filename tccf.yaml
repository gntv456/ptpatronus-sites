id: tccf
level_requirements:
    - name: Peasant
      name_aka:
        - 庶民
      privilege: 被降级的用户, 他们有30天时间来提升分享率, 否则他们会被踢. 不能发表趣味盒内容; 不能申请友情链接; 不能上传字幕.
    - id: 1
      name: User
      name_aka:
        - 列兵
      privilege: 新用户的默认级别.
    - downloaded: 64GB
      id: 2
      interval: P2W
      name: Power User
      name_aka:
        - 士官
      privilege: 可以上传种子; 可以删除自己上传的字幕; 可以在做种/下载/上传的时候选择匿名模式.
      ratio: 1.05
    - downloaded: 128GB
      id: 3
      interval: P6W
      name: Elite User
      name_aka:
        - 尉官
      privilege: 购买邀请; 可以查看邀请论坛; 可以查看NFO文档; 可以更新外部信息; 可以请求续种; 可以使用个性条.
      ratio: 1.55
    - downloaded: 256GB
      id: 4
      interval: P14W
      name: Crazy User
      name_aka:
        - 少校
      privilege: 可以查看排行榜;可以查看其它用户的种子历史(如果用户隐私等级未设置为"强").
      ratio: 2.05
    - downloaded: 512GB
      id: 5
      interval: P26W
      name: Insane User
      name_aka:
        - 中校
      privilege: 中校及以上用户Park后不会被删除帐号.
      ratio: 2.55
    - downloaded: 1TB
      id: 6
      interval: P38W
      is_kept: true
      name: Veteran User
      name_aka:
        - 上校
      privilege: 可以发送邀请; 上校及以上用户会永远保留账号.
      ratio: 3.05
    - downloaded: 2TB
      id: 7
      interval: P54W
      is_kept: true
      name: Extreme User
      name_aka:
        - 少将
      privilege: 可以查看种子文件结构.
      ratio: 3.55
    - downloaded: 4TB
      id: 8
      interval: P70W
      is_kept: true
      name: Ultimate User
      name_aka:
        - 中将
      privilege: 可以查看其它用户的评论、帖子历史;得到五个邀请名额.
      ratio: 4.05
    - downloaded: 8TB
      id: 9
      interval: P88W
      is_kept: true
      name: Nexus Master
      name_aka:
        - 上将
      privilege: 得到十个邀请名额.
      ratio: 4.55
    - group_type: vip
      id: 100
      name: VIP
      name_aka:
        - 贵宾
      privilege: 和 Nexus Master 拥有相同权限并被认为是精英成员。免除自动降级。可以查看用户列表
    - group_type: vip
      id: 101
      name: Other
      name_aka:
        - 其他
      privilege: 自定义等级
    - group_type: manager
      id: 200
      name: Retiree
      name_aka:
        - 养老族
      privilege: 退休后的管理组成员。
    - group_type: manager
      id: 201
      name: Uploader
      name_aka:
        - 发布员
      privilege: 专注的上传者, 免除自动降级; 可以编辑、删除和通过任何候选; 可以查看一般日志.
    - group_type: manager
      id: 202
      name: Moderator
      name_aka:
        - 总版主
      privilege: 可以查看管理组信箱、举报信箱；管理趣味盒内容、投票内容；可以编辑或删除任何发布的种子；可以管理候选；可以管理论坛帖子、用户评论；可以查看机密日志；可以删除任何字幕；可以管理日志中的代码、史册；可以查看用户的邀请记录；可以管理用户帐号的一般信息。不能管理友情链接、最近消息、论坛版块；不能将种子设为置顶或促销；不能查看用户IP或Email等机密信息；不能删除账号。
    - group_type: manager
      id: 203
      name: Administrator
      name_aka:
        - 管理员
      privilege: 除了不能改变站点设定、管理捐赠外，可以做任何事。
    - group_type: manager
      id: 204
      name: Sysop
      name_aka:
        - 维护开发员
      privilege: 网站开发/维护人员，可以改变站点设定，不能管理捐赠。
    - group_type: manager
      id: 205
      name: Staff Leader
      name_aka:
        - 主管
      privilege: 网站主管，可以做任何事。
name: TorrentCCF
schema: nexusphp
tags:
    - 影视
    - 综合
    - 学习
timezone_offset: "+0800"
urls:
    - https://et8.org/
user_info:
    path: index.php
    user_torrent_list_api: "/getusertorrentlistajax.php?userid={id}&type={type}"
    fields:
        id:
            attr: href
            filters:
                - name: queryparam
                  args: id
            selectors:
                - "#info_block a[href*='userdetails.php'][href*='id=']:first"
                - "a[href*='userdetails.php'][class*='Name']:first"
                - "a[href*='userdetails.php']:first"
        name:
            selectors:
                - "#info_block a[href*='userdetails.php'][href*='id=']:first"
                - "a[href*='userdetails.php'][class*='Name']:first"
                - "a[href*='userdetails.php']:first"
        uploaded:
            filters:
                - name: regexp
                  args: '(?i)(?:上传量|上傳量|Uploaded)[\s\S]{0,160}?([\d.,]+\s*(?:[KMGTPE]i?B|Bytes|B))'
                - name: parse_size
            selectors:
                - "#info_block"
                - ".medium"
                - "td.rowhead:contains('传输') + td"
                - "td.rowhead:contains('傳送') + td"
                - "td.rowhead:contains('Transfers') + td"
        downloaded:
            filters:
                - name: regexp
                  args: '(?i)(?:下载量|下載量|Downloaded)[\s\S]{0,160}?([\d.,]+\s*(?:[KMGTPE]i?B|Bytes|B))'
                - name: parse_size
            selectors:
                - "#info_block"
                - ".medium"
                - "td.rowhead:contains('传输') + td"
                - "td.rowhead:contains('傳送') + td"
                - "td.rowhead:contains('Transfers') + td"
        ratio:
            filters:
                - name: regexp
                  args: '(?i)(?:分享率|Ratio)[\s\S]{0,120}?([\d.]+|无限|無限|Inf\.?|Infinity)'
                - name: replace
                  args: 无限:::9999
                - name: replace
                  args: 無限:::9999
                - name: replace
                  args: Infinity:::9999
                - name: replace
                  args: Inf.:::9999
            selectors:
                - "#info_block"
                - ".medium"
                - "td.rowhead:contains('传输') + td"
        seeding:
            filters:
                - name: regexp
                  args: '(?i)(?:当前活动|当前做种|Torrents seeding|Current activity)[^0-9]{0,120}(\d+)'
            selectors:
                - "#info_block"
                - ".medium"
        bonus:
            filters:
                - name: regexp
                  args: '(?i)(?:魔力值|魔力|Karma Points)[\s\S]{0,120}?([\d.,]+)'
                - name: parse_number
            selectors:
                - "td.rowhead:contains('魔力') + td"
                - "td.rowhead:contains('Karma Points') + td"
                - "td.rowfollow:contains('魔力')"
                - "#info_block"
                - ".medium"
    detail_fields:
        uploaded:
            filters:
                - name: regexp
                  args: '(?i)(?:上传量|上傳量|Uploaded)[\s\S]{0,160}?([\d.,]+\s*(?:[KMGTPE]i?B|Bytes|B))'
                - name: parse_size
            selectors:
                - "td.rowhead:contains('传输') + td"
                - "td.rowhead:contains('傳送') + td"
                - "td.rowhead:contains('Transfers') + td"
        downloaded:
            filters:
                - name: regexp
                  args: '(?i)(?:下载量|下載量|Downloaded)[\s\S]{0,160}?([\d.,]+\s*(?:[KMGTPE]i?B|Bytes|B))'
                - name: parse_size
            selectors:
                - "td.rowhead:contains('传输') + td"
                - "td.rowhead:contains('傳送') + td"
                - "td.rowhead:contains('Transfers') + td"
        ratio:
            filters:
                - name: regexp
                  args: '(?i)(?:分享率|Ratio)[\s\S]{0,120}?([\d.]+|无限|無限|Inf\.?|Infinity)'
                - name: replace
                  args: 无限:::9999
                - name: replace
                  args: 無限:::9999
                - name: replace
                  args: Infinity:::9999
                - name: replace
                  args: Inf.:::9999
            selectors:
                - "td.rowhead:contains('传输') + td"
        level:
            attr: title
            selectors:
                - "td.rowhead:contains('等级') + td > img"
                - "td.rowhead:contains('等級') + td > img"
                - "td.rowhead:contains('Class') + td > img"
        join_date:
            filters:
                - name: regexp
                  args: '(\d{4}[-/]\d{1,2}[-/]\d{1,2})'
            selectors:
                - "td.rowhead:contains('加入日期') + td"
                - "td.rowhead:contains('Join'):contains('date') + td"
        bonus:
            filters:
                - name: parse_number
            selectors:
                - "td.rowhead:contains('魔力') + td"
                - "td.rowhead:contains('Karma Points') + td"
                - "td.rowfollow:contains('魔力')"
        seeding_size:
            filters:
                - name: parse_size
            selectors:
                - "td.rowhead:contains('当前做种') + td"
                - "td.rowhead:contains('目前做種') + td"
                - "td.rowhead:contains('Current Seeding') + td"
                - "td.rowhead:contains('Seeding Size') + td"
    pages:
        - path: mybonus.php
          fields:
              bonus_per_hour:
                  filters:
                      - name: regexp
                        args: '(?i)(?:能获取|能獲取|currently\s+getting)[^0-9]{0,60}([\d.,]+\.?\d*)'
                      - name: parse_number
                  selectors:
                      - "td.text:contains('你当前每小时能获取')"
                      - "div:contains('你当前每小时能获取')"
                      - "td:contains('你当前每小时能获取')"
                      - "td.text:contains('你當前每小時能獲取')"
                      - "div:contains('你當前每小時能獲取')"
                      - "td:contains('你當前每小時能獲取')"
                      - "div:contains('currently getting')"
                      - "td:contains('currently getting')"
                      - "td[rowspan]"
