name: HUNO
schema: unit3d
search_entry: /api/torrents/filter
search_param: name
selectors:
    fields:
        category:
            text: All
            selectors:
                - category.name
                - attributes.category.name
        completed:
            selectors:
                - times_completed
                - attributes.times_completed
                - completed
                - attributes.completed
        detail:
            filters:
                - args: /torrents/
                  name: prepend
            selectors:
                - id
                - attributes.id
        download:
            selectors:
                - download_link
                - attributes.download_link
        leechers:
            selectors:
                - leechers
                - attributes.leechers
        seeders:
            selectors:
                - seeders
                - attributes.seeders
        size:
            selectors:
                - size
                - attributes.size
        subtitle:
            selector: :self
        time:
            selectors:
                - created_at
                - attributes.created_at
                - bumped_at
                - attributes.bumped_at
        title:
            selectors:
                - name
                - attributes.name
    rows:
        selectors:
            - data.data
            - data
            - torrents.data
            - torrents
tags:
    - 影视
    - 综合
timezone_offset: "+0000"
urls:
    - https://hawke.uno/
user_info:
    fields:
        bonus:
            selector: data.hunos
        bonus_per_hour:
            filters:
                - name: parse_number
            selectors:
                - table.deep-space-similar-table > tfoot td.tw-font-bold[style*=color]
        downloaded:
            filters:
                - name: parse_size
            selector: data.downloaded
        id:
            selectors:
                - span.deep-space-user-card__user-id
        join_date:
            filters:
                - name: parse_time
            selector: data.member_since
        leeching:
            selector: data.active_leeches
        level:
            selector: data.group
        name:
            selector: data.username
        seeding:
            selector: data.active_seeds
        seeding_size:
            filters:
                - name: parse_size
            selectors:
                - div.ds-user-stats span[title*='Seeding Size']
        uploaded:
            filters:
                - name: parse_size
            selector: data.uploaded
        uploads:
            filters:
                - name: trim
                - name: parse_number
            selectors:
                - div.ds-user-stats span[title*='Uploads']
