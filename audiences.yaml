      interval: P80W
      is_kept: true
      name: Extreme User
      name_aka:
        - 头号玩家
      privilege: 可以更新过期的外部信息。头号玩家(Extreme User)及以上用户会永远保留账号。
      ratio: 4.5
      seeding_bonus: 1200000
    - downloaded: 4096GB
      id: 7
      interval: P100W
      is_kept: true
      name: Ultimate User
      name_aka:
        - 一代宗师
      privilege: 同头号玩家(Extreme User)
      ratio: 5
      seeding_bonus: 1500000
    - downloaded: 8192GB
      id: 8
      interval: P112W
      is_kept: true
      name: Nexus Master
      name_aka:
        - 教父
      privilege: 同一代宗师(Ultimate User)
      ratio: 6
      seeding_bonus: 1800000
    - downloaded: 10240GB
      id: 9
      interval: P128W
      is_kept: true
      name: Rainbow
      name_aka:
        - 彩虹照耀
      privilege: 保持等级期间会显示彩虹ID，做种积分要求逐年增加（具体数值以通知为准），彩虹照耀(Rainbow)用户未到更新后的要求会被降级
      ratio: 8
      seeding_bonus: 2400000
name: Audiences
schema: nexusphp
selectors:
    fields:
        completed:
            filters:
                - name: parse_number
            selectors:
                - td:nth-of-type(8)
        detail:
            attr: href
            filters:
                - args: id
                  name: queryparam
                - args: /details.php?id=
                  name: prepend
            selectors:
                - a.torrent-row-action-link--download[href*='download.php?id=']
                - a[href*='download.php?id=']:has(i.fa-download)
                - a[href*='download.php?id='][title*='下载']
                - a[href*='download.php?id='][title*='Download']
        download:
            attr: href
            selectors:
                - a.torrent-row-action-link--download[href*='download.php?id=']
                - a[href*='download.php?id=']:has(i.fa-download)
                - a[href*='download.php?id='][title*='下载']
                - a[href*='download.php?id='][title*='Download']
        leechers:
            filters:
                - name: parse_number
            selectors:
                - td:nth-of-type(7)
        seeders:
            filters:
                - name: parse_number
            selectors:
                - td:nth-of-type(6)
        size:
            filters:
                - name: parse_size
            selectors:
                - td:nth-of-type(5)
        subtitle:
            selectors:
                - td.embedded > span:last
        time:
            selectors:
                - td:nth-of-type(4)
    rows:
        selectors:
            - table.torrents-table > tbody > tr[data-torrent-id]
tags:
    - 综合
    - 影视
    - 音乐
    - 电子书
    - 有声书
    - 体育
    - 游戏
timezone_offset: "+0800"
urls:
    - https://audiences.me/
# Audiences 自定义皮肤：无 NexusPHP font.color_* 锚点（仅 theme.css 定义了类名，HTML 不用），
# 首页用户条用于发现 uid+用户名，用户详情页的 ud-stat 卡片提供完整统计
# （<div class="ud-stat__body"><div class="ud-stat__value">V</div>
# <div class="ud-stat__label">L</div></div>）。故 base 页 index.php 只用于发现 uid+用户名，
# 上传/下载/分享率/爆米花/等级/加入时间均从 userdetails.php 的 ud-stat + hero meta 抽取
# （detail_fields 校准自 gntv 真页：2.778 TB / 508.31 GB / 5.595 / 564831.6 / Crazy User / 2024-12-05）。
# 逐键合并：此处覆盖的键胜出，其余（name/email 默认 rowhead）best-effort 留空（name 由 usercp 链接兜底）。
user_info:
    path: index.php
    user_torrent_list_api: "/getusertorrentlistajax.php?userid={id}&type={type}"
    fields:
        id:
            attr: href
            filters:
                - name: queryparam
                  args: id
            selectors:
                - ".site-userbar__name a[href*='userdetails.php'][href*='id=']:first"
                - "#info_block a[href*='userdetails.php'][href*='id=']:first"
                - "a[href*='userdetails.php'][class*='Name']:first"
                - "a[href*='userdetails.php']:first"
        name:
            selectors:
                - ".site-userbar__name a[href*='userdetails.php'][href*='id=']:first"
                - ".ud-hero__name a[href*='userdetails.php']:first"
                - "#info_block a[href*='userdetails.php'][href*='id=']:first"
                - "a[href*='userdetails.php'][class*='Name']:first"
                - "a[href*='userdetails.php']:first"
        uploaded:
            selectors:
                - ".site-userbar__compact-metric--uploaded"
                - "font.color_uploaded, span.color_uploaded"
            filters:
                - name: parse_size
        downloaded:
            selectors:
                - ".site-userbar__compact-metric--downloaded"
                - "font.color_downloaded, span.color_downloaded"
            filters:
                - name: parse_size
        ratio:
            selectors:
                - ".site-userbar__compact-metric--ratio"
            filters:
                - name: parse_number
        bonus:
            selectors:
                - ".site-userbar__compact-metric--bonus"
                - "td.rowhead:contains('爆米花') + td"
                - "td.rowhead:contains('Karma Points') + td"
            filters:
                - name: parse_number
        seeding:
            selectors:
                - ".site-userbar__compact-metric-inline-link--seeding"
            filters:
                - name: parse_number
        leeching:
            selectors:
                - ".site-userbar__compact-metric-inline-link--leeching"
            filters:
                - name: parse_number
    detail_fields:
        uploaded:
            selectors:
                - 'div.ud-stat__body:contains("上传量") div.ud-stat__value'
            filters:
                - name: parse_size
        downloaded:
            selectors:
                - 'div.ud-stat__body:contains("下载量") div.ud-stat__value'
            filters:
                - name: parse_size
        ratio:
            selectors:
                - 'div.ud-stat__body:contains("分享率") div.ud-stat__value'
        bonus:
            selectors:
                - 'div.ud-stat__body:contains("爆米花") div.ud-stat__value'
            filters:
                - name: parse_number
        level:
            selectors:
                - span.ud-class b
                - b[class$="_Name"]
        join_date:
            parent: true
            selectors:
                - i.fa-calendar-plus
            filters:
                - name: regexp
                  args: '(\d{4}-\d{2}-\d{2})'
        # 做种数：用户条「活跃 ↑N / ↓M」徽标，title 属性含计数（span.site-userbar__compact-metric--active）。
        # 详情页校准自 gntv：做种 75 / 下载 0。做种体积(seeding_size)/时魔(bonus_per_hour) 另由适配器 ajax/mybonus 取。
        seeding:
            attr: title
            selectors:
                - span.site-userbar__compact-metric--active
                - '[title*="活跃"]'
            filters:
                - name: regexp
                  args: '活跃[^0-9]*(\d+)'
    pages:
        - path: mybonus.php
          fields:
              bonus_per_hour:
                  filters:
                      - name: regexp
                        args: '(?i)(?:你当前每小时能获取|你當前每小時能獲取|You are currently getting|currently\s+getting)[^0-9]{0,60}([\d.,]+\.?\d*)'
                      - name: parse_number
                  selectors:
                      - ".mybonus-side__rate"
                      - "div:contains('你当前每小时能获取')"
                      - "td:contains('你当前每小时能获取')"
                      - "div:contains('你當前每小時能獲取')"
                      - "td:contains('你當前每小時能獲取')"
                      - "div:contains('currently getting')"
                      - "td:contains('currently getting')"
# 勋章墙：商店页是 medal_center.php（非默认 medal.php）；货币=爆米花（解析器按 meta-k 自动推断）。
# enabled 必须显式 true——EnsureDefaults 仅在 ShopPath 为空时才默认开启，自定义路径须手动开启。
medal:
    enabled: true
    shop_path: medal_center.php
