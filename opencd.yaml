description: 皇后，专一的音乐类PT站，是目前国内最大的无损音乐PT
id: opencd
level_requirements:
    - id: 1
      name: User
      name_aka:
        - 採女-正八品
      privilege: 新用户的默认级别；可以查看NFO/LOG文档。
    - id: 2
      interval: P5W
      name: Power User
      name_aka:
        - 常在-正七品
      privilege: 得到一个邀请名额；可以请求续种； 可以发送邀请； 可以查看排行榜；可以查看其它用户的种子历史(如果用户隐私等级未设置为"强")； 可以删除自己上传的字幕。
      ratio: 1.5
    - id: 3
      interval: P10W
      name: Elite User
      name_aka:
        - 贵人-正六品
      privilege: 得到两个邀请名额；贵人-正六品(Elite User)及以上用户封存账号后规定时间内不会被删除；发布三个种子后无需经过候选 可直接发布种子。
      ratio: 2
    - id: 4
      interval: P15W
      name: Crazy User
      name_aka:
        - 良媛-正五品
      privilege: 得到三个邀请名额；可以在做种/下载/发布的时候选择匿名模式。
      ratio: 2.5
    - id: 5
      interval: P20W
      name: Insane User
      name_aka:
        - 容华-正四品
      privilege: 得到四个邀请名额；可以查看普通日志。
      ratio: 3
    - id: 6
      interval: P25W
      is_kept: true
      name: Veteran User
      name_aka:
        - 贵嫔-正三品
      privilege: 得到五个邀请名额；可以查看用户列表，可以查看其它用户的评论、帖子历史。贵嫔-正三品(Veteran User)及以上用户会永远保留账号。
      ratio: 3.5
    - id: 7
      interval: P25W
      is_kept: true
      name: Extreme User
      name_aka:
        - 淑仪-正二品
      privilege: 得到六个邀请名额；可以更新过期的外部信息。
      ratio: 4
    - id: 8
      interval: P30W
      is_kept: true
      name: Ultimate User
      name_aka:
        - 贵妃-正一品
      privilege: 得到七个邀请名额；查看种子文件的结构。
      ratio: 4.5
    - id: 9
      interval: P30W
      is_kept: true
      name: Nexus Master
      name_aka:
        - 皇后
      privilege: 得到十个邀请名额。
      ratio: 5
