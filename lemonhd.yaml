# lemonhd - user_info overrides migrated from PT-depiler and covered by mock tests; dead site retained.
# schema: nexusphp; defaults fill common NexusPHP fields.

aka:
    - 柠檬不酸
dead: true
description: 柠檬不酸
id: lemonhd
level_requirements:
    - name: User
    - downloaded: 200GB
      id: 1
      interval: P5W
      name: Power User
      privilege: 可以查看NFO文档；可以请求续种；可以查看其它用户的种子历史(如果用户隐私等级未设置为"强")； 可以删除自己上传的字幕。
      ratio: 2
    - downloaded: 500GB
      id: 2
      interval: P10W
      name: Elite User
      privilege: 同Power User
      ratio: 2.5
    - downloaded: 1TB
      id: 3
      interval: P15W
      name: Crazy User
      privilege: 可以在做种/下载/发布的时候选择匿名模式。
      ratio: 3
    - downloaded: 2TB
      id: 4
      interval: P20W
      name: Insane User
      privilege: 同Crazy User。
      ratio: 3.5
    - downloaded: 4TB
      id: 5
      interval: P25W
      name: Veteran User
      privilege: 可以查看其它用户的评论、帖子历史。Veteran User及以上用户封存账号后不会被删除。
      ratio: 4
    - downloaded: 6TB
      id: 6
      interval: P30W
      name: Extreme User
      privilege: 可以更新过期的外部信息；可以查看Extreme User论坛。
      ratio: 4.5
    - downloaded: 8TB
      id: 7
      interval: P45W
      is_kept: true
      name: Ultimate User
      privilege: Ultimate User及以上用户会永远保留账号，但不等于不会被封禁。此等级以上（含）免除站点定期进行的数据增量考核。
      ratio: 5
    - downloaded: 10TB
      id: 8
      interval: P65W
      is_kept: true
      name: Nexus Master
      privilege: 被视为站点精英成员，免除站点数据增量考核，永久保留账号；可以直接发布种子；可以查看排行榜；可以在网站开放邀请期间发送邀请，管理员设置的特殊情况除外；
      ratio: 5.5
name: LemonHD
schema: nexusphp
tags:
    - 综合
timezone_offset: "+0800"
urls:
    - https://lemonhd.club/
user_info:
    path: index.php
    user_torrent_list_api: "/getusertorrentlistajax.php?userid={id}&type={type}"
    fields:
        seeding:
            parent: true
            filters:
                - name: regexp
                  args: '(\d[\d,]*)'
                - name: parse_number
            selectors:
                - img.arrowup
    detail_fields:
        seeding_size:
            filters:
                - name: regexp
                  args: '([\d.,]+\s*(?:[KMGTPE]i?B|Bytes))'
                - name: parse_size
            selectors:
                - "td.rowhead:contains('当前做种') + td"
                - "td.rowhead:contains('Current Seeding') + td"
    pages:
        - path: mybonus.php
          fields:
              bonus_per_hour:
                  filters:
                      - name: regexp
                        args: '(?i)(?:能获取|能獲取|currently\s+getting)[^0-9-+]{0,24}([-+]?[\d,]+\.?\d*)'
                      - name: parse_number
                  selectors:
                      - "div:contains('你当前每小时能获取')"
                      - "div:contains('You are currently getting')"
                      - "div:contains('你當前每小時能獲取')"
