# gazellegames - PT-depiler API behavior covered by mock tests; live smoke still recommended.
# schema: gazelle_jsonapi; uses X-API-Key with /api.php quick_user/search/user.

aka:
    - GGn
description: GazelleGames is a Private gaming tracker
id: gazellegames
level_requirements:
    - id: 1
      name: Amateur
    - id: 2
      name: Gamer
      privilege: Can send invites
      seeding_bonus: 600
    - id: 3
      is_kept: true
      name: Pro Gamer
      privilege: Access to the Pro Gamers forum and Invites forum; Immunity from inactivity pruning
      seeding_bonus: 1200
    - id: 4
      is_kept: true
      name: Elite Gamer
      privilege: Edit any torrent; Immunity from Hit 'n' Runs
      seeding_bonus: 2100
    - id: 5
      is_kept: true
      name: Legendary Gamer
      privilege: Access to the Legendary Gamer Invites forum
      seeding_bonus: 3000
    - id: 6
      is_kept: true
      name: Master Gamer
      seeding_bonus: 4200
    - id: 7
      is_kept: true
      name: Gaming God
      privilege: Can send unlimited Invites
      seeding_bonus: 6000
name: GazelleGames
schema: gazelle_jsonapi
search_entry: /api.php
search_param: searchstr
tags:
    - 游戏
timezone_offset: "+0000"
urls:
    - https://gazellegames.net/
user_info:
    fields:
        bonus:
            selector: response.stats.gold
        bonus_per_hour:
            selector: response.community.hourlyGold
        seeding_size:
            filters:
                - name: parse_size
            selector: response.community.seedSize
