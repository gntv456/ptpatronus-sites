name: 憨憨
schema: nexusphp
selectors:
    fields:
        completed:
            selector: .torrent-info-text-finished
        detail:
            attr: href
            filters:
                - args: id
                  name: queryparam
                - args: /details.php?id=
                  name: prepend
            selectors:
                - a[href*="download.php?id="]
        download:
            attr: href
            selectors:
                - a[href*="download.php?id="]
        leechers:
            selector: .torrent-info-text-leechers
        seeders:
            selector: .torrent-info-text-seeders
        size:
            filters:
                - name: parse_size
            selector: .torrent-info-text-size
        subtitle:
            selectors:
                - .torrent-title .torrent-info-text-small_name
        time:
            selector: .torrent-info-text-added
        title:
            selectors:
                - .torrent-title a[href^='details.php']
    rows:
        selector: .torrent-table-sub-info
tags:
    - 电影
    - 电视剧
timezone_offset: "+0800"
urls:
    - https://hhanclub.net/
user_info:
    path: index.php
    user_torrent_list_api: "/getusertorrentlistajax.php?userid={id}&type={type}"
    fields:
        id:
            attr: href
            filters:
                - name: queryparam
                  args: id
            selectors:
                - "#info_block a[href*='userdetails.php'][href*='id=']:first"
                - "a[href*='userdetails.php'][class*='Name']:first"
                - "a[href*='userdetails.php']:first"
        name:
            selectors:
                - "#info_block a[href*='userdetails.php'][href*='id=']:first"
                - "a[href*='userdetails.php'][class*='Name']:first"
                - "a[href*='userdetails.php']:first"
        level:
            attr: class
            filters:
                - name: regexp
                  args: (.*)_Name
            selectors:
                - "a[href*='userdetails.php'][class*='_Name']"
    detail_fields:
        uploaded:
            filters:
                - name: parse_size
            selectors:
                - "span:contains('上传量') + span"
                - "span:contains('上傳量') + span"
                - "span:contains('Uploaded') + span"
        downloaded:
            filters:
                - name: parse_size
            selectors:
                - "span:contains('下载量') + span"
                - "span:contains('下載量') + span"
                - "span:contains('Downloaded') + span"
        ratio:
            filters:
                - name: parse_number
            selectors:
                - "span:contains('分享率') + span"
                - "span:contains('Ratio') + span"
        level:
            attr: class
            filters:
                - name: regexp
                  args: (.*)_Name
            selectors:
                - "a[href*='userdetails.php'][class*='_Name']"
        join_date:
            filters:
                - name: regexp
                  args: '(\d{4}[-/]\d{1,2}[-/]\d{1,2})'
            selectors:
                - "span:contains('加入日期') + span"
                - "span:contains('Join') + span"
        bonus:
            filters:
                - name: parse_number
            selectors:
                - "span:contains('憨豆') + div"
                - "span:contains('憨豆') + span"
        seeding:
            filters:
                - name: parse_number
            selectors:
                - "a[href*='userdetails.php'][href*='action=2'] div"
                - "span:contains('当前做种') + span"
                - "span:contains('當前做種') + span"
    pages:
        - path: mybonus.php
          fields:
              bonus_per_hour:
                  filters:
                      - name: parse_number
                  selectors:
                      - ".grid .row-span-4"
                      - "div:contains('你当前每小时能获取')"
                      - "div:contains('You are currently getting')"
              seeding_bonus_per_hour:
                  filters:
                      - name: parse_number
                  selectors:
                      - "div:contains('你当前每小时能获取'):last"
                      - "div:contains('You are currently getting'):last"
                      - "div:contains('你當前每小時能獲取'):last"
        - path: rescuesettleinfo.php
          fields:
              rescue_seeding_bonus_per_hour:
                  attr: html
                  filters:
                      - name: hhanclub_rescue_bonus_per_hour
                  selectors:
                      - ":self"
