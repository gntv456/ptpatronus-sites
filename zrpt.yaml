level_requirements:
    - name: Peasant
      privilege: 被降级的用户，他们有30天时间来提升分享率，否则他们会被踢。不能发表趣味盒内容；不能申请友情链接；不能上传字幕。
    - id: 1
      name: User
      privilege: 新用户的默认级别。只能在每周六中午12点至每周日晚上11点59分发布种子。
    - downloaded: 50GB
      id: 2
      interval: P4W
      name: Power User
      privilege: 得到一个邀请名额；可以直接发布种子；可以查看NFO文档；可以查看用户列表；可以请求续种；可以发送邀请；可以查看排行榜；可以查看其它用户的种子历史；可以删除自己上传的字幕。
      ratio: 1.05
    - downloaded: 120GB
      id: 3
      interval: P8W
      name: Elite User
      privilege: Elite User及以上用户封存账号后不会被删除。
      ratio: 1.55
    - downloaded: 300GB
      id: 4
      interval: P15W
      name: Crazy User
      privilege: 得到两个邀请名额；可以在做种/下载/发布的时候选择匿名模式。
      ratio: 2.05
    - downloaded: 500GB
      id: 5
      interval: P25W
      name: Insane User
      privilege: 可以查看普通日志。
      ratio: 2.55
    - downloaded: 750GB
      id: 6
      interval: P40W
      is_kept: true
      name: Veteran User
      privilege: 得到三个邀请名额；可以查看其它用户的评论、帖子历史。Veteran User及以上用户会永远保留账号。
      ratio: 3.05
    - downloaded: 1TB
      id: 7
      interval: P60W
      is_kept: true
      name: Extreme User
      privilege: 可以更新过期的外部信息；可以查看Extreme User论坛。
      ratio: 3.55
    - downloaded: 1.5TB
      id: 8
      interval: P80W
      is_kept: true
      name: Ultimate User
      privilege: 得到五个邀请名额。
      ratio: 4.05
    - downloaded: 3TB
      id: 9
      interval: P100W
      is_kept: true
      name: Nexus Master
      privilege: 得到十个邀请名额。
      ratio: 4.55
name: ZRPT
schema: nexusphp
selectors:
    fields:
        title:
            selectors:
                - a[href*='details.php?id='][title]
                - a[href*='details.php?id=']
tags:
    - 纪录片
    - 自然
    - 教育
urls:
    - https://zrpt.cc/
user_info:
    fields:
        bonus:
            filters:
                - name: parse_number
            selectors:
                - td.rowhead:contains('魔力值') + td
                - td.rowhead:contains('积分') + td
                - li:contains('魔力值')
                - td:contains('魔力值')
                - li:contains('积分:')
                - td:contains('积分:')
        level:
            attr: title
            filters:
                - args: ^(?:.*\))?\s*(.+)$
                  name: regexp
            selectors:
                - td.rowhead:contains('等级') + td > img
    detail_fields:
        level:
            attr: title
            filters:
                - args: ^(?:.*\))?\s*(.+)$
                  name: regexp
            selectors:
                - td.rowhead:contains('等级') + td > img
        bonus: # userdetails.php rowhead 行（uid 可发现时经自动合并补抓）
            filters:
                - name: parse_number
            selectors:
                - td.rowhead:contains('魔力值') + td
                - td.rowhead:contains('积分') + td
                - li:contains('魔力值')
                - td:contains('魔力值')
                - li:contains('积分:')
                - td:contains('积分:')
