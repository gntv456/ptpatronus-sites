# aura4k — 自动生成自 PT-depiler（tools/convert-definitions.go）。
# schema: unit3d。已由本项目运行时 schema adapter 支持。
aka:
    - A4K
id: aura4k
level_requirements:
    - name: Leech
      privilege: 1下载槽 上传种子
      ratio: 0.4
    - id: 1
      name: User
      privilege: 3下载槽 上传种子
      ratio: 0.4
    - id: 2
      interval: P1M
      name: Bright Light
      privilege: 5下载槽 上传种子
      ratio: 0.5
      uploaded: 1TiB
    - id: 3
      interval: P2M
      name: Radiant
      privilege: 8下载槽 上传种子 发送邀请
      ratio: 0.6
      uploaded: 5TiB
      uploads: 10
    - id: 4
      interval: P3M
      name: Luminous
      privilege: 10下载槽 上传种子 发送邀请 访问邀请区
      ratio: 0.75
      uploaded: 20TiB
      uploads: 25
    - id: 5
      interval: P6M
      name: Ethereal
      privilege: 25下载槽 上传种子 发送邀请 免疫自动 HnR 警告 访问邀请区
      ratio: 1
      uploaded: 50TiB
      uploads: 50
    - id: 6
      interval: P1Y
      name: Eternal
      privilege: 无限下载槽 上传种子 发送邀请 全站免费 免疫自动 HnR 警告 访问邀请区
      ratio: 1
      uploaded: 100TiB
      uploads: 100
    - id: 7
      interval: P6M
      name: Beacon
      privilege: 50下载槽 上传种子 发送邀请 免疫自动 HnR 警告 访问邀请区
      ratio: 1
    - id: 8
      interval: P3M
      name: Resonator
      privilege: 无限下载槽 上传种子 发送邀请 全站免费 免疫自动 HnR 警告 访问邀请区
      ratio: 1
name: Aura4k
schema: unit3d
selectors:
    fields:
        category:
            data: categoryId
            filters:
                - args: 1=Movies:::2=TV
                  name: map
            selector: :self
tags:
    - 综合
timezone_offset: "+0000"
urls:
    - https://aura4k.net/
user_info:
    fields:
        bonus_per_hour:
            filters:
                - name: parse_number
            selectors:
                - main aside section > div:nth-child(2) > div:nth-child(4) > div
        level:
            attr: title_or_text
            selectors:
                - .wow-badges .wow-badge:first-child
