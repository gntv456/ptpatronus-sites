# freefarm（自由农场 / Farmm，pt.0ff.cc）—— schema: nexusphp。
# 2026-11-08 改版适配：首页换 n8 主题，旧 info_block 消失，用户统计改走
# .n8-deck-grid .n8-cell 卡片（<span>标签</span><b>值</b>）；搜索列表
# table.torrents 与 userdetails/mybonus 的 rowhead 表未变，沿用默认/旧选择器。
# 魔力值等大数以「102.2万」中文数量级显示——parse_number 已支持万/亿后缀乘算。

aka:
    - FreeFarm
    - Farmm
categories:
    - id: "401"
      name: Movies|电影
    - id: "402"
      name: TV Series|电视剧
    - id: "403"
      name: Documentaries|纪录片
    - id: "404"
      name: TV Shows|综艺
    - id: "405"
      name: Animations|动漫
    - id: "406"
      name: Music Videos|音乐视频
    - id: "407"
      name: HD Music|无损音乐
    - id: "408"
      name: Sports|体育
description: 自由农场
id: freefarm
level_requirements:
    - name: User
      privilege: 新用户的默认级别
    - downloaded: 50GB
      id: 1
      interval: P4W
      name: Power User
      privilege: 可以直接发布种子；可以查看NFO文档；可以查看用户列表；可以请求续种； 可以发送邀请； 可以查看排行榜；可以查看其它用户的种子历史(如果用户隐私等级未设置为"强")； 可以删除自己上传的字幕。
      ratio: 1.05
      seeding_bonus: 40000
    - downloaded: 120GB
      id: 2
      interval: P8W
      name: Elite User
      privilege: Elite User及以上用户封存账号后不会被删除。
      ratio: 1.55
      seeding_bonus: 80000
    - downloaded: 300GB
      id: 3
      interval: P15W
      name: Crazy User
      privilege: 可以在做种/下载/发布的时候选择匿名模式。
      ratio: 2.05
      seeding_bonus: 150000
    - downloaded: 500GB
      id: 4
      interval: P25W
      name: Insane User
      privilege: 可以查看普通日志。
      ratio: 2.55
      seeding_bonus: 250000
    - downloaded: 750GB
      id: 5
      interval: P40W
      is_kept: true
      name: Veteran User
      privilege: 可以查看其它用户的评论、帖子历史。Veteran User及以上用户会永远保留账号。
      ratio: 3.05
      seeding_bonus: 400000
    - downloaded: 1TB
      id: 6
      interval: P60W
      is_kept: true
      name: Extreme User
      privilege: 可以更新过期的外部信息；可以查看Extreme User论坛。
      ratio: 4.55
      seeding_bonus: 800000
    - downloaded: 1.5TB
      id: 7
      interval: P80W
      is_kept: true
      name: Ultimate User
      privilege: 无
      ratio: 5.85
      seeding_bonus: 2000000
    - downloaded: 3TB
      id: 8
      interval: P100W
      is_kept: true
      name: Nexus Master
      privilege: 得到十个邀请名额。
      ratio: 6.45
      seeding_bonus: 4000000
name: 自由农场
schema: nexusphp
tags:
    - 电视剧
    - 韩剧
    - 日剧
timezone_offset: "+0800"
urls:
    - https://pt.0ff.cc/
user_info:
    path: index.php
    user_torrent_list_api: "/getusertorrentlistajax.php?userid={id}&type={type}"
    fields:
        id:
            attr: href
            filters:
                - name: queryparam
                  args: id
            selectors:
                - ".n8-hero a[href*='userdetails.php?id=']:first"
        name:
            selectors:
                - ".n8-hero a[href*='userdetails.php?id=']:first"
        uploaded:
            filters:
                - name: parse_size
            selectors:
                - ".n8-deck-grid .n8-cell:contains('上传') b"
        downloaded:
            filters:
                - name: parse_size
            selectors:
                - ".n8-deck-grid .n8-cell:contains('下载') b"
        ratio:
            filters:
                - name: parse_number
            selectors:
                - ".n8-deck-grid .n8-cell:contains('分享率') b"
        bonus:
            filters:
                - name: parse_number
            selectors:
                - ".n8-deck-grid .n8-cell:contains('魔力值') b"
        seeding:
            selectors:
                - ".n8-deck-grid .n8-cell:contains('当前活动')"
            filters:
                - name: regexp
                  args: '↑(\d+)'
        leeching:
            selectors:
                - ".n8-deck-grid .n8-cell:contains('当前活动')"
            filters:
                - name: regexp
                  args: '↓(\d+)'
    detail_fields:
        uploaded:
            filters:
                - name: regexp
                  args: '(?i)(?:上传量|上傳量|Uploaded)[\s\S]{0,160}?([\d.,]+\s*(?:[KMGTPE]i?B|Bytes|B))'
                - name: parse_size
            selectors:
                - "td.rowhead:contains('传输') + td"
                - "td.rowhead:contains('傳送') + td"
                - "td.rowhead:contains('Transfers') + td"
        downloaded:
            filters:
                - name: regexp
                  args: '(?i)(?:下载量|下載量|Downloaded)[\s\S]{0,160}?([\d.,]+\s*(?:[KMGTPE]i?B|Bytes|B))'
                - name: parse_size
            selectors:
                - "td.rowhead:contains('传输') + td"
                - "td.rowhead:contains('傳送') + td"
                - "td.rowhead:contains('Transfers') + td"
        ratio:
            filters:
                - name: regexp
                  args: '(?i)(?:分享率|Ratio)[\s\S]{0,120}?([\d.]+|无限|無限|Inf\.?|Infinity)'
                - name: replace
                  args: 无限:::9999
                - name: replace
                  args: 無限:::9999
                - name: replace
                  args: Infinity:::9999
                - name: replace
                  args: Inf.:::9999
            selectors:
                - "td.rowhead:contains('传输') + td"
        level:
            attr: title
            selectors:
                - "td.rowhead:contains('等级') + td > img"
                - "td.rowhead:contains('等級') + td > img"
                - "td.rowhead:contains('Class') + td > img"
        join_date:
            filters:
                - name: regexp
                  args: '(\d{4}[-/]\d{1,2}[-/]\d{1,2})'
            selectors:
                - "td.rowhead:contains('加入日期') + td"
                - "td.rowhead:contains('Join'):contains('date') + td"
        bonus:
            filters:
                - name: parse_number
            selectors:
                - "td.rowhead:contains('魔力值') + td"
                - "td.rowhead:contains('Karma Points') + td"
                - "td.rowfollow:contains('魔力值')"
        seeding_size:
            filters:
                - name: parse_size
            selectors:
                - "td.rowhead:contains('当前做种') + td"
                - "td.rowhead:contains('目前做種') + td"
                - "td.rowhead:contains('Current Seeding') + td"
                - "td.rowhead:contains('Seeding Size') + td"
    pages:
        - path: mybonus.php
          fields:
              bonus_per_hour:
                  filters:
                      - name: parse_number
                  selectors:
                      - "td[rowspan='3']"
                      - "td[rowspan=\"3\"]"
