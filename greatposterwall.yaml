      interval: P2W
      is_kept: true
      name: Power User
      privilege: 免疫账号不活跃；发送邀请；赠送1枚邀请；访问论坛的「求邀区」「发邀区」「Power User」
      ratio: 1.2
      uploads: 1
    - id: 3
      interval: P4W
      is_kept: true
      name: Elite
      privilege: 赠送1枚邀请；访问论坛的「Elite」；检查自己发布的种子；编辑所有种子
      ratio: 1.2
      uploads: 25
    - id: 4
      interval: P8W
      is_kept: true
      name: Torrent Master
      privilege: 赠送2枚邀请；每月获赠1枚临时邀请；访问论坛的「Torrent Master」
      ratio: 1.2
      uploads: 100
    - id: 5
      interval: P12W
      is_kept: true
      name: Power Torrent Master
      name_aka:
        - Power TM
      privilege: 赠送2枚邀请；每月获赠2枚临时邀请；检查所有种子
      ratio: 1.2
      uploads: 250
    - id: 6
      interval: P16W
      is_kept: true
      name: Elite Torrent Master
      name_aka:
        - Elite TM
      privilege: 赠送3枚邀请；每月获赠3枚临时邀请；访问论坛的「Elite Torrent Master」
      ratio: 1.2
      uploads: 500
    - id: 7
      interval: P20W
      is_kept: true
      name: Guru
      privilege: 无限邀请；访问论坛的「Guru」；查看种子检查日志
      ratio: 1.2
      uploads: 1000
name: GreatPosterWall
schema: gazelle_jsonapi
tags:
    - 电影
timezone_offset: "+0800"
urls:
    - https://greatposterwall.com/
user_info:
    fields:
        id:
            selector: id
        name:
            selector: username
        uploaded:
            selector: userstats.uploaded
        downloaded:
            selector: userstats.downloaded
        ratio:
            filters:
                - name: replace
                  args: Infinity:::9999
                - name: replace
                  args: infinity:::9999
                - name: replace
                  args: Inf:::9999
                - name: replace
                  args: inf:::9999
                - name: replace
                  args: ∞:::9999
                - name: replace
                  args: -1:::9999
            selector: userstats.ratio
        level:
            selector: userstats.class
        bonus:
            selector: userstats.bonusPoints
        bonus_per_hour:
            selector: userstats.bonusPointsPerHour
        seeding_bonus_per_hour:
            selector: userstats.seedingBonusPointsPerHour
        seeding:
            selector: userstats.seedingCount
        leeching:
            selector: userstats.leechingCount
        seeding_size:
            selector: userstats.seedingSize
        join_date:
            selector: userstats.joinedDate
        last_access_at:
            selector: userstats.lastAccess
        claim_count:
            text: "0"
        max_claim:
            text: "0"
    pages:
        - path: /ajax.php
          params:
              action: user
              id: "{id}"
          format: json
          fields:
              avatar:
                  selector: response.avatar
                  filters:
                      - name: clean_avatar
              is_donor:
                  selector: response.personal.donor
                  filters:
                      - name: bool
              uploads:
                  selector: response.community.uploaded
              unique_groups:
                  selector: response.community.groups
              perfect_flac:
                  selector: response.community.perfectFlacs
              invited:
                  selector: response.community.invited
              join_date:
                  selector: response.stats.joinedDate
              last_access_at:
                  selector: response.stats.lastAccess
        - path: /user.php
          params:
              id: "{id}"
          format: html
          fields:
              avatar:
                  attr: src
                  filters:
                      - name: clean_avatar
                  selector: .HeaderProfile-avatar
              true_downloaded:
                  attr: data-tooltip
                  filters:
                      - name: last_size
                  selector: '#downloaded-value span[data-tooltip]:not([data-tooltip=""])'
