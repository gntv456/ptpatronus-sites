# beyondhd — schema: f3nix。API POST 搜索、下载 fallback、用户信息与做种体积已由 GenericJSON mock 覆盖；真实站点仍建议 live smoke。

aka:
    - BHD
description: |-
    Beyond Your Imagination, BeyondHD is a community-built Movie/TV database.Every piece of data has been added by our amazing community since 2012.
id: beyondhd
level_requirements:
    - id: 1
      name: Recruit
      privilege: Can Download; Can rescue 5 torrents per day until 25 pending completion; Members in this class are capped at receiving 1,000 BP in gifts/tips per member.
      ratio: 0.25
    - id: 2
      interval: P14D
      name: User
      privilege: Can Request Reseeds; Can Request Torrents; Can Remove HNRs (with BP); Bypass Upload Moderation; Change Avatar;Can rescue 6 torrents per day until 30 pending completion.
      ratio: 0.25
      seeding_time: P25D
      uploaded: 50GiB
    - id: 3
      interval: P1M
      name: Member
      privilege: View Workhouse; View Internals; View Staff; View Site Stats; Change Title; Change About; Change Signature; Can rescue 10 torrents per day until 30 pending completion.
      ratio: 0.4
      seeding_time: P8M10D
      uploaded: 400GiB
    - id: 4
      interval: P3M
      name: Expert
      privilege: Send Invites; View Torrent Peers; View Torrent History; Change Profile Cover; Can rescue 11 torrents per day until 33 pending completion.
      ratio: 0.55
      seeding_time: P2Y20D
      uploaded: 800GiB
    - id: 5
      interval: P6M
      name: Pro
      privilege: View Invite Forum; View Chat History; Can rescue 12 torrents per day until 36 pending completion.
      ratio: 0.7
      seeding_time: P4Y11M
      uploaded: 1.25TiB
    - id: 6
      interval: P9M
      name: Elite
      privilege: Can rescue 15 torrents per day until 45 pending completion. Receive 2 FL token(s) for every 30 days this class is retained.
      ratio: 0.85
      seeding_time: P9Y3M
      uploaded: 2.5TiB
    - id: 7
      interval: P1Y
      name: Master
      privilege: View Torrent Changes; View Movie / TV Edits; Can rescue 16 torrents per day until 48 pending completion. Receive 2 FL token(s) for every 30 days this class is retained. Receive 25% discount on all downloads.
      ratio: 1
      seeding_time: P41Y1M5D
      uploaded: 8TiB
    - id: 8
      interval: P2Y
      name: King
      privilege: Edit Movie / TV Details; Can rescue 20 torrents per day until 60 pending completion. Receive 2 FL token(s) for every 30 days this class is retained. Receive 50% discount on all downloads.
      ratio: 1.25
      seeding_time: P123Y3M15D
      uploaded: 24TiB
    - id: 9
      interval: P5Y
      name: Emperor
      privilege: Can rescue 40 torrents per day until 120 pending completion. Receive 5 FL token(s) for every 30 days this class is retained. Receive 1 invite(s) for every 30 days this class is retained. Receive 100% discount on all downloads.
      ratio: 4
      seeding_time: P123Y3M15D
      uploaded: 96TiB
    - group_type: vip
      id: 100
      name: Pirater
    - group_type: vip
      id: 101
      name: Celebrity
    - group_type: vip
      id: 102
      name: Legend
    - group_type: vip
      id: 103
      name: Uploader
    - group_type: vip
      id: 104
      name: Internal
    - group_type: manager
      id: 200
      name: Moderator
    - group_type: manager
      id: 201
      name: Bot
    - group_type: manager
      id: 202
      name: SysOp
name: BeyondHD
schema: f3nix
search_entry: /api/torrents
search_param: search
selectors:
    fields:
        category:
            selector: category
        completed:
            selector: times_completed
        detail:
            selector: url
        download:
            filters:
                - args: "/torrents/:::/download/"
                  name: replace
            selectors:
                - download_url
                - url
        leechers:
            selector: leechers
        seeders:
            selector: seeders
        size:
            selector: size
        time:
            filters:
                - name: parse_time
            selector: created_at
        title:
            selector: name
    rows:
        selector: results
tags:
    - 电影
    - 电视剧
timezone_offset: "+0000"
urls:
    - https://beyond-hd.me/
user_info:
    fields:
        bonus:
            filters:
                - name: parse_number
            selectors:
                - ul#beta-stats li a:has(i.fas.fa-star)
        bonus_per_hour:
            filters:
                - name: parse_number
            selectors:
                - .panel-body.no-padding .hd-table > div:first-child .class-bold
        downloaded:
            filters:
                - name: parse_size
            selectors:
                - ul#beta-stats li a:has(i.fas.fa-arrow-down)
        id:
            attr: content
            selectors:
                - meta[name='secret-id']
        join_date:
            filters:
                - args: 'Member Since:\s*(\d{4}-\d{2}-\d{2})'
                  name: regexp
                - args: '[yyyy-MM-dd]'
                  name: parse_time
            selectors:
                - 'div.button-holder h5:contains(''Member Since: '')'
        leeching:
            selectors:
                - .button-right .bhd-block:nth-child(2) .bhd-tidbit-icon
        level:
            attr: title
            selectors:
                - div[style*='margin-left'] a.beta-alert
        name:
            attr: title
            selectors:
                - img.beta-image-avatar
        ratio:
            filters:
                - name: parse_number
            selectors:
                - ul#beta-stats li a:has(span > i.fas.fa-sync-alt)
        seeding:
            filters:
                - name: parse_number
            selectors:
                - ul#beta-stats li a:has(i.fas.fa-seedling)
        seeding_size:
            filters:
                - name: parse_size
            selectors:
                - td.bhd-user-left:contains('Active Seed Size') + td span.badge-user
        uploaded:
            filters:
                - name: parse_size
            selectors:
                - ul#beta-stats li a:has(i.fas.fa-arrow-up)
        uploads:
            filters:
                - name: parse_number
            selectors:
                - .button-right .bhd-block:nth-child(1) .class-highlight
    pages:
        - path: /
          format: html
          use_fields:
            - id
            - name
            - uploaded
            - downloaded
            - ratio
            - bonus
            - seeding
        - path: /users/{name}.{id}
          format: html
          use_fields:
            - level
            - uploads
            - leeching
            - join_date
            - seeding_size
        - path: /bp
          format: html
          use_fields:
            - bonus_per_hour
