    - group_type: manager
      id: 204
      name: 维护开发员(Sysop)
      privilege: 网站开发/维护人员，可以改变站点设定，不能管理捐赠。
    - group_type: manager
      id: 205
      name: 主管(Staff Leader)
      privilege: 网站主管，可以做任何事。
name: BTSCHOOL
schema: nexusphp
medal:
    enabled: false
    shop_path: medal.php
tags:
    - 影视
    - 综合
    - 学习
timezone_offset: "+0800"
urls:
    - https://pt.btschool.club/
user_info:
    path: index.php
    user_torrent_list_api: "/getusertorrentlistajax.php?userid={id}&type={type}"
    fields:
        id:
            attr: href
            filters:
                - name: queryparam
                  args: id
            selectors:
                - "#info_block a[href*='userdetails.php'][href*='id=']:first"
                - "a[href*='userdetails.php'][class*='Name']:first"
                - "a[href*='userdetails.php']:first"
        name:
            selectors:
                - "#info_block a[href*='userdetails.php'][href*='id=']:first"
                - "a[href*='userdetails.php'][class*='Name']:first"
                - "a[href*='userdetails.php']:first"
        uploaded:
            filters:
                - name: regexp
                  args: '(?i)(?:上传量|上傳量|Uploaded)[\s\S]{0,140}?([\d.,]+\s*(?:[KMGTPE]i?B|Bytes|B))'
                - name: parse_size
            selectors:
                - "td.rowhead:contains('传输') + td"
                - "td.rowhead:contains('傳送') + td"
                - "td.rowhead:contains('Transfers') + td"
                - "#info_block"
        downloaded:
            filters:
                - name: regexp
                  args: '(?i)(?:下载量|下載量|Downloaded)[\s\S]{0,140}?([\d.,]+\s*(?:[KMGTPE]i?B|Bytes|B))'
                - name: parse_size
            selectors:
                - "td.rowhead:contains('传输') + td"
                - "td.rowhead:contains('傳送') + td"
                - "td.rowhead:contains('Transfers') + td"
                - "#info_block"
        ratio:
            filters:
                - name: regexp
                  args: '(?i)(?:分享率|Ratio)[\s\S]{0,120}?([\d.]+|无限|無限|Inf\.?|Infinity)'
                - name: replace
                  args: 无限:::9999
                - name: replace
                  args: 無限:::9999
                - name: replace
                  args: Infinity:::9999
                - name: replace
                  args: Inf.:::9999
            selectors:
                - "td.rowhead:contains('传输') + td"
                - "td.rowhead:contains('傳送') + td"
                - "td.rowhead:contains('Transfers') + td"
                - "#info_block"
        seeding:
            filters:
                - name: regexp
                  args: '(?i)(?:(?:当前活动|当前做种|目前做種|Torrents seeding|Current activity)[^0-9]{0,120}\d+|^\D*\d+\s*(?:torrents?|个|個|种子|種子)):::0'
                - name: parse_number
            selectors:
                - "td.rowhead:contains('当前做种') + td"
                - "td.rowhead:contains('Current Seeding') + td"
                - "td.rowhead:contains('目前做種') + td"
                - "#info_block"
        bonus:
            filters:
                - name: regexp
                  args: '(?i)(?:魔力值|Karma Points)[\s\S]{0,120}?([\d.,]+)'
                - name: parse_number
            selectors:
                - "td.rowhead:contains('魔力值') + td"
                - "td.rowhead:contains('Karma Points') + td"
                - "#info_block"
        seeding_size:
            selectors:
                - "td.rowhead:contains('当前做种') + td"
                - "td.rowhead:contains('Current Seeding') + td"
                - "td.rowhead:contains('目前做種') + td"
            filters:
                - name: regexp
                  args: (?i)([\d.,]+\s*(?:[KMGTPE]i?B|Bytes))
                - name: parse_size
    detail_fields:
        uploaded:
            filters:
                - name: regexp
                  args: '(?i)(?:上传量|上傳量|Uploaded)[\s\S]{0,140}?([\d.,]+\s*(?:[KMGTPE]i?B|Bytes|B))'
                - name: parse_size
            selectors:
                - "td.rowhead:contains('传输') + td"
                - "td.rowhead:contains('傳送') + td"
                - "td.rowhead:contains('Transfers') + td"
        downloaded:
            filters:
                - name: regexp
                  args: '(?i)(?:下载量|下載量|Downloaded)[\s\S]{0,140}?([\d.,]+\s*(?:[KMGTPE]i?B|Bytes|B))'
                - name: parse_size
            selectors:
                - "td.rowhead:contains('传输') + td"
                - "td.rowhead:contains('傳送') + td"
                - "td.rowhead:contains('Transfers') + td"
        ratio:
            filters:
                - name: regexp
                  args: '(?i)(?:分享率|Ratio)[\s\S]{0,120}?([\d.]+|无限|無限|Inf\.?|Infinity)'
                - name: replace
                  args: 无限:::9999
                - name: replace
                  args: 無限:::9999
                - name: replace
                  args: Infinity:::9999
                - name: replace
                  args: Inf.:::9999
            selectors:
                - "td.rowhead:contains('传输') + td"
                - "td.rowhead:contains('傳送') + td"
                - "td.rowhead:contains('Transfers') + td"
        level:
            attr: title
            selectors:
                - "td.rowhead:contains('等级') + td > img"
                - "td.rowhead:contains('等級') + td > img"
                - "td.rowhead:contains('Class') + td > img"
        join_date:
            filters:
                - name: regexp
                  args: '(\d{4}[-/]\d{1,2}[-/]\d{1,2})'
            selectors:
                - "td.rowhead:contains('加入日期') + td"
                - "td.rowhead:contains('Join'):contains('date') + td"
        bonus:
            filters:
                - name: parse_number
            selectors:
                - "td.rowhead:contains('魔力值') + td"
                - "td.rowhead:contains('Karma Points') + td"
        seeding:
            filters:
                - name: regexp
                  args: '(\d+)'
            selectors:
                - "td.rowhead:contains('当前做种') + td"
                - "td.rowhead:contains('Current Seeding') + td"
                - "td.rowhead:contains('目前做種') + td"
        seeding_size:
            filters:
                - name: regexp
                  args: '(?i)([\d.,]+\s*(?:[KMGTPE]i?B|Bytes))'
                - name: parse_size
            selectors:
                - "td.rowhead:contains('当前做种') + td"
                - "td.rowhead:contains('Current Seeding') + td"
                - "td.rowhead:contains('目前做種') + td"
    pages:
        - path: mybonus.php
          fields:
              bonus_per_hour:
                  filters:
                      - name: regexp
                        args: '(?i)(?:能获取|能獲取|currently\s+getting)[^0-9]{0,60}([\d.,]+\.?\d*)'
                      - name: parse_number
                  selectors:
                      - "td.text:contains('你当前每小时能获取')"
                      - "div:contains('你当前每小时能获取')"
                      - "td:contains('你当前每小时能获取')"
                      - "td.text:contains('你當前每小時能獲取')"
                      - "div:contains('你當前每小時能獲取')"
                      - "td:contains('你當前每小時能獲取')"
                      - "div:contains('currently getting')"
                      - "td:contains('currently getting')"
