      ratio: 4
      seeding_bonus: 400000
    - downloaded: 2TB
      id: 7
      interval: P60W
      is_kept: true
      name: Extreme User
      privilege: 更新过期的外部信息；查看Extreme User论坛；永远保留账号
      ratio: 4.5
      seeding_bonus: 600000
    - downloaded: 5TB
      id: 8
      interval: P80W
      is_kept: true
      name: Ultimate User
      privilege: 五个邀请名额
      ratio: 5
      seeding_bonus: 800000
    - downloaded: 10TB
      id: 9
      interval: P100W
      is_kept: true
      name: Nexus Master
      privilege: 十个邀请名额；发送邀请
      ratio: 5.5
      seeding_bonus: 1000000
    - group_type: vip
      id: 100
      name: 贵宾(VIP)
      privilege: 和 Nexus Master 拥有相同权限并被认为是精英成员。免除自动降级。
    - group_type: vip
      id: 101
      name: 其他
      privilege: 自定义等级
    - group_type: manager
      id: 200
      name: 养老族(Retiree)
      privilege: 退休后的管理组成员。
    - group_type: manager
      id: 201
      name: 发布员(Uploader)
      privilege: 专注的发布者。免除自动降级；可以查看匿名用户的真实身份。
    - group_type: manager
      id: 202
      name: 总版主(Moderator)
      privilege: 可以查看管理组信箱、举报信箱；管理趣味盒内容、投票内容；可以编辑或删除任何发布的种子；可以管理候选；可以管理论坛帖子、用户评论；可以查看机密日志；可以删除任何字幕；可以管理日志中的代码、史册；可以查看用户的邀请记录；可以管理用户帐号的一般信息。不能管理友情链接、最近消息、论坛版块；不能将种子设为置顶或促销；不能查看用户IP或Email等机密信息；不能删除账号。
