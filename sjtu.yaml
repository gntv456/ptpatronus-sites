id: sjtu
level_requirements:
    - id: 1
      name: User
      privilege: 新用户的默认级别。可以同时下载2个种子;可以删除自己上传的字幕.
    - downloaded: 50GB
      id: 2
      interval: P4W
      name: Power User
      privilege: 可以查看NFO文档; 可以查看用户列表; 可以请求续种; 可以在求种补种区发主题帖;可以查看友站邀请专区;可以查看排行榜; 可以查看其它用户的种子历史(如果用户隐私等级未设置为"强"); 可以在魔力值系统购买更多邀请名额.可以同时下载5个种子.
      ratio: 1.05
    - downloaded: 120GB
      id: 3
      interval: P8W
      name: Elite User
      privilege: Elite User及以上用户Park后不会被删除帐号;可以直接上传种子.可以同时下载8个种子.
      ratio: 1.55
    - downloaded: 300GB
      id: 4
      interval: P15W
      name: Crazy User
      privilege: 得到一个邀请名额; 可以发送邀请; 可以在做种/下载/上传的时候选择匿名模式.可以同时下载10个种子.
      ratio: 2.05
    - downloaded: 500GB
      id: 5
      interval: P25W
      name: Insane User
      privilege: 得到一个邀请名额; 可以查看普通日志.同时下载种子线程无限制.
      ratio: 2.55
    - downloaded: 750GB
      id: 6
      interval: P40W
      is_kept: true
      name: Veteran User
      privilege: 可以查看其它用户的评论、帖子历史;Veteran User及以上用户会永远保留账号.
      ratio: 3.05
    - downloaded: 1TB
      id: 7
      interval: P60W
      is_kept: true
      name: Extreme User
      privilege: 得到一个邀请名额; 可以更新过期的外部信息.
      ratio: 3.55
    - downloaded: 1.5TB
      id: 8
      interval: P80W
      is_kept: true
      name: Ultimate User
      privilege: 可以查看种子文件结构.
      ratio: 4.05
    - downloaded: 3TB
      id: 9
      interval: P100W
      is_kept: true
      name: Nexus Master
      privilege: 得到一个邀请名额.
      ratio: 4.55
    - group_type: vip
      id: 100
      name: VIP
      name_aka:
        - 贵宾
      privilege: 和Nexus Master拥有相同权限并被认为是精英成员. 免除自动降级.
    - group_type: manager
      id: 200
      name: Warehouse
      privilege: 保种组组员.可以查看保种组页面,可以选择/取消要保种的种子;免除自动降级.
    - group_type: manager
      id: 201
      name: Uploader
      name_aka:
        - 上传者
        - 上传员
      privilege: 专注的上传者.
    - group_type: manager
      id: 202
      name: Helper
      privilege: 保种组各小组小组长,可以挑选/取消需要保种的种子,可以删除保种组页面列表里保种组组员的名单.
    - group_type: manager
      id: 203
      name: Forummod
      name_aka:
        - 论坛版主
      privilege: 论坛版主.可以封禁用户的POST权限,可以警告用户;可以管理对应版面的帖子.
    - group_type: manager
      id: 204
      name: Coder
      privilege: 网站的维护开发组成员.
    - group_type: manager
      id: 205
      name: Moderator
      name_aka:
        - 总版主
      privilege: 可以查看管理组信箱、举报信箱; 管理趣味盒内容、投票内容; 可以编辑或删除任何上传的种子; 可以管理候选;可以管理论坛帖子、用户评论; 可以查看机密日志; 可以删除任何字幕; 可以管理日志中的代码、史册; 可以查看用户的邀请记录;可以管理用户帐号的一般信息. 不能管理友情链接、最近消息、论坛版块; 不能删除账号.
    - group_type: manager
      id: 206
      name: Administrator
      name_aka:
        - 管理员
      privilege: 除了不能改变站点设定、管理捐赠外, 可以做任何事.
    - group_type: manager
      id: 207
      name: Sysop
      name_aka:
        - 维护开发员
      privilege: 网站开发/维护人员, 可以改变站点设定, 不能管理捐赠.
    - group_type: manager
      id: 208
      name: Staff Leader
      privilege: 网站主管, 可以做任何事.
name: 葡萄
schema: nexusphp
tags:
    - 教育网
    - 影视
    - 综合
urls:
    - https://pt.sjtu.edu.cn/
user_info:
    path: index.php
    fields:
        id:
            attr: href
            filters:
                - name: queryparam
                  args: id
            selectors:
                - "#info_block a[href*='userdetails.php'][href*='id=']:first"
                - "a[href*='userdetails.php'][class*='Name']:first"
                - "a[href*='userdetails.php']:first"
        name:
            selectors:
                - "#info_block a[href*='userdetails.php'][href*='id=']:first"
                - "a[href*='userdetails.php'][class*='Name']:first"
                - "a[href*='userdetails.php']:first"
        uploaded:
            filters:
                - name: regexp
                  args: '(?i)(?:上传量|上傳量|Uploaded)[\s\S]{0,160}?([\d.,]+\s*(?:[KMGTPE]i?B|Bytes|B))'
                - name: parse_size
            selectors:
                - "#info_block"
                - "td.rowhead:contains('传输') + td"
                - "td.rowhead:contains('傳送') + td"
                - "td.rowhead:contains('Transfers') + td"
        downloaded:
            filters:
                - name: regexp
                  args: '(?i)(?:下载量|下載量|Downloaded)[\s\S]{0,160}?([\d.,]+\s*(?:[KMGTPE]i?B|Bytes|B))'
                - name: parse_size
            selectors:
                - "#info_block"
                - "td.rowhead:contains('传输') + td"
                - "td.rowhead:contains('傳送') + td"
                - "td.rowhead:contains('Transfers') + td"
        ratio:
            filters:
                - name: regexp
                  args: '(?i)(?:分享率|Ratio)[\s\S]{0,120}?([\d.]+|无限|無限|Inf\.?|Infinity)'
                - name: replace
                  args: 无限:::9999
                - name: replace
                  args: 無限:::9999
                - name: replace
                  args: Infinity:::9999
                - name: replace
                  args: Inf.:::9999
            selectors:
                - "#info_block"
                - "td.rowhead:contains('传输') + td"
        seeding:
            filters:
                - name: regexp
                  args: '(?i)(?:当前活动|当前做种|Torrents seeding|Current activity)[^0-9]{0,120}(\d+)'
            selectors:
                - "#info_block"
        bonus:
            filters:
                - name: regexp
                  args: '(?i)(?:魔力值|魔力|Karma Points)[\s\S]{0,120}?([\d.,]+)'
                - name: parse_number
            selectors:
                - "td.rowhead:contains('魔力值') + td"
                - "td.rowhead:contains('Karma Points') + td"
                - "td.rowfollow:contains('魔力值')"
                - "#info_block"
    detail_fields:
        uploaded:
            filters:
                - name: regexp
                  args: '(?i)(?:上传量|上傳量|Uploaded)[\s\S]{0,160}?([\d.,]+\s*(?:[KMGTPE]i?B|Bytes|B))'
                - name: parse_size
            selectors:
                - "td.rowhead:contains('传输') + td"
                - "td.rowhead:contains('傳送') + td"
                - "td.rowhead:contains('Transfers') + td"
        downloaded:
            filters:
                - name: regexp
                  args: '(?i)(?:下载量|下載量|Downloaded)[\s\S]{0,160}?([\d.,]+\s*(?:[KMGTPE]i?B|Bytes|B))'
                - name: parse_size
            selectors:
                - "td.rowhead:contains('传输') + td"
                - "td.rowhead:contains('傳送') + td"
                - "td.rowhead:contains('Transfers') + td"
        ratio:
            filters:
                - name: regexp
                  args: '(?i)(?:分享率|Ratio)[\s\S]{0,120}?([\d.]+|无限|無限|Inf\.?|Infinity)'
                - name: replace
                  args: 无限:::9999
                - name: replace
                  args: 無限:::9999
                - name: replace
                  args: Infinity:::9999
                - name: replace
                  args: Inf.:::9999
            selectors:
                - "td.rowhead:contains('传输') + td"
        level:
            attr: title
            selectors:
                - "td.rowhead:contains('等级') + td > img"
                - "td.rowhead:contains('等級') + td > img"
                - "td.rowhead:contains('Class') + td > img"
        join_date:
            filters:
                - name: regexp
                  args: '(\d{4}[-/]\d{1,2}[-/]\d{1,2})'
            selectors:
                - "td.rowhead:contains('加入日期') + td"
                - "td.rowhead:contains('Join'):contains('date') + td"
        bonus:
            filters:
                - name: parse_number
            selectors:
                - "td.rowhead:contains('魔力值') + td"
                - "td.rowhead:contains('Karma Points') + td"
                - "td.rowfollow:contains('魔力值')"
    pages:
        - path: mybonus.php
          fields:
              bonus_per_hour:
                  filters:
                      - name: regexp
                        args: '(?i)(?:能获取|能獲取|currently\s+getting)[^0-9]{0,60}([\d.,]+\.?\d*)'
                      - name: parse_number
                  selectors:
                      - "td.text:contains('你当前每小时能获取')"
                      - "div:contains('你当前每小时能获取')"
                      - "td:contains('你当前每小时能获取')"
                      - "td.text:contains('你當前每小時能獲取')"
                      - "div:contains('你當前每小時能獲取')"
                      - "td:contains('你當前每小時能獲取')"
                      - "div:contains('currently getting')"
                      - "td:contains('currently getting')"
        - path: viewusertorrents.php
          params:
              id: "{id}"
              show: seeding
          fields:
              seeding:
                  attr: count
                  selectors:
                      - "table tr:not(:first-child)"
              seeding_size:
                  attr: text_all
                  filters:
                      - name: sum_size
                  selectors:
                      - "table tr:not(:first-child) td:nth-child(3)"
        - path: viewtorrentsdetail.php
          params:
              id: "{id}"
          fields:
              uploads:
                  attr: html
                  filters:
                      - name: regexp
                        args: '</a>\s*[^<]*?(\d+)[^<]*<div id=["'']ka["'']'
                      - name: parse_number
                  selectors:
                      - ":self"
