# sunnypt — 2026 年较大更新:站点已从 NexusPHP 整体改版为 Next.js SPA + 独立 JSON API。
# schema: tnode(GenericJSON 适配器);实际抓取由 schemas/sunnypt.go 的 def.ID=="sunnypt" 分支
# 短路处理:解析 AuthSession cookie 内的 accessToken 作 Bearer 打 https://api.sunnypt.top。
# NexusPHP 时代的 HTML 选择器(user_info/selectors)已废弃——页面为 React SPA,无 HTML 可抓。

aka:
    - SunnyPT
    - 阳光
categories:
    - id: "401"
      name: 电影
    - id: "402"
      name: 电视剧
    - id: "403"
      name: 综艺
    - id: "404"
      name: 动漫
    - id: "405"
      name: 纪录片
    - id: "406"
      name: 体育
    - id: "407"
      name: MV
    - id: "408"
      name: 音轨
    - id: "409"
      name: 其他
description: The Ultimate File Sharing Experience
id: sunnypt
level_requirements:
    - id: 1
      name: User
      privilege: 新用户的默认级别。只能在每周六中午12点至每周日晚上11点59分发布种子。
    - downloaded: 50GB
      id: 2
      interval: P4W
      name: Power User
      privilege: 得到一个邀请名额；可以直接发布种子；可以查看NFO文档；可以查看用户列表；可以请求续种； 可以发送邀请； 可以查看排行榜；可以查看其它用户的种子历史(如果用户隐私等级未设置为"强")； 可以删除自己上传的字幕。
      ratio: 1.05
      seeding_bonus: 40000
    - downloaded: 120GB
      id: 3
      interval: P8W
      name: Elite User
      privilege: Elite User及以上用户封存账号后不会被删除。
      ratio: 1.55
      seeding_bonus: 80000
    - downloaded: 300GB
      id: 4
      interval: P15W
      name: Crazy User
      privilege: 得到两个邀请名额；可以在做种/下载/发布的时候选择匿名模式。
      ratio: 2.05
      seeding_bonus: 150000
    - downloaded: 500GB
      id: 5
      interval: P25W
      name: Insane User
      privilege: 可以查看普通日志。
      ratio: 2.55
      seeding_bonus: 250000
    - downloaded: 750GB
      id: 6
      interval: P40W
      is_kept: true
      name: Veteran User
      privilege: 得到三个邀请名额；可以查看其它用户的评论、帖子历史。Veteran User及以上用户会永远保留账号。
      ratio: 3.05
      seeding_bonus: 400000
    - downloaded: 1TB
      id: 7
      interval: P60W
      is_kept: true
      name: Extreme User
      privilege: 可以更新过期的外部信息；可以查看Extreme User论坛。
      ratio: 3.55
      seeding_bonus: 600000
    - downloaded: 1.5TB
      id: 8
      interval: P80W
      is_kept: true
      name: Ultimate User
      privilege: 得到五个邀请名额。
      ratio: 4.05
      seeding_bonus: 800000
    - downloaded: 3TB
      id: 9
      interval: P100W
      is_kept: true
      name: Nexus Master
      privilege: 得到十个邀请名额。
      ratio: 4.55
      seeding_bonus: 1000000
name: Sunny
schema: tnode
tags:
    - 影视
    - 综合
timezone_offset: "+0800"
urls:
    - https://sunnypt.top/

# 互动能力：签到 / 公告 / 消息（抓取实现见 schemas/sunnypt_interact.go）
checkin:
  enabled: true
  path: /api/v1/attendance/check-in
  method: POST
announcement:
  enabled: true
messages:
  enabled: true

