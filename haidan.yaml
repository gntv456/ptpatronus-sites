name: 海胆
schema: nexusphp
selectors:
    fields:
        completed:
            selector: .snatched_col
        detail:
            attr: href
            filters:
                - args: id
                  name: queryparam
                - args: /details.php?id=
                  name: prepend
            selectors:
                - a[href*="download.php?id="]
        download:
            attr: href
            selectors:
                - a[href*="download.php?id="]
        leechers:
            selector: .leecher_col
        seeders:
            selector: .seeder_col
        size:
            filters:
                - name: parse_size
            selector: .video_size
        subtitle:
            selectors:
                - .torrent_name_col a[href*='details.php']
        time:
            attr: title
            filters:
                - name: parse_time
            selectors:
                - .time_col span[title]
        title:
            ancestor: .group_content
            find: .name_col > .name > .video_name
            selector: :self
    rows:
        selector: .torrent_item
tags:
    - 电影
    - 电视剧
    - 影视
    - 综合
timezone_offset: "+0800"
urls:
    - https://www.haidan.cc/
user_info:
    user_torrent_list_api: "/getusertorrentlistajax.php?userid={id}&type={type}"
    fields:
        level:
            attr: title
            filters:
                - args: ^(?:.*\))?\s*(.+)$
                  name: regexp
            selectors:
                - td.rowhead:contains('等级') + td > img
    detail_fields:
        level:
            attr: title
            filters:
                - args: ^(?:.*\))?\s*(.+)$
                  name: regexp
            selectors:
                - td.rowhead:contains('等级') + td > img
