                  name: queryparam
                - args: /details.php?id=
                  name: prepend
            selector: a[title][href*='details.php?id=']
        download:
            attr: href
            selector: a[href*='download.php?id=']
        subtitle:
            selectors:
                - a[href*='hit'][title]
                - a[href*='hit']:has(b)
    rows:
        selector: table.torrents:last > tbody > tr
