description: 七星图，始于天枢
id: dubhe
level_requirements:
    - name: User
      privilege: 新用户的默认级别。只能在每周六中午12点至每周日晚上11点59分发布种子。
    - downloaded: 50GB
      id: 1
      interval: P4W
      name: Power User
      privilege: 得到一个邀请名额；可以直接发布种子；可以查看NFO文档；可以查看用户列表；可以请求续种；可以发送邀请；可以查看排行榜；可以查看其它用户的种子历史(如果用户隐私等级未设置为"强")；可以删除自己上传的字幕。
      ratio: 1.05
      seeding_bonus: 40000
    - downloaded: 300GB
      id: 2
      interval: P8W
      name: Elite User
      privilege: Elite User及以上用户封存账号后不会被删除。
      ratio: 2.55
      seeding_bonus: 80000
    - downloaded: 500GB
      id: 3
      interval: P15W
      name: Crazy User
      privilege: 得到两个邀请名额；可以在做种/下载/发布的时候选择匿名模式。
      ratio: 3.55
      seeding_bonus: 200000
    - downloaded: 750GB
      id: 4
      interval: P25W
      name: Insane User
      privilege: 可以查看普通日志。
      ratio: 5
      seeding_bonus: 400000
    - downloaded: 1TB
      id: 5
      interval: P40W
      is_kept: true
      name: Veteran User
      privilege: 得到三个邀请名额；可以查看其它用户的评论、帖子历史。Veteran User及以上用户会永远保留账号。
      ratio: 6
      seeding_bonus: 700000
    - downloaded: 1.5TB
      id: 6
      interval: P60W
      is_kept: true
      name: Extreme User
      privilege: 可以更新过期的外部信息；可以查看Extreme User论坛。
      ratio: 7
      seeding_bonus: 1000000
    - downloaded: 3TB
      id: 7
      interval: P80W
      is_kept: true
      name: Ultimate User
      privilege: 得到五个邀请名额。
      ratio: 8
      seeding_bonus: 1200000
    - downloaded: 4TB
      id: 8
      interval: P100W
      is_kept: true
      name: Nexus Master
      privilege: 得到十个邀请名额。
      ratio: 9
      seeding_bonus: 1500000
name: 天枢
schema: nexusphp
tags:
    - 综合
    - 影视
timezone_offset: "+0800"
urls:
    - https://dubhe.site/
user_info:
    path: index.php
    user_torrent_list_api: "/getusertorrentlistajax.php?userid={id}&type={type}"
    fields:
        id:
            attr: href
            filters:
                - name: queryparam
                  args: id
            selectors:
                - "#info_block a[href*='userdetails.php'][href*='id=']:first"
                - "a[href*='userdetails.php'][class*='Name']:first"
                - "a[href*='userdetails.php']:first"
        name:
            selectors:
                - "#info_block a[href*='userdetails.php'][href*='id=']:first"
                - "a[href*='userdetails.php'][class*='Name']:first"
                - "a[href*='userdetails.php']:first"
        uploaded:
            filters:
                - name: regexp
                  args: '(?i)(?:上传量|上傳量|Uploaded)[\s\S]{0,160}?([\d.,]+\s*(?:[KMGTPE]i?B|Bytes|B))'
                - name: parse_size
            selectors:
                - "td.rowhead:contains('传输') + td"
                - "td.rowhead:contains('傳送') + td"
                - "td.rowhead:contains('Transfers') + td"
                - "td.rowfollow:contains('分享率')"
                - "#info_block"
        downloaded:
            filters:
                - name: regexp
                  args: '(?i)(?:下载量|下載量|Downloaded)[\s\S]{0,160}?([\d.,]+\s*(?:[KMGTPE]i?B|Bytes|B))'
                - name: parse_size
            selectors:
                - "td.rowhead:contains('传输') + td"
                - "td.rowhead:contains('傳送') + td"
                - "td.rowhead:contains('Transfers') + td"
                - "td.rowfollow:contains('分享率')"
                - "#info_block"
        ratio:
            filters:
                - name: regexp
                  args: '(?i)(?:分享率|Ratio)[\s\S]{0,120}?([\d.]+|无限|無限|Inf\.?|Infinity)'
                - name: replace
                  args: 无限:::9999
                - name: replace
                  args: 無限:::9999
                - name: replace
                  args: Infinity:::9999
                - name: replace
                  args: Inf.:::9999
            selectors:
                - "td.rowhead:contains('传输') + td"
                - "td.rowfollow:contains('分享率')"
                - "#info_block"
        seeding:
            filters:
                - name: regexp
                  args: '(?i)(?:当前活动|当前做种|Torrents seeding|Current activity)[^0-9]{0,120}(\d+)'
            selectors:
                - "#info_block"
        bonus:
            filters:
                - name: regexp
                  args: '(?i)(?:魔力值|魔力|Karma Points)[\s\S]{0,120}?([\d.,]+)'
                - name: parse_number
            selectors:
                - "td.rowhead:contains('魔力值') + td"
                - "td.rowhead:contains('Karma Points') + td"
                - "td.rowfollow:contains('魔力值')"
                - "#info_block"
    detail_fields:
        uploaded:
            filters:
                - name: regexp
                  args: '(?i)(?:上传量|上傳量|Uploaded)[\s\S]{0,160}?([\d.,]+\s*(?:[KMGTPE]i?B|Bytes|B))'
                - name: parse_size
            selectors:
                - "td.rowhead:contains('传输') + td"
                - "td.rowhead:contains('傳送') + td"
                - "td.rowhead:contains('Transfers') + td"
                - "td.rowfollow:contains('分享率')"
        downloaded:
            filters:
                - name: regexp
                  args: '(?i)(?:下载量|下載量|Downloaded)[\s\S]{0,160}?([\d.,]+\s*(?:[KMGTPE]i?B|Bytes|B))'
                - name: parse_size
            selectors:
                - "td.rowhead:contains('传输') + td"
                - "td.rowhead:contains('傳送') + td"
                - "td.rowhead:contains('Transfers') + td"
                - "td.rowfollow:contains('分享率')"
        ratio:
            filters:
                - name: regexp
                  args: '(?i)(?:分享率|Ratio)[\s\S]{0,120}?([\d.]+|无限|無限|Inf\.?|Infinity)'
                - name: replace
                  args: 无限:::9999
                - name: replace
                  args: 無限:::9999
                - name: replace
                  args: Infinity:::9999
                - name: replace
                  args: Inf.:::9999
            selectors:
                - "td.rowhead:contains('传输') + td"
                - "td.rowfollow:contains('分享率')"
        level:
            attr: title
            selectors:
                - "td.rowhead:contains('等级') + td > img"
                - "td.rowhead:contains('等級') + td > img"
                - "td.rowhead:contains('Class') + td > img"
        join_date:
            filters:
                - name: regexp
                  args: '(\d{4}[-/]\d{1,2}[-/]\d{1,2})'
            selectors:
                - "td.rowhead:contains('加入日期') + td"
                - "td.rowhead:contains('Join'):contains('date') + td"
        bonus:
            filters:
                - name: parse_number
            selectors:
                - "td.rowhead:contains('魔力值') + td"
                - "td.rowhead:contains('Karma Points') + td"
                - "td.rowfollow:contains('魔力值')"
    pages:
        - path: mybonus.php
          fields:
              bonus_per_hour:
                  filters:
                      - name: regexp
                        args: '(?i)(?:能获取|能獲取|currently\s+getting)[^0-9]{0,60}([\d.,]+\.?\d*)'
                      - name: parse_number
                  selectors:
                      - "td.text:contains('你当前每小时能获取')"
                      - "div:contains('你当前每小时能获取')"
                      - "td:contains('你当前每小时能获取')"
                      - "td.text:contains('你當前每小時能獲取')"
                      - "div:contains('你當前每小時能獲取')"
                      - "td:contains('你當前每小時能獲取')"
                      - "div:contains('currently getting')"
                      - "td:contains('currently getting')"
                      - "td[rowspan]"
