            filters:
                - name: anisource_time
            selector: span.info > font:last-of-type
        title:
            attr: title
            filters:
                - args: "Download :::"
                  name: replace
            selector: span.info > a
    rows:
        selector: div.torrents > div[class^="item"]
tags:
