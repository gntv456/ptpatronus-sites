# rousipro — 自动生成自 PT-depiler（tools/convert-definitions.go）。
# schema: rousi。2026-08 站点已重构为 PeerGo（rousi.pro 同域）：适配器先走 PeerGo
# /api/v1/torrents（query/category/limit/offset，匿名可搜）+ /api/v1/me/profile|economy
# （会话 cookie 认证），旧版 Bearer passkey /api/v1/search|profile 端点 404 时自动回退。
# 下方 selectors 为旧版 JSON 字段映射，仅供 legacy 分支使用。

aka:
    - Rousi
    - 肉丝
id: rousipro
name: Rousi Pro
schema: rousi
search_entry: /api/v1/search
search_param: keyword
selectors:
    fields:
        category:
            selector: category_name
        completed:
            selector: downloads
        detail:
            selector: uuid
        leechers:
            selector: leechers
        seeders:
            selector: seeders
        size:
            selector: size
        subtitle:
            selector: subtitle
        time:
            filters:
                - name: parse_time
            selector: created_at
        title:
            selector: title
    rows:
        selector: data.torrents
urls:
    - https://rousi.pro/
