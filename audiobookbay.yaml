# audiobookbay — 搜索 selector 与 tt=1 参数已按 PT-depiler/Jackett 结构迁移，并由 GenericHTML mock 覆盖；详情页 magnet 仍建议 live smoke。

aka:
    - ABB
description: AudioBook Bay (ABB) is a Public Torrent Tracker for AUDIOBOOKS
id: audiobookbay
extra_param:
    tt: "1"
name: AudioBook Bay
search_entry: /
search_param: s
selectors:
    fields:
        category:
            text: Audiobook
        completed:
            text: "0"
        detail:
            attr: href
            selector: div.postTitle h2 a
        leechers:
            text: "0"
        seeders:
            text: "0"
        size:
            filters:
                - args: "File Size: (.+?)s"
                  name: regexp
                - name: parse_size
            selector: div.postContent
        subtitle:
            filters:
                - args: "(?s)Category:\\s+(.+?)\\s+(?:Language:|Keywords:)"
                  name: regexp
                - args: "\u00a0 ::: / "
                  name: replace
            selector: div.postInfo
        time:
            filters:
                - args: "Posted: (\\d{1,2} \\D{3} \\d{4})"
                  name: regexp
                - name: parse_time
            selector: div.postContent
        title:
            selector: div.postTitle
    rows:
        selector: div.post:has(div[class='postTitle'])
tags:
    - 有声书
timezone_offset: "+0100"
urls:
    - https://audiobookbay.lu/
    - http://audiobookbay.is/
    - http://audiobookbay.se/
    - http://audiobookbay.fi/
    - http://audiobookbay.ws/
    - http://theaudiobookbay.se/
