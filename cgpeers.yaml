# cgpeers — 自动生成自 PT-depiler（tools/convert-definitions.go）。
# schema: luminance。已接入通用/专用适配器，待真实站点校准。
aka:
    - CGP
description: CGPeers 是一个专注于计算机图形资源的私有站点
id: cgpeers
legacy_urls:
    - https://www.cgpeers.com/
level_requirements:
    - id: 1
      name: User
    - id: 2
      interval: P4W
      name: Member
      privilege: Access Top 10; Can (anonymously) upload torrents; Can make requests
      ratio: 1
      uploaded: 100GiB
    - id: 3
      interval: P20W
      name: Power User
      privilege: Can view advanced site stats.
      ratio: 2
      uploaded: 500GiB
      uploads: 5
    - id: 4
      interval: P52W
      name: Elite
      privilege: Can download multiple torrents at once. Can delete tags. Can view torrent peerlists.
      ratio: 4
      uploaded: 2TiB
      uploads: 50
    - id: 5
      interval: P260W
      name: Legend
      privilege: Can have a personal collage. Can create collages.
      ratio: 4
      uploaded: 100TiB
      uploads: 100
name: CGPeers
schema: luminance
search_entry: /torrent/browse
selectors:
    fields:
        category:
            attr: href
            filters:
                - args: "filter_cat\\[(\\d+)\\]"
                  name: regexp
                - args: 17=3D Printing:::1=Applications:::8=Audio:::7=Game Development:::5=Materials:::6=Miscellaneous:::4=Models:::2=Plugins:::3=Tutorials:::9=Web Development
                  name: map
            selector: td.cats_col > div[title] > a
        detail:
            attr: href
            selector: span + a[href*='torrent/']
        download:
            attr: href
            selector: a[href*='torrent/download/']
        title:
            selector: span + a[href*='torrent/']
tags:
    - 设计
    - 教育
    - 软件
    - 学习
    - 素材
timezone_offset: "+0000"
urls:
    - https://cgpeers.to/
user_info:
    fields:
        id:
            attr: href
            filters:
                - args: "/:::2"
                  name: split
            selectors:
                - div.user-dropdown-section a[href^='/user/']
        name:
            filters:
                - args: "\n:::0"
                  name: split
            selectors:
                - a#userDropdownTrigger
                - span.user_name
        uploads:
            filters:
                - args: '\[(\d[\d,]*)\s+(?:uploaded|uploads|torrents?)\]'
                  name: regexp
                - name: parse_number
            selectors:
                - "ul.stats > li:contains('Uploaded:')"
    pages:
        - path: /
          use_fields:
            - id
            - name
        - path: /user/{id}
          use_fields:
            - name
            - uploaded
            - downloaded
            - ratio
            - level
            - bonus
            - seeding
            - leeching
            - uploads
            - join_date
            - last_access_at
            - posts
            - bonus_per_hour
            - seeding_size
