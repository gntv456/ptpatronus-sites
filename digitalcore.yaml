# digitalcore — 自动生成自 PT-depiler（tools/convert-definitions.go）。
# schema: rartracker。已接入通用/专用适配器，待真实站点校准。
aka:
    - DC
    - DCC
description: In a world of sharing, people make the difference.
id: digitalcore
level_requirements:
    - name: Rogue
    - id: 10
      interval: P14D
      name: Sentinel
      privilege: Get access to the request system and the bonus system. Can upload (moderated) torrents
      ratio: 1.05
      uploaded: 50GB
    - id: 20
      interval: P105D
      name: Viceroy
      privilege: See all 'top' lists. See extended statistics. IP logging disabled. All IP logs are now cleared
      ratio: 1.1
      uploaded: 300GB
    - id: 30
      interval: P210D
      name: Sentry
      privilege: Get 3 request slots, 2 invites and above perks
      ratio: 1.1
      uploaded: 1200GB
    - id: 31
      interval: P500D
      name: Guardian
      privilege: Get 5 extra invites and 6 additional request slots. Can upload unmoderated torrents.
      ratio: 20
      uploaded: 5TB
    - id: 32
      interval: P730D
      name: Vanguard
      privilege: Get 10 more extra invites and 10 additional request slots. Can upload unmoderated torrents.
      ratio: 20
      uploaded: 20TB
    - group_type: vip
      id: 70
      name: VIP
name: DigitalCore
schema: rartracker
selectors:
    fields:
        category:
            filters:
                - args: 2=Movies/SD:::1=Movies/DVDR:::5=Movies/720p:::6=Movies/1080p:::4=Movies/2160p:::3=Movies/BluRay:::38=Movies/Bluray/UHD:::7=Movies/PACKS:::10=Tv/SD:::11=Tv/DVDR:::8=Tv/720p:::9=Tv/1080p:::13=Tv/2160p:::14=Tv/BluRay:::12=Tv/PACKS:::15=Tv/SPORTS:::17=Unknown:::18=Apps/0DAY:::20=Apps/PC:::21=Apps/Mac:::33=Apps/Tutorials:::22=Music/MP3:::23=Music/FLAC:::24=Music/MTV:::29=Music/PACKS:::39=Music/DVD:::40=Music/Bluray:::25=Games/PC:::27=Games/Mac:::26=Games/Consoles:::43=Games/ROMS:::42=Games/XXX:::44=Audiobooks:::28=Ebooks:::30=XXX/SD:::31=XXX/HD:::32=XXX/4K:::35=XXX/Movies/SD:::36=XXX/Movies/HD:::37=XXX/Movies/4K:::34=XXX/Imagesets:::41=XXX/PACKS
                  name: map
            selector: category
        completed:
            selector: times_completed
        subtitle:
            selector: tagline
tags:
    - 综合
timezone_offset: "+0200"
urls:
    - https://digitalcore.club/
user_info:
    fields:
        id:
            selector: user.id
        name:
            selector: user.username
        uploaded:
            filters:
                - name: parse_size
            selector: user.uploaded
        downloaded:
            filters:
                - name: parse_size
            selector: user.downloaded
        true_uploaded:
            filters:
                - name: parse_size
            selector: uploaded_real
        bonus:
            selectors:
                - user.bonuspoang
                - bonuspoang
        seeding:
            selector: user.myseeds
        uploads:
            selector: user.mytorrents
        seeding_size:
            filters:
                - args: " GB"
                  name: append
                - name: parse_size
            selector: user.currentGbSeed
        join_date:
            filters:
                - name: parse_time
            selector: added
        level:
            filters:
                - args: 0=Rogue:::10=Sentinel:::20=Viceroy:::30=Sentry:::31=Guardian:::32=Vanguard:::50=Uploader:::51=Titan:::60=Developer:::70=VIP:::75=FLS:::80=Moderator:::90=Administrator
                  name: map
            selector: class
        level_id:
            selector: class
        bonus_per_hour:
            filters:
                - args: (?i)\[b\]([\d.]+)p\[/b\].{0,80}hourly
                  name: regexp
                - args: "24"
                  name: divide
            selector: :self
    pages:
        - path: /api/v1/status
          format: json
          use_fields:
            - id
            - name
            - uploaded
            - downloaded
            - bonus
            - seeding
            - uploads
            - seeding_size
        - path: /api/v1/users/{id}
          format: json
          use_fields:
            - join_date
            - uploaded
            - downloaded
            - true_uploaded
            - bonus
            - level
            - level_id
        - path: /api/v1/users/{id}/bonuslog
          format: json
          use_fields:
            - bonus_per_hour
