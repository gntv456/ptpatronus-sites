# zhuque — 自动生成自 PT-depiler（tools/convert-definitions.go）。
# schema: tnode。已接入通用/专用适配器，待真实站点校准。
aka:
    - Zhuque
description: 新架构的影视站点
id: zhuque
level_requirements:
    - id: 1
      name: 筑基
      privilege: 入站初始等级
    - downloaded: 10GB
      id: 2
      interval: P5W
      name: 结丹
      privilege: 无
      ratio: 2
    - downloaded: 25GB
      id: 3
      interval: P10W
      name: 元婴
      privilege: 无
      ratio: 2
    - downloaded: 50GB
      id: 4
      interval: P15W
      name: 出窍
      privilege: 无
      ratio: 2
    - downloaded: 100GB
      id: 5
      interval: P20W
      name: 炼虚
      privilege: 无
      ratio: 2
    - downloaded: 200GB
      id: 6
      interval: P25W
      name: 合体
      privilege: 无
      ratio: 4
    - downloaded: 300GB
      id: 7
      interval: P30W
      name: 大乘
      privilege: 无
      ratio: 6
    - downloaded: 400GB
      id: 8
      interval: P35W
      name: 真仙
      privilege: 无
      ratio: 8
name: 朱雀
schema: tnode
medal:
    enabled: false
    shop_path: medals.php
search_entry: /api/torrent/advancedSearch
search_param: keyword
selectors:
    fields:
        category:
            filters:
                - args: 501=电影:::502=剧集:::503=动画:::504=节目:::599=其它
                  name: map
            selector: category
        completed:
            selector: complete
        detail:
            filters:
                - args: /torrent/info/
                  name: prepend
            selector: id
        download:
            filters:
                - args: /api/torrent/download/
                  name: prepend
            selector: id
        leechers:
            selector: leeching
        seeders:
            selector: seeding
        size:
            selector: size
        subtitle:
            selector: subtitle
        time:
            filters:
                - name: unix_seconds
            selector: upload_time
        title:
            selector: title
    rows:
        selector: data.torrents
tags:
    - 影视
    - 综合
timezone_offset: "+0800"
urls:
    - https://zhuque.in/
user_info:
    pages:
        - path: /api/plugins/ptppUserInfo
          format: json
          fields:
            id:
                selector: data.id
            name:
                selector: data.name
            level:
                selector: data.levelName
            uploaded:
                filters:
                    - name: parse_size
                selector: data.uploaded
            downloaded:
                filters:
                    - name: parse_size
                selector: data.downloaded
            true_uploaded:
                selector: data.trueUploaded
            true_downloaded:
                selector: data.trueDownloaded
            ratio:
                selector: data.ratio
            bonus:
                selector: data.bonus
            seeding_bonus:
                selector: data.seedingPoints
            bonus_per_hour:
                selector: data.bonusPerHour
            join_date:
                filters:
                    - name: unix_seconds
                selector: data.joinTime
            last_access_at:
                filters:
                    - name: unix_seconds
                selector: data.lastUpdateTime
            seeding:
                selector: data.seeding
            seeding_size:
                filters:
                    - name: parse_size
                selector: data.seedingSize
            uploads:
                selector: data.uploadCount
# 公告/消息：朱雀为 SPA + JSON API，端点由适配器（GenericJSON/tnode）硬编码，
# 这里仅放行 chain 守卫（Enabled=true）。公告/消息 GET 均需 x-csrf-token 头
# （从 /index 的 <meta name="x-csrf-token"> 提取，ptppUserInfo 除外）。
announcement:
    enabled: true
messages:
    enabled: true
