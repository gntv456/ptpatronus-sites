# aither — 自动生成自 PT-depiler（tools/convert-definitions.go）。
# schema: unit3d。已接入通用/专用适配器，待真实站点校准。
aka:
    - ATH
id: aither
level_requirements:
    - id: 1
      name: Phobos
      privilege: 4下载槽
    - id: 2
      interval: P1M
      name: Harmonia
      privilege: 10下载槽
      ratio: 0.6
    - id: 3
      interval: P3M
      name: Zeus
      privilege: 25下载槽
      ratio: 0.6
    - id: 4
      interval: P6M
      name: Helios
      privilege: 50下载槽 发送邀请
      ratio: 0.8
      uploads: 1
    - id: 5
      interval: P8M
      name: Prometheus
      privilege: 访问邀请区 50下载槽 发送邀请
      ratio: 1
      uploads: 5
    - id: 6
      interval: P12M
      name: Oceanus
      privilege: 自动通过候选 访问邀请区  50下载槽 发送邀请
      ratio: 1.5
      uploads: 10
    - id: 7
      interval: P15M
      name: Gigantes
      privilege: 自动通过候选 访问邀请区 不计算下载量 50下载槽 发送邀请
      ratio: 1.5
      uploads: 15
    - id: 8
      interval: P24M
      name: Titan
      privilege: 自动通过候选 访问邀请区 免疫HR 不计算下载量 50下载槽 发送邀请
      ratio: 2
      uploads: 20
name: Aither
schema: unit3d
selectors:
    fields:
        category:
            data: categoryId
            filters:
                - args: 1=Movie:::9=Sport:::2=TV
                  name: map
            selector: :self
tags:
    - 影视
timezone_offset: "+0000"
urls:
    - https://aither.cc/
user_info:
    fields:
        id:
            selectors:
                - "span.user-profile-card__meta-item-title:contains('User ID') + span.user-profile-card__meta-item-value"
                - "span.user-profile-card__meta-item-title:contains('用户 ID') + span.user-profile-card__meta-item-value"
                - "span.user-profile-card__meta-item-title:contains('用ID') + span.user-profile-card__meta-item-value"
                - "span.user-profile-card__meta-item-title:contains('用户ID') + span.user-profile-card__meta-item-value"
        join_date:
            filters:
                - name: parse_time
            selectors:
                - "span[title='Registration date'] span"
                - "span[title='注册日期'] span"
                - "span[title='註冊日期'] span"
        ratio:
            filters:
                - name: parse_number
            selector: li.ratio-bar__ratio a:has(i.fa-sync-alt)
        seeding_size:
            filters:
                - name: parse_size
            selectors:
                - "span.user-profile-card__meta-item-title:contains('Seeding Size') + span.user-profile-card__meta-item-value"
                - "span.user-profile-card__meta-item-title:contains('Seeding size') + span.user-profile-card__meta-item-value"
                - "span.user-profile-card__meta-item-title:contains('做种体积') + span.user-profile-card__meta-item-value"
                - "span.user-profile-card__meta-item-title:contains('做種體積') + span.user-profile-card__meta-item-value"
        uploads:
            selector: .user-profile-card__meta-item  a[href*='/uploads']
