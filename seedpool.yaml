name: seedpool
schema: unit3d
selectors:
    fields:
        category:
            data: categoryId
            filters:
                - args: 2=TV Show:::1=Movie:::6=Anime:::8=Sports:::5=Music:::9=Audiobook:::7=E-Book:::12=Hobby:::16=Software:::3=Game:::21=Music Production:::11=Other
                  name: map
            selector: :self
tags:
    - 综合
timezone_offset: "+0000"
urls:
    - https://seedpool.org/
user_info:
    fields:
        bonus:
            text: N/A
        bonus_per_hour:
            text: N/A
        seeding:
            filters:
                - name: parse_number
            selectors:
                - li.ratio-bar__uploaded a:has(i.fa-arrow-up) + a
        seeding_size:
            filters:
                - args: '(?i)([\d.,]+\s*(?:[KMGTPE]i?B|Bytes))'
                  name: regexp
                - name: parse_size
            selectors:
                - a[href*='/active?seeding=include']
                - "td:contains('Seedpool') + td"
                - "dt:contains('Seedpool') + dd"
