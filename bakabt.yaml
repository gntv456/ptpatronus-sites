# bakabt — 自动生成自 PT-depiler（tools/convert-definitions.go）。
# schema: 。selectors/user_info 若未列出则由 EnsureDefaults 自填校准默认。
aka:
    - BBT
description: BakaBT is a Private site for the Anime Community
id: bakabt
level_requirements:
    - id: 1
      name: User
    - downloaded: 25GB
      id: 2
      name: Power User
      privilege: View peer lists & report torrents; Access to RSS; Can make up to 5 torrent offers simultaneously.
      ratio: 0.5
name: BakaBT
search_entry: /browse.php
search_param: q
selectors:
    fields:
        category:
            attr: title
            selector: span.torrent_icon
        completed:
            filters:
                - args: "/:::0"
                  name: split
                - name: trim
            selector: .peers
        detail:
            attr: href
            selector: .peers a
        leechers:
            selector: .peers a:nth-child(2)
        seeders:
            selector: .peers a:nth-child(1)
        size:
            filters:
                - name: parse_size
            selector: .size
        subtitle:
            selector: span.tags
        time:
            attr: data-timestamp
            filters:
                - name: unix_seconds
            selectors:
                - :self
                - .added span.datetime
        title:
            filters:
                - name: trim
            selectors:
                - a.title
                - a.alt_title
    rows:
        selector: .torrents tr.torrent, .torrents tr.torrent_alt
tags:
    - 动漫
timezone_offset: "+0000"
urls:
    - https://bakabt.me/
user_info:
    pages:
        - path: /
          fields:
            id:
                selector: a.username
                attr: href
                filters:
                    - name: split
                      args: "/:::2"
        - path: /bonus.php
          fields:
            bonus_per_hour:
                selector: b.success
                filters:
                    - name: parse_number
        - path: /user/{id}/
          fields:
            name:
                selector: a.username
            level:
                selector: h2 > span
                filters:
                    - name: regexp
                      args: '^\((.+?) - (.+?)\)$:::2'
            join_date:
                selector: "td:contains('Join date') + td > span.datetime"
                attr: data-timestamp
                filters:
                    - name: unix_seconds
            last_access_at:
                selector: "td:contains('Last seen') + td > span.datetime"
                attr: data-timestamp
                filters:
                    - name: unix_seconds
            uploaded:
                selector: "td:contains('Uploaded') + td"
                filters:
                    - name: split
                      args: "-:::0"
                    - name: parse_size
            downloaded:
                selector: "td:contains('Downloaded') + td"
                filters:
                    - name: split
                      args: "-:::0"
                    - name: parse_size
            ratio:
                selector: "td:contains('Share ratio') + td > span"
                filters:
                    - name: parse_number
            bonus:
                selector: "td:contains('Bonus Points') + td"
                filters:
                    - name: parse_number
            uploads:
                selector: "li#uploaded_tab > a"
                filters:
                    - name: parse_number
            seeding:
                selector: "li#active_tab > a"
                filters:
                    - name: parse_number
            seeding_size:
                selector: "div#tab_content > div#active table.torrents > tbody tr td.size"
                attr: text_all
                filters:
                    - name: sum_size
