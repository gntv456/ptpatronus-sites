# gtnet — POST 搜索 token 流程与 user_info.pages 已按 PT-depiler 结构迁移，并由 GenericHTML mock 覆盖；真实站点仍建议 live smoke。
id: gtnet
level_requirements:
    - id: 1
      name: Newbie
name: Gay-Torrents.net
search_entry: /search.php?do=process
search_param: query
selectors:
    fields:
        category:
            attr: href
            filters:
                - args: type
                  name: queryparam
                - name: url_decode
                - args: "/::: > "
                  name: replace
            selector: li.TorrentList1 a[href*='torrentslist.php']
        detail:
            attr: href
            selector: li.TorrentList2 a[href*='torrentdetails.php']
        download:
            attr: href
            selector: a[href*='download.php']
        leechers:
            filters:
                - name: parse_number
            selector: li.TorrentList7
        seeders:
            filters:
                - name: parse_number
            selector: li.TorrentList6
        size:
            filters:
                - name: parse_size
            selector: li.TorrentList3
        time:
            filters:
                - name: trim
                - name: parse_time
            selector: li.TorrentList8
        title:
            selector: li.TorrentList2 a[href*='torrentdetails.php']
    rows:
        selector: div#display ul.TorrentList
tags:
    - 成人
timezone_offset: "+0800"
urls:
    - https://www.gay-torrents.net/
user_info:
    pages:
        - path: /member.php
          fields:
            id:
                selector: "ul.isuser li.welcomelink a[href*='member.php?']"
                attr: href
                filters:
                    - name: regexp
                      args: 'member\.php\?(\d+)'
            name:
                selector: "ul.isuser li.welcomelink a[href*='member.php?']"
        - path: /member.php?{id}-{name}
          fields:
            uploaded:
                selector: "dl.stats:has(dt:contains('Uploaded')) dd"
                filters:
                    - name: parse_size
            downloaded:
                selector: "dl.stats:has(dt:contains('Downloaded')) dd"
                filters:
                    - name: parse_size
            ratio:
                selector: "dl.stats:has(dt:contains('Ratio')) dd"
                filters:
                    - args: "??:::0"
                      name: replace
                    - args: "∞:::-1"
                      name: replace
                    - args: "Inf:::-1"
                      name: replace
                    - name: parse_number
            bonus:
                selector: "dl.stats:has(dt:contains('Juices')) dd"
                filters:
                    - name: parse_number
            level:
                selector: "#userinfo span.usertitle"
            join_date:
                selector: "dl.stats:has(dt:contains('Join Date')) dd"
                filters:
                    - name: parse_time
