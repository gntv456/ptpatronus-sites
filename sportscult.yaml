description: SportsCult is a Private Torrent Tracker for SPORTS
id: sportscult
level_requirements:
    - id: 1
      name: Sportsman
    - id: 2
      name: Athlete
      privilege: 'Access to: Online Users, Tracker info, Live TV'
      ratio: 0.9
      uploaded: 50GB
    - id: 3
      name: ProAthlete
      privilege: 'Access to: Online Users, Tracker info, Live TV, Requests, Top 10, and Users'
      ratio: 1.8
      uploaded: 250GB
    - group_type: vip
      id: 4
      name: VIP
      privilege: 'Fancy star, No ratio requirements (as long as you are vip) + Access to: Online Users, Tracker info, Live TV, Requests, Top 10, and Users'
name: SportsCult
schema: xbtit
search_entry: /index.php
search_param: search
selectors:
    fields:
        category:
            attr: href
            filters:
                - args: category
                  name: queryparam
                - args: "47=EPL:::41=American Football:::54=AutoMotoRacing:::17=Athletics:::51=Baseball:::34=Bodybuilding/Fitness:::50=Golf:::29=Boxing:::19=BrainGames:::36=BreakDance:::23=Cycling:::31=Documentary:::1=European Basketball:::37=Extreme Sports:::9=Fight Sports:::32=Formula1:::45=GAA (Gaelic):::22=Gymnastics:::59=UFL:::39=Handball:::2=International Basket:::25=IceHockey:::4=International Soccer:::42=KHL:::55=MotoGP:::35=KickBoxing/Muay Thai:::43=La Liga:::15=MotorSport:::24=MLB/Baseball:::28=MMA:::11=NBA:::3=NCAA Basket/Football:::5=NFL:::27=NHL:::26=Olympic games:::7=Rugby:::44=Serie A:::38=Snooker/Pool:::30=Streetball:::18=Swimming/Aquatics:::56=Ligue1:::46=AFL(AustralianFB):::12=Tennis:::20=Volleyball:::21=Weightlifting:::16=WinterSport:::33=Wrestling/Grapling:::48=Uncategorised:::60=Champions League:::61=Europa League:::63=WNBA:::64=NASCAR:::65=FIBA 3x3 Basketball:::67=Bundesliga:::68=MLS:::69=EuroLeague Basketbal:::70=ELC:::71=RhythmicGymnastics:::72=BeachVolleyball:::73=BeachSoccer:::74=Chess:::75=Bowling:::76=BelgianProLeague:::77=Bellator:::78=Billard:::79=Climbing:::80=CrossFit:::81=DutchEredivisie:::82=IndyCar:::83=GLeagueNBA:::84=NCAABasketball:::85=NCAAFootball:::86=Sailing:::87=Surfing:::88=TableTennis:::89=TourDeFrance:::90=LaVuelta:::91=Girod'Italia:::92=UefaConferenceLeague:::93=UEFAEuro:::94=OlympicGamesParis24:::95=WRCRally:::96=CPL:::97=CFL:::98=PrimeiraPortugal:::53=Cricket:::99=Darts:::100=ESport:::6=European Soccer:::101=EuroCup:::102=Ultimate Diskk:::104=WinterOlympicGames:::52=Field Hockey:::103=Basketball Champions:::58=UFC"
                  name: map
            selector: a[href^='index.php?page=torrents&category=']
        completed:
            selector: td:nth-child(8)
        detail:
            attr: href
            selector: a[href^='index.php?page=torrent-details&id=']
        download:
            attr: href
            selector: a[href^='download.php?id=']
        leechers:
            selector: td:nth-child(7)
        seeders:
            selector: td:nth-child(6)
        size:
            filters:
                - name: parse_size
            selector: td:nth-child(4)
        time:
            filters:
                - args: '[dd/MM/yyyy]'
                  name: parse_time
            selector: td:nth-child(5)
        title:
            selector: a[href^='index.php?page=torrent-details&id=']
    rows:
        selector: table.lista:last-of-type:not(:has(td.block:contains('Our Team Recommend'))) > tbody > tr:has(a[href^='index.php?page=torrents&category='])
tags:
    - 运动
timezone_offset: "+0300"
urls:
    - https://sportscult.org/
user_info:
    pages:
        - path: /index.php
          fields:
            id:
                selector: "a[href*='index.php?page=usercp']"
                attr: href
                filters:
                    - name: queryparam
                      args: uid
        - path: /index.php
          params:
            page: usercp
            uid: "{id}"
          fields:
            name:
                selector: "td.header:contains('User') + td"
            uploaded:
                selector: "td.header:contains('Uploaded:') + td"
                filters:
                    - name: parse_size
            downloaded:
                selector: "td.header:contains('Downloaded:') + td"
                filters:
                    - name: parse_size
            ratio:
                selector: "td.header:contains('Ratio:') + td"
                filters:
                    - name: parse_number
            level:
                selector: "td.header:contains('Rank:') + td"
            bonus:
                selector: "td.green:contains('Bonus')"
                filters:
                    - name: parse_number
            join_date:
                selector: "td.header:contains('Joined on') + td"
                filters:
                    - name: parse_time
            last_access_at:
                selector: "td.header:contains('Last access') + td"
                filters:
                    - name: parse_time
            seeding:
                selector: "td.header:contains('Active Torrents') + td"
                filters:
                    - name: parse_number
            seeding_size:
                selector: "#mcol div.b-content table.lista:nth-of-type(3) tbody tr:not(:first-child):not(:nth-child(2)) td:nth-child(2)"
                attr: text_all
                filters:
                    - name: sum_size
        - path: /index.php
          params:
            page: modules
            module: seedbonus
          fields:
            bonus_per_hour:
                selector: "#mcol div.b-content > h3"
                filters:
                    - name: parse_number
