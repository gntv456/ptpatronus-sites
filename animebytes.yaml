# animebytes — 自动生成自 PT-depiler（tools/convert-definitions.go）。
# schema: gazelle。user_info.pages 已翻译为可执行选择器并有 mock 回归覆盖；真实站点仍建议 live smoke。
aka:
    - AB
description: AnimeBytes is a Private site. Powered by Tentacles
id: animebytes
level_requirements:
    - name: Aka-chan
      privilege: 新用户的默认级别
    - id: 1
      interval: P1W
      name: User
      privilege: 发送邀请
      ratio: 0.5
      uploaded: 10.5GB
    - id: 2
      interval: P2W
      is_kept: true
      name: Power User
      privilege: 访问邀请区，每月固定邀请名额，免于非活动修剪
      ratio: 0.7
      uploaded: 25GB
      uploads: 10
    - id: 3
      interval: P30D
      is_kept: true
      name: Elite
      ratio: 0.8
      uploaded: 100GB
      uploads: 50
    - id: 4
      interval: P90D
      is_kept: true
      name: Torrent Master
      privilege: 超出用户限制也可以发送邀请
      ratio: 0.9
      uploaded: 500GB
      uploads: 100
    - id: 5
      interval: P180D
      is_kept: true
      name: Legend
      ratio: 1
      uploaded: 1TB
      uploads: 500
name: AnimeBytes
schema: gazelle
search_entry: /scrape.php
tags:
    - 动漫
    - 音乐
    - 游戏
timezone_offset: "+0000"
urls:
    - https://animebytes.tv/
user_info:
    pages:
        - path: /
          fields:
            id:
                selector: "#stats_menu > a:first"
                attr: href
                filters:
                    - name: queryparam
                      args: userid
            name:
                selector: "a.username:first"
        - path: /user.php
          params:
            id: "{id}"
          fields:
            uploads:
                selector: "dt:contains('Torrents Uploaded:') + dd"
                filters:
                    - name: parse_number
            uploaded:
                selector: "dt:contains('Uploaded:') + dd > span"
                attr: title
                filters:
                    - name: parse_size
            downloaded:
                selector: "dt:contains('Downloaded:') + dd > span"
                attr: title
                filters:
                    - name: parse_size
            ratio:
                selector: "dt:contains('Ratio:') + dd > span"
                filters:
                    - name: parse_number
            seeding:
                selector: "dt:contains('Seeding:') + dd"
                filters:
                    - name: parse_number
            seeding_size:
                selector: "dt:contains('Total seed size:') + dd > span"
                attr: title
                filters:
                    - name: parse_size
            level:
                selector: "dt:contains('Class:') + dd"
            bonus:
                selector: "#yen_count > a"
                filters:
                    - name: parse_number
            bonus_per_hour:
                selector: "dt:contains('Yen per day:') + dd"
                filters:
                    - name: parse_number
                    - name: divide
                      args: "24"
            join_date:
                selector: "dt:contains('Joined:') + dd > span"
                attr: title
                filters:
                    - name: parse_time
            last_access_at:
                selector: "dt:contains('Last Seen') + dd > span"
                attr: title
                filters:
                    - name: parse_time
