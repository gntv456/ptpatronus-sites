# rutracker — 搜索 selector 已按 PT-depiler/Jackett 结构迁移，并由 GenericHTML mock 覆盖；真实站点仍建议 live smoke。

aka:
    - RUT
description: RuTracker.org is a RUSSIAN Semi-Private site with a thriving file-sharing community
id: rutracker
legacy_urls:
    - https://rutracker.nl/
name: RuTracker.org
search_entry: /forum/tracker.php
selectors:
    fields:
        category:
            selector: td.f-name-col > div.f-name > a
        completed:
            selector: td:nth-child(9)
        detail:
            attr: href
            selector: td.t-title-col > div.t-title > a.tLink
        download:
            attr: href
            selector: td.tor-size > a.tr-dl
        leechers:
            selector: td.leechmed:nth-child(8)
        seeders:
            attr: data-ts_text
            selector: td:nth-child(7)
        size:
            attr: data-ts_text
            filters:
                - name: parse_size
            selector: td.tor-size
        time:
            attr: data-ts_text
            selector: td:nth-child(10)
        title:
            filters:
                - name: trim
            selector: td.t-title-col > div.t-title > a.tLink
    rows:
        selector: table#tor-tbl > tbody > tr
tags:
    - 综合
timezone_offset: "+0000"
urls:
    - https://rutracker.org/
    - https://rutracker.net/
