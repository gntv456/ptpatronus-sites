# cdfile - categories migrated from PT-depiler; dead site retained for display/history.
# schema: nexusphp; common selectors are filled by defaults.

categories:
    - id: "401"
      name: Movies/电影
    - id: "406"
      name: Music Videos/MV
    - id: "402"
      name: TV Series/电视剧
    - id: "408"
      name: Music/音轨
    - id: "405"
      name: Animations/动漫
    - id: "403"
      name: TV Shows/综艺
    - id: "407"
      name: Sports/体育
    - id: "404"
      name: Documentaries/纪录片
    - id: "409"
      name: Others/其他
dead: true
description: 专注于Blu-Ray、DVD、CD等高品质光盘镜像资源，致力于打造光盘档案室
id: cdfile
level_requirements:
    - name: User
    - downloaded: 50GB
      id: 1
      interval: P4W
      name: Power User
      privilege: 得到一个邀请名额；可以直接发布种子；可以查看NFO文档；可以查看用户列表；可以请求续种； 可以发送邀请； 可以查看排行榜；可以查看其它用户的种子历史(如果用户隐私等级未设置为"强")； 可以删除自己上传的字幕。
      ratio: 1.05
      seeding_bonus: 40000
    - downloaded: 120GB
      id: 2
      interval: P8W
      name: Elite User
      privilege: Elite User及以上用户封存账号后不会被删除。
      ratio: 1.55
      seeding_bonus: 80000
    - downloaded: 300GB
      id: 3
      interval: P15W
      name: Crazy User
      privilege: 得到两个邀请名额；可以在做种/下载/发布的时候选择匿名模式。
      ratio: 2.05
      seeding_bonus: 150000
    - downloaded: 500GB
      id: 4
      interval: P25W
      name: Insane User
      privilege: 可以查看普通日志。
      ratio: 2.55
      seeding_bonus: 250000
    - downloaded: 750GB
      id: 5
      interval: P40W
      is_kept: true
      name: Veteran User
      privilege: 得到三个邀请名额；可以查看其它用户的评论、帖子历史。Veteran User及以上用户会永远保留账号。
      ratio: 3.05
      seeding_bonus: 400000
    - downloaded: 1TB
      id: 6
      interval: P60W
      is_kept: true
      name: Extreme User
      privilege: 可以更新过期的外部信息；可以查看Extreme User论坛。
      ratio: 3.55
      seeding_bonus: 600000
    - downloaded: 1.5TB
      id: 7
      interval: P80W
      is_kept: true
      name: Ultimate User
      privilege: 得到五个邀请名额。
      ratio: 4.05
      seeding_bonus: 800000
    - downloaded: 3TB
      id: 8
      interval: P100W
      is_kept: true
      name: Nexus Master
      privilege: 得到十个邀请名额。
      ratio: 4.55
      seeding_bonus: 1000000
name: CD File
schema: nexusphp
search_categories:
    movie:
        - "401"
        - "404"
        - "405"
    tv:
        - "402"
        - "403"
    music:
        - "406"
        - "408"
urls:
    - https://pt.cdfile.org/
