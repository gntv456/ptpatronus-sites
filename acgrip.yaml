# acgrip — 搜索 selector 已按 PT-depiler/Jackett 结构迁移，并由 GenericHTML mock 覆盖；真实站点仍建议 live smoke。

description: 与动漫花园类似的日漫资源站点
id: acgrip
name: ACG.RIP
search_entry: /
search_param: term
selectors:
    fields:
        detail:
            attr: href
            selector: td.title span.title a
        download:
            attr: href
            selector: td.action a
        size:
            filters:
                - name: parse_size
            selector: td.size
        time:
            attr: datetime
            selector: td.date time
        title:
            selector: td.title span.title a
    rows:
        selector: table.post-index > tbody > tr
urls:
    - https://acg.rip/
