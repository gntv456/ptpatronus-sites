# hdcity — 自动生成自 PT-depiler（tools/convert-definitions.go）。
# schema: nexusphp。selectors/user_info 若未列出则由 EnsureDefaults 自填校准默认。

aka:
    - 城市
categories:
    - id: "401"
      name: Movies/电影
    - id: "402"
      name: Series/剧集
    - id: "404"
      name: Doc/档案记录
    - id: "405"
      name: Anim/动漫
    - id: "403"
      name: Shows/节目
    - id: "406"
      name: MV/音乐视频
    - id: "407"
      name: Sports/体育
    - id: "408"
      name: Audio/音频
    - id: "727"
      name: XXX/家长指引
    - id: "728"
      name: Edu/文档/教材
    - id: "729"
      name: Soft/软件
    - id: "409"
      name: Other/其他
id: hdcity
legacy_urls:
    - https://hdcity.top/
name: HDCity
schema: nexusphp
search_entry: /pt
search_param: iwannaseethis
selectors:
    fields:
        completed:
            filters:
                - args: (\d+)
                  name: regexp
            selector: .mbottom a[href*='viewsnatches']
        detail:
            attr: href
            filters:
                - args: id
                  name: queryparam
                - args: /t-
                  name: prepend
            selectors:
                - a[href*="download?id="]
        download:
            attr: href
            selectors:
                - a[href*="download?id="]
        leechers:
            filters:
                - args: (\d+)
                  name: regexp
            selector: .mbottom a[href*='leechers']
        seeders:
            filters:
                - args: (\d+)
                  name: regexp
            selector: .mbottom a[href*='seeders']
        size:
            filters:
                - name: parse_size
            selector: .mbottom .mbelement:nth-child(3)
        subtitle:
            selectors:
                - .mtitle a[href^='t-']
        time:
            filters:
                - args: (\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})
                  name: regexp
                - name: parse_time
            selector: div[style='minfo']
        title:
            selectors:
                - .mtop a[href^='t-']
    rows:
        selector: .mitem
tags:
    - 综合
    - 影视
timezone_offset: "+0800"
urls:
    - https://hdcity.city/
    - https://hdcity.leniter.org/
    - https://hdcity.work/
user_info:
    path: /userdetails
    user_torrent_list_api: /getusertorrentlistajax?userid={id}&type={type}
    fields:
        id:
            filters:
                - args: (\d+)
                  name: regexp
            selectors:
                - "center .text_alt .text:contains('ID')"
                - ".text_alt .text:contains('ID')"
        name:
            selectors:
                - .text_alt span[style]
                - .text_alt span
        uploaded:
            filters:
                - args: (?:上传量|Uploaded):\s*([\d.,]+\s*[ZEPTGMK]i?B)
                  name: regexp
                - name: parse_size
            selector: ".text_alt + br + div .text:nth-child(1)"
        downloaded:
            filters:
                - args: (?:下载量|Downloaded):\s*([\d.,]+\s*[ZEPTGMK]i?B)
                  name: regexp
                - name: parse_size
            selector: ".text_alt + br + div .text:nth-child(1)"
        level:
            attr: src
            filters:
                - args: '/class/(\d+)\.gif'
                  name: regexp
                - args: 1=天使:::2=大天使:::3=权天使:::4=能天使:::5=力天使:::6=主天使:::7=座天使:::8=智天使:::9=炽天使:::10=壕(VIP):::11=隐天使(Retiree):::12=射种天使(Uploader):::13=论坛版主(Forum Moderator):::14=总版主(Moderator):::15=管理员(Administrator):::16=守护天使(Sysop):::17=市长(Mayor)
                  name: map
            selectors:
                - ".text_alt img[src*='class']:first"
        ratio:
            filters:
                - args: (?:分享率|Ratio):\s*([\d.]+)
                  name: regexp
            selector: ".text_alt + br + div .text:nth-child(4)"
        bonus:
            filters:
                - args: (?:魅力值|Karma Points)\s+([\d.,]+)
                  name: regexp
                - name: parse_number
            selector: ".text_alt + br + div .text:nth-child(4)"
        bonus_per_hour:
            filters:
                - name: parse_number
            selectors:
                - "div:contains('你当前每小时能获取'):last"
                - "div:contains('You are currently getting'):last"
                - "div:contains('你當前每小時能獲取'):last"
        join_date:
            filters:
                - args: (\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2})
                  name: regexp
                - name: parse_time
            selectors:
                - ".text:contains('加入日期')"
                - ".text:contains('Join date')"
    pages:
        - path: /mybonus
          use_fields:
            - bonus_per_hour
