# nekobt — JSON 搜索 selector 与固定参数已按 PT-depiler 结构迁移，并由 GenericHTML mock 覆盖；真实站点仍建议 live smoke。

description: nekoBT is a Public Torrent Tracker for ANIME
id: nekobt
format: json
extra_param:
    limit: "100"
    sort_by: latest
name: nekoBT
search_entry: /api/v1/torrents/search
search_param: query
selectors:
    fields:
        category:
            text: Anime
        completed:
            selector: completed
        detail:
            filters:
                - args: /torrents/
                  name: prepend
            selector: id
        download:
            selector: magnet
        leechers:
            selector: leechers
        seeders:
            selector: seeders
        size:
            selector: filesize
        time:
            selector: uploaded_at
        title:
            selector: title
    rows:
        selector: data.results
tags:
    - 动漫
urls:
    - https://nekobt.to/
