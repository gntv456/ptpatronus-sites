# 52pt - core user fields migrated from PT-depiler/PT-manager; live smoke still recommended.
# schema: nexusphp。selectors/user_info 若未列出则由 EnsureDefaults 自填校准默认。

aka:
    - 我爱PT
categories:
    - id: "401"
      name: Movies/电影
    - id: "404"
      name: Documentaries/纪录片
    - id: "405"
      name: Animations/动漫(画)
    - id: "402"
      name: TV Series/剧集
    - id: "403"
      name: TV Shows/综艺
    - id: "406"
      name: Music Videos/音乐MV(演唱会)
description: 低调地在这个PT校园快乐成长 快乐分享
id: 52pt
level_requirements:
    - name: User
      privilege: 新用户的默认级别
    - downloaded: 50GB
      id: 1
      interval: P4W
      name: Power User
      privilege: 得到一个邀请名额；可以查看NFO文档；可以请求续种； 可以发送邀请；可以查看其它用户的种子历史(如果用户隐私等级未设置为"强")； 允许发布新的趣味盒内容及编辑自己发布的趣味盒内容;可以删除自己上传的字幕。
      ratio: 1.05
    - downloaded: 120GB
      id: 2
      interval: P8W
      name: Elite User
      privilege: Elite User及以上用户封存账号后不会被删除。
      ratio: 1.55
    - downloaded: 300GB
      id: 3
      interval: P15W
      name: Crazy User
      privilege: 得到两个邀请名额；可以在做种/下载/发布的时候选择匿名模式。
      ratio: 2.05
    - downloaded: 1536GB
      id: 4
      interval: P25W
      name: Insane User
      privilege: 可以查看普通日志。
      ratio: 2.55
    - downloaded: 2560GB
      id: 5
      interval: P40W
      is_kept: true
      name: Veteran User
      privilege: 得到三个邀请名额；可以查看其它用户的评论、帖子历史。Veteran User及以上用户会永远保留账号。
      ratio: 3.05
    - downloaded: 3072GB
      id: 6
      interval: P60W
      is_kept: true
      name: Extreme User
      privilege: 可以更新过期的外部信息；可以查看Extreme User论坛。
      ratio: 3.55
    - downloaded: 4608GB
      id: 7
      interval: P80W
      is_kept: true
      name: Ultimate User
      privilege: 得到五个邀请名额。
      ratio: 4.05
    - downloaded: 5632GB
      id: 8
      interval: P100W
      is_kept: true
      name: Nexus Master
      privilege: 得到十个邀请名额。
      ratio: 4.55
    - group_type: vip
      id: 100
      name: 名誉校长
      name_aka:
        - 名誉校长
        - 名誉校长(VIP)
        - VIP
        - 贵宾
      privilege: VIP等级，享受特殊权限。
    - group_type: manager
      id: 101
      name: 离退休
      name_aka:
        - 离退休
        - 离退休(Retiree)
        - Retiree
      privilege: 离退休人员等级。
    - group_type: manager
      id: 102
      name: 教员
      name_aka:
        - 教员
        - 教员(Uploader)
        - Uploader
      privilege: 教员等级，负责内容上传。
    - group_type: manager
      id: 103
      name: 教授
      name_aka:
        - 教授
        - 教授(Moderator)
        - Moderator
      privilege: 教授等级，负责内容审核。
    - group_type: manager
      id: 104
      name: 校长
      name_aka:
        - 校长
        - 校长(Administrator)
        - Administrator
      privilege: 校长等级，最高管理权限。
    - group_type: manager
      id: 105
      name: 校区维护
      name_aka:
        - 校区维护
        - 校区维护(Sysop)
        - Sysop
      privilege: 校区维护等级，负责系统维护。
    - group_type: manager
      id: 106
      name: 校区创始人
      name_aka:
        - 校区创始人
        - 校区创始人(Staff Leader)
        - Staff Leader
      privilege: 校区创始人等级，最高权限。
name: 52PT
schema: nexusphp
medal:
    enabled: false
    shop_path: medal.php
tags:
    - 高清
    - 电影
    - 电视剧
timezone_offset: "+0800"
urls:
    - https://52pt.site/
user_info:
    path: index.php
    user_torrent_list_api: "/getusertorrentlistajax.php?userid={id}&type={type}"
    fields:
        id:
            attr: href
            filters:
                - name: queryparam
                  args: id
            selectors:
                - "#info_block a[href*='userdetails.php'][href*='id=']:first"
                - "a[href*='userdetails.php'][class*='Name']:first"
                - "a[href*='userdetails.php']:first"
        name:
            selectors:
                - "#info_block a[href*='userdetails.php'][href*='id=']:first"
                - "a[href*='userdetails.php'][class*='Name']:first"
                - "a[href*='userdetails.php']:first"
        uploaded:
            filters:
                - name: regexp
                  args: '(?i)(?:上传量|上傳量|Uploaded)[\s\S]{0,120}?([\d.,]+\s*(?:[KMGTPE]i?B|Bytes|B))'
                - name: parse_size
            selectors:
                - "td.rowhead:contains('传输') + td"
                - "td.rowhead:contains('傳送') + td"
                - "td.rowhead:contains('Transfers') + td"
                - "#info_block"
        downloaded:
            filters:
                - name: regexp
                  args: '(?i)(?:下载量|下載量|Downloaded)[\s\S]{0,120}?([\d.,]+\s*(?:[KMGTPE]i?B|Bytes|B))'
                - name: parse_size
            selectors:
                - "td.rowhead:contains('传输') + td"
                - "td.rowhead:contains('傳送') + td"
                - "td.rowhead:contains('Transfers') + td"
                - "#info_block"
        ratio:
            filters:
                - name: regexp
                  args: '(?i)(?:分享率|Ratio)[\s\S]{0,100}?([\d.]+|无限|無限|Inf\.?|Infinity)'
                - name: replace
                  args: 无限:::9999
                - name: replace
                  args: 無限:::9999
                - name: replace
                  args: Infinity:::9999
                - name: replace
                  args: Inf.:::9999
            selectors:
                - "td.rowhead:contains('传输') + td"
                - "td.rowhead:contains('傳送') + td"
                - "td.rowhead:contains('Transfers') + td"
                - "#info_block"
        seeding:
            filters:
                - name: regexp
                  args: '(?i)(?:当前活动|当前做种|Torrents seeding|Active)[^0-9]{0,60}(\d+)'
            selectors:
                - "#info_block"
                - "font.color_active, span.color_active"
        bonus:
            filters:
                - name: regexp
                  args: '(?i)(?:魔力值|Karma Points)[\s\S]{0,120}?([\d.,]+)'
                - name: parse_number
            selectors:
                - "td.rowhead:contains('魔力值') + td"
                - "td.rowhead:contains('Karma Points') + td"
                - "td.rowfollow:contains('魔力值')"
                - "#info_block"
    detail_fields:
        uploaded:
            filters:
                - name: regexp
                  args: '(?i)(?:上传量|上傳量|Uploaded)[\s\S]{0,120}?([\d.,]+\s*(?:[KMGTPE]i?B|Bytes|B))'
                - name: parse_size
            selectors:
                - "td.rowhead:contains('传输') + td"
                - "td.rowhead:contains('傳送') + td"
                - "td.rowhead:contains('Transfers') + td"
        downloaded:
            filters:
                - name: regexp
                  args: '(?i)(?:下载量|下載量|Downloaded)[\s\S]{0,120}?([\d.,]+\s*(?:[KMGTPE]i?B|Bytes|B))'
                - name: parse_size
            selectors:
                - "td.rowhead:contains('传输') + td"
                - "td.rowhead:contains('傳送') + td"
                - "td.rowhead:contains('Transfers') + td"
        ratio:
            filters:
                - name: regexp
                  args: '(?i)(?:分享率|Ratio)[\s\S]{0,100}?([\d.]+|无限|無限|Inf\.?|Infinity)'
                - name: replace
                  args: 无限:::9999
                - name: replace
                  args: 無限:::9999
                - name: replace
                  args: Infinity:::9999
                - name: replace
                  args: Inf.:::9999
            selectors:
                - "td.rowhead:contains('传输') + td"
                - "td.rowhead:contains('傳送') + td"
                - "td.rowhead:contains('Transfers') + td"
        level:
            attr: title
            selectors:
                - "td.rowhead:contains('等级') + td > img"
                - "td.rowhead:contains('等級') + td > img"
                - "td.rowhead:contains('Class') + td > img"
        join_date:
            filters:
                - name: regexp
                  args: '(\d{4}[-/]\d{1,2}[-/]\d{1,2})'
            selectors:
                - "td.rowhead:contains('加入日期') + td"
                - "td.rowhead:contains('Join'):contains('date') + td"
        bonus:
            filters:
                - name: parse_number
            selectors:
                - "td.rowhead:contains('魔力值') + td"
                - "td.rowhead:contains('Karma Points') + td"
                - "td.rowfollow:contains('魔力值')"
    pages:
        - path: mybonus.php
          fields:
              bonus_per_hour:
                  filters:
                      - name: regexp
                        args: '(?i)(?:能获取|能獲取|currently\s+getting)[^0-9]{0,60}([\d.,]+\.?\d*)'
                      - name: parse_number
                  selectors:
                      - "td.text:contains('你当前每小时能获取')"
                      - "div:contains('你当前每小时能获取')"
                      - "td:contains('你当前每小时能获取')"
                      - "td.text:contains('你當前每小時能獲取')"
                      - "div:contains('你當前每小時能獲取')"
                      - "td:contains('你當前每小時能獲取')"
                      - "div:contains('currently getting')"
                      - "td:contains('currently getting')"
