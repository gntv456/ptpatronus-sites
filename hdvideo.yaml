# hdvideo - user fields migrated from PT-manager/PT-depiler; live smoke still recommended.
id: hdvideo
name: HDVideo
aka:
    - HDVideo
schema: nexusphp
urls:
    - https://hdvideo.top/
legacy_urls:
    - https://hdvideo.one/
level_requirements:
    - id: 0
      name: User
    - id: 1
      name: Power User
      interval: P4W
      downloaded: 128GB
      ratio: 2
      seeding_bonus: 60480
      privilege: 得到一个邀请名额；可以直接发布种子；可以查看NFO文档；可以查看用户列表；可以请求续种； 可以发送邀请； 可以查看排行榜；可以查看其它用户的种子历史(如果用户隐私等级未设置为"强")； 可以删除自己上传的字幕。
    - id: 2
      name: Elite User
      interval: P8W
      downloaded: 256GB
      ratio: 2.5
      seeding_bonus: 137088
      privilege: Elite User及以上用户封存账号后不会被删除。
    - id: 3
      name: Crazy User
      interval: P12W
      downloaded: 512GB
      ratio: 3
      seeding_bonus: 262080
      privilege: 可以在做种/下载/发布的时候选择匿名模式。
    - id: 4
      name: Insane User
      interval: P18W
      downloaded: 1TB
      ratio: 3.5
      seeding_bonus: 453600
      privilege: 得到两个邀请名额；可以查看普通日志。
    - id: 5
      name: Veteran User
      interval: P24W
      downloaded: 2TB
      ratio: 4
      seeding_bonus: 604800
      is_kept: true
      privilege: 可以查看其它用户的评论、帖子历史。Veteran User及以上用户会永远保留账号。
    - id: 6
      name: Extreme User
      interval: P32W
      downloaded: 4TB
      ratio: 4.5
      seeding_bonus: 806400
      is_kept: true
      privilege: 可以更新过期的外部信息；可以查看Extreme User论坛。
    - id: 7
      name: Ultimate User
      interval: P40W
      downloaded: 6TB
      ratio: 5
      seeding_bonus: 1008000
      is_kept: true
      privilege: 得到三个邀请名额。
    - id: 8
      name: Nexus Master
      interval: P52W
      downloaded: 8TB
      ratio: 5.5
      seeding_bonus: 1310400
      is_kept: true
      privilege: 得到五个邀请名额。
user_info:
    path: index.php
    user_torrent_list_api: "/getusertorrentlistajax.php?userid={id}&type={type}"
    fields:
        id:
            attr: href
            filters:
                - name: queryparam
                  args: id
            selectors:
                - "#info_block a[href*='userdetails.php'][href*='id=']:first"
                - "a[href*='userdetails.php'][class*='Name']:first"
                - "a[href*='userdetails.php']:first"
        name:
            selectors:
                - "#info_block a[href*='userdetails.php'][href*='id=']:first"
                - "a[href*='userdetails.php'][class*='Name']:first"
                - "a[href*='userdetails.php']:first"
        uploaded:
            filters:
                - name: regexp
                  args: '(?i)(?:上传量|上傳量|Uploaded)(?:</?[^>]+>|[:：]|\s|&nbsp;|[()（）]){0,180}([\d.,]+\s*(?:[KMGTPE]i?B|Bytes|B))'
                - name: parse_size
            selectors:
                - "#info_block"
                - "td.rowhead:contains('传输') + td"
                - "td.rowhead:contains('傳輸') + td"
                - "td.rowhead:contains('Transfers') + td"
        downloaded:
            filters:
                - name: regexp
                  args: '(?i)(?:下载量|下載量|Downloaded)(?:</?[^>]+>|[:：]|\s|&nbsp;|[()（）]){0,180}([\d.,]+\s*(?:[KMGTPE]i?B|Bytes|B))'
                - name: parse_size
            selectors:
                - "#info_block"
                - "td.rowhead:contains('传输') + td"
                - "td.rowhead:contains('傳輸') + td"
                - "td.rowhead:contains('Transfers') + td"
        ratio:
            filters:
                - name: regexp
                  args: '(?i)(?:分享率|Ratio)(?:</?[^>]+>|[:：]|\s|&nbsp;|[()（）]){0,160}([\d.]+|无限|無限|Inf\.?|Infinity)'
                - name: replace
                  args: 无限:::9999
                - name: replace
                  args: 無限:::9999
                - name: replace
                  args: Infinity:::9999
                - name: replace
                  args: Inf.:::9999
            selectors:
                - "#info_block"
                - "td.rowhead:contains('传输') + td"
                - "td.rowhead:contains('傳輸') + td"
                - "td.rowhead:contains('Transfers') + td"
        seeding:
            filters:
                - name: regexp
                  args: '(?i)(?:当前活动|当前做种|Torrents seeding)[^0-9]{0,120}(\d+)'
            selectors:
                - "#info_block"
        bonus:
            filters:
                - name: parse_number
            selectors:
                - "#top-stats-bar a.top-stat[href*='mybonus.php'] b"
                - ".top-account-stat-link.top-account-stat-bonus b"
                - "td.rowhead:contains('电影票') + td"
                - "td.rowhead:contains('魔力值') + td"
                - "td.rowhead:contains('Karma Points') + td"
    detail_fields:
        uploaded:
            filters:
                - name: regexp
                  args: '(?i)(?:上传量|上傳量|Uploaded)(?:</?[^>]+>|[:：]|\s|&nbsp;|[()（）]){0,180}([\d.,]+\s*(?:[KMGTPE]i?B|Bytes|B))'
                - name: parse_size
            selectors:
                - "td.rowhead:contains('传输') + td"
                - "td.rowhead:contains('傳輸') + td"
                - "td.rowhead:contains('Transfers') + td"
                - "#info_block"
        downloaded:
            filters:
                - name: regexp
                  args: '(?i)(?:下载量|下載量|Downloaded)(?:</?[^>]+>|[:：]|\s|&nbsp;|[()（）]){0,180}([\d.,]+\s*(?:[KMGTPE]i?B|Bytes|B))'
                - name: parse_size
            selectors:
                - "td.rowhead:contains('传输') + td"
                - "td.rowhead:contains('傳輸') + td"
                - "td.rowhead:contains('Transfers') + td"
                - "#info_block"
        ratio:
            filters:
                - name: regexp
                  args: '(?i)(?:分享率|Ratio)(?:</?[^>]+>|[:：]|\s|&nbsp;|[()（）]){0,160}([\d.]+|无限|無限|Inf\.?|Infinity)'
                - name: replace
                  args: 无限:::9999
                - name: replace
                  args: 無限:::9999
                - name: replace
                  args: Infinity:::9999
                - name: replace
                  args: Inf.:::9999
            selectors:
                - "td.rowhead:contains('传输') + td"
                - "td.rowhead:contains('傳輸') + td"
                - "td.rowhead:contains('Transfers') + td"
                - "#info_block"
        level:
            attr: title
            selectors:
                - "td.rowhead:contains('等级') + td > img"
                - "td.rowhead:contains('等級') + td > img"
                - "td.rowhead:contains('Class') + td > img"
        join_date:
            filters:
                - name: regexp
                  args: '(\d{4}[-/]\d{1,2}[-/]\d{1,2})'
            selectors:
                - "td.rowhead:contains('加入日期') + td"
                - "td.rowhead:contains('Join'):contains('date') + td"
        bonus:
            filters:
                - name: parse_number
            selectors:
                - "#top-stats-bar a.top-stat[href*='mybonus.php'] b"
                - ".top-account-stat-link.top-account-stat-bonus b"
                - "td.rowhead:contains('电影票') + td"
                - "td.rowhead:contains('魔力值') + td"
                - "td.rowhead:contains('Karma Points') + td"
        seeding:
            filters:
                - name: regexp
                  args: '(?i)(?:当前活动|当前做种|Torrents seeding)[^0-9]{0,120}(\d+)'
            selectors:
                - "#info_block"
                - "td.rowhead:contains('当前做种') + td"
    pages:
        - path: mybonus.php
          fields:
              bonus_per_hour:
                  filters:
                      - name: parse_number
                  selectors:
                      - "h1:contains('每小时获得的合计魔力值') ~ div table tr:contains('基本奖励') > td:last"
                      - "h1:contains('每小时获得的合计') ~ div table tr:contains('基本奖励') > td:last"
                      - "tr:contains('基本奖励') > td:last"
