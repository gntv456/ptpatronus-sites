# 猪猪（piggo.me）站点定义 —— 自研引擎（schema: piggo）
#
# 站点已从 NexusPHP 整体改版为 Laravel + Vite SPA 自研引擎（2026-11 验证），
# 旧刮削选择器全部作废；现由 backend/internal/site/schemas/piggo.go 代码适配
# /v1/web JSON API——本 YAML 不配置 selectors。
#
# 鉴权（站点无 Cookie/passkey 通道，只有账号密码）：
#   1. 站点凭据填「用户名 + 密码」——适配器自动走 SRP-6a 加密登录
#      （RFC5054 2048-bit 群 + PBKDF2 21 万轮派生，密码不以明文进请求体）
#   2. 登录后 token 与设备指纹 visitorId 绑定，全部请求带 HMAC-SHA256 签名
#      （X-Spa-Nonce/X-Spa-Hmac，sign 每会话由 /auth/sign 下发）——适配器内部处理
#   3. 会话缓存在进程内存（12h 刷新；401 自动重登）
#
# ⚠ 新账号首次使用须在网页端完成一次「Wiki 已读确认」（/wiki/rules-general
#   页点「确认已阅读」），否则种子端点全部 403 wiki_unread（站点强制闸门）。
#
# 实测端点（2026-11-07）：
#   ✅ GET  /v1/web/torrents?page=&keyword=   搜索（promotion.label 免费/全局促销）
#   ✅ GET  /v1/web/torrents/{id}             详情
#   ✅ GET  /v1/web/me                        用户资料（stats.uploaded 为格式化串）
#   ✅ POST /v1/web/torrents/{id}/download-link → 签名直链（GET 即 .torrent）
id: piggo
name: 猪猪
schema: piggo
urls:
  - https://piggo.me
# 公告/站免端点站点未开放（改版后无对应 API），关闭避免快照报错；
# 单种促销（免费/全局首免）由搜索结果 promotion 正常下发，不受影响。
announcement:
  enabled: false
freeleech:
  enabled: false
