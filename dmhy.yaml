# dmhy — 搜索 selector 已按 PT-depiler 结构迁移，并由 GenericHTML mock 覆盖；真实站点仍建议 live smoke。

aka:
    - 動漫花園
    - DMHY
description: 動漫花園資訊網是一個動漫愛好者交流的平台,提供最及時,最全面的動畫,漫畫,動漫音樂,動漫下載,BT,ED,動漫遊戲,資訊,分享,交流,讨论.
id: dmhy
name: 動漫花園資源網
search_entry: /topics/list
search_param: keyword
selectors:
    fields:
        category:
            selector: td:nth-child(2) a
        completed:
            selector: td:nth-child(8)
        detail:
            attr: href
            selector: a[href^="/topics/view/"]
        download:
            attr: href
            selector: a[href^="magnet:?"]
        leechers:
            selector: td:nth-child(7)
        seeders:
            selector: td:nth-child(6)
        size:
            selector: td:nth-child(5)
        time:
            filters:
                - args: '[yyyy/MM/dd HH:mm]'
                  name: parse_time
            selector: td:nth-child(1) span
        title:
            selector: a[href^="/topics/view/"]
    rows:
        selector: table tbody tr:has(a[href^="magnet:?"])
timezone_offset: "+0800"
urls:
    - https://share.dmhy.org/
