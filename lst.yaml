name: LST
schema: unit3d
selectors:
    fields:
        category:
            attr: title
            selector: .torrent-search-row__category
        completed:
            selector: .torrent-search-row__stat--completed
        detail:
            attr: href
            selector: .torrent-search-row__name > a
        leechers:
            selector: .torrent-search-row__stat--leechers
        seeders:
            selector: .torrent-search-row__stat--seeders
        size:
            attr: title
            filters:
                - name: parse_number
            selector: .torrent-search-row__stat--size
        title:
            selector: .torrent-search-row__name > a
    rows:
        selector: .torrent-results__list > .torrent-search-row
tags:
    - 综合
    - 影视
timezone_offset: "+0000"
urls:
    - https://lst.gg/
user_info:
    fields:
        bonus_per_hour:
            filters:
                - name: parse_number
            selectors:
                - "span.sidebar-stat__label:contains('Points per hour') + span"
                - "span.sidebar-stat__label:contains('每小时点数') + span"
                - "span.sidebar-stat__label:contains('每小時魔力') + span"
        id:
            selector: span.profile-hero__account-item > i.fa-hashtag ~ span.profile-hero__account-value
        join_date:
            filters:
                - name: regexp
                  args: (\d{4}-\d{2}-\d{2}(?:\s+\d{2}:\d{2}:\d{2})?)
                - name: parse_time
            selectors:
                - "span.profile-hero__meta-item:contains('Registration date')"
                - "span.profile-hero__meta-item:contains('注册日期')"
                - "span.profile-hero__meta-item:contains('註冊日期')"
        seeding_size:
            filters:
                - name: parse_size
            selectors:
                - "div.profile-mini-stat__label:contains('Seeding Size') + div"
                - "div.profile-mini-stat__label:contains('Seeding size') + div"
                - "div.profile-mini-stat__label:contains('做种体积') + div"
                - "div.profile-mini-stat__label:contains('做種體積') + div"
        uploads:
            filters:
                - name: parse_number
            selectors:
                - "div.profile-mini-stat__label:contains('Total uploads') + div"
                - "div.profile-mini-stat__label:contains('总发布') + div"
                - "div.profile-mini-stat__label:contains('總發佈') + div"
