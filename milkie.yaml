# milkie — 自动生成自 PT-depiler（tools/convert-definitions.go）。
# schema: 。selectors/user_info 若未列出则由 EnsureDefaults 自填校准默认。
aka:
    - ME
    - 奶昔
description: Milkie.cc (ME) is Private Torrent Tracker for 0DAY / GENERAL
id: milkie
format: json
name: Milkie
extra_param:
    ps: "50"
search_entry: /api/v1/torrents
search_param: query
selectors:
    fields:
        category:
            filters:
                - args: 1=Movies:::2=TV:::3=Music:::4=Games:::5=Ebook:::6=Apps:::7=Adult
                  name: map
            selector: category
        completed:
            selector: downloaded
        detail:
            selector: id
            filters:
                - name: prepend
                  args: /browse/
        leechers:
            selector: leechers
        seeders:
            selector: seeders
        size:
            selector: size
        time:
            selector: createdAt
            filters:
                - name: split
                  args: "+:::0"
        title:
            selector: releaseName
    rows:
        selector: torrents
tags:
    - 综合
timezone_offset: "+0200"
user_info:
    pages:
        - path: /api/v1/auth
          format: json
          fields:
            name:
                selector: user.displayName
            level:
                text: Early bird
            uploaded:
                filters:
                    - name: parse_size
                selector: user.uploaded
            downloaded:
                filters:
                    - name: parse_size
                selector: user.downloaded
            join_date:
                selector: user.createdAt
                filters:
                    - name: parse_time
urls:
    - https://milkie.cc/
