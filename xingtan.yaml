aka:
    - 杏林
    - XingTan
description: 杏坛 - 积少成多，聚沙成塔。
id: xingtan
legacy_urls:
    - https://xinglin.one/
level_requirements:
    - id: 1
      name: Peasant
      privilege: 被降级的用户，他们有15天时间来提升分享率，否则他们会被踢。不能发表趣味盒内容；不能申请友情链接；不能上传字幕。
    - id: 2
      name: User
      privilege: 新用户的默认级别。
    - downloaded: 50GB
      id: 3
      interval: P4W
      name: Power User
      privilege: 得到一个邀请名额；可以直接发布种子；可以查看NFO文档；可以查看用户列表；可以请求续种； 可以查看排行榜；可以查看其它用户的种子历史(如果用户隐私等级未设置为"强")； 可以删除自己上传的字幕。
      ratio: 1.05
      seeding_bonus: 14888
    - downloaded: 120GB
      id: 4
      interval: P8W
      name: Elite User
      ratio: 1.55
      seeding_bonus: 29888
    - downloaded: 300GB
      id: 5
      interval: P15W
      name: Crazy User
      privilege: CrazyUser及以上用户封存账号后不会被删除；得到两个邀请名额；可以在做种/下载/发布的时候选择匿名模式。
      ratio: 2.05
      seeding_bonus: 59888
    - downloaded: 500GB
      id: 6
      interval: P25W
      name: Insane User
      privilege: 可以查看普通日志。
      ratio: 2.55
      seeding_bonus: 118888
    - downloaded: 750GB
      id: 7
      interval: P40W
      name: Veteran User
      privilege: 得到三个邀请名额；可以查看其它用户的评论、帖子历史。
      ratio: 3.05
      seeding_bonus: 236888
    - downloaded: 1TB
      id: 8
      interval: P60W
      is_kept: true
      name: Extreme User
      privilege: Extreme User及以上等级用户会永远保留；可以更新过期的外部信息；可以查看Extreme User论坛。
      ratio: 3.55
      seeding_bonus: 468888
    - downloaded: 1.5TB
      id: 9
      interval: P80W
      is_kept: true
      name: Ultimate User
      privilege: 得到四个邀请名额。
      ratio: 4.05
      seeding_bonus: 988888
    - downloaded: 3TB
      id: 10
      interval: P100W
      is_kept: true
      name: Nexus Master
      privilege: 得到五个邀请名额。
      ratio: 4.55
      seeding_bonus: 1888888
    - group_type: vip
      id: 100
      name: 贵宾(VIP)
      privilege: 和Nexus Master拥有相同权限并被认为是精英成员。免除自动降级。
    - group_type: manager
      id: 200
      name: 养老族(Retiree)
      privilege: 退休后的管理组成员。
    - group_type: manager
      id: 201
      name: 发布员(Uploader)
      privilege: 专注的发布者。免除自动降级；可以查看匿名用户的真实身份。
    - group_type: manager
      id: 202
      name: 总版主(Moderator)
      privilege: 可以查看管理组信箱、举报信箱；管理趣味盒内容、投票内容；可以编辑或删除任何发布的种子；可以管理候选；可以管理论坛帖子、用户评论；可以查看机密日志；可以删除任何字幕；可以管理日志中的代码、史册；可以查看用户的邀请记录；可以管理用户帐号的一般信息。不能管理友情链接、最近消息、论坛版块；不能将种子设为置顶或促销；不能查看用户IP或Email等机密信息；不能删除账号。
    - group_type: manager
      id: 203
      name: 管理员(Administrator)
      privilege: 除了不能改变站点设定、管理捐赠外，可以做任何事。
    - group_type: manager
      id: 204
      name: 维护开发员(Sysop)
      privilege: 网站开发/维护人员，可以改变站点设定，不能管理捐赠。
    - group_type: manager
      id: 205
      name: 主管(Staff Leader)
      privilege: 网站主管，可以做任何事。
name: 杏坛
schema: nexusphp
tags:
    - 医学
    - 电子书
    - 学术
timezone_offset: "+0800"
urls:
    - https://xingtan.one/
user_info:
    path: index.php
    user_torrent_list_api: "/getusertorrentlistajax.php?userid={id}&type={type}"
    fields:
        id:
            attr: href
            filters:
                - name: queryparam
                  args: id
            selectors:
                - "#info_block a[href*='userdetails.php'][href*='id=']:first"
                - "a[href*='userdetails.php'][class*='Name']:first"
                - "a[href*='userdetails.php']:first"
        name:
            selectors:
                - "#info_block a[href*='userdetails.php'][href*='id=']:first"
                - "a[href*='userdetails.php'][class*='Name']:first"
                - "a[href*='userdetails.php']:first"
        uploaded:
            filters:
                - name: regexp
                  args: '(?i)(?:上传量|上傳量|Uploaded)[\s\S]{0,160}?([\d.,]+\s*(?:[KMGTPE]i?B|Bytes|B))'
                - name: parse_size
            selectors:
                - "#info_block"
                - ".medium"
                - "td.rowhead:contains('传输') + td"
                - "td.rowhead:contains('傳送') + td"
                - "td.rowhead:contains('Transfers') + td"
        downloaded:
            filters:
                - name: regexp
                  args: '(?i)(?:下载量|下載量|Downloaded)[\s\S]{0,160}?([\d.,]+\s*(?:[KMGTPE]i?B|Bytes|B))'
                - name: parse_size
            selectors:
                - "#info_block"
                - ".medium"
                - "td.rowhead:contains('传输') + td"
                - "td.rowhead:contains('傳送') + td"
                - "td.rowhead:contains('Transfers') + td"
        ratio:
            filters:
                - name: regexp
                  args: '(?i)(?:分享率|Ratio)[\s\S]{0,120}?([\d.]+|无限|無限|Inf\.?|Infinity)'
                - name: replace
                  args: 无限:::9999
                - name: replace
                  args: 無限:::9999
                - name: replace
                  args: Infinity:::9999
                - name: replace
                  args: Inf.:::9999
            selectors:
                - "#info_block"
                - ".medium"
                - "td.rowhead:contains('传输') + td"
        seeding:
            filters:
                - name: regexp
                  args: '(?i)(?:当前活动|当前做种|Torrents seeding|Current activity)[^0-9]{0,120}(\d+)'
            selectors:
                - "#info_block"
                - ".medium"
        bonus:
            filters:
                - name: regexp
                  args: '(?i)(?:杏仁值|魔力值|魔力|Karma Points)[\s\S]{0,120}?([\d.,]+)'
                - name: parse_number
            selectors:
                - "td.rowhead:contains('杏仁值') + td"
                - "td.rowhead:contains('Karma Points') + td"
                - "td.rowfollow:contains('杏仁值')"
                - "#info_block"
                - ".medium"
    detail_fields:
        uploaded:
            filters:
                - name: regexp
                  args: '(?i)(?:上传量|上傳量|Uploaded)[\s\S]{0,160}?([\d.,]+\s*(?:[KMGTPE]i?B|Bytes|B))'
                - name: parse_size
            selectors:
                - "td.rowhead:contains('传输') + td"
                - "td.rowhead:contains('傳送') + td"
                - "td.rowhead:contains('Transfers') + td"
        downloaded:
            filters:
                - name: regexp
                  args: '(?i)(?:下载量|下載量|Downloaded)[\s\S]{0,160}?([\d.,]+\s*(?:[KMGTPE]i?B|Bytes|B))'
                - name: parse_size
            selectors:
                - "td.rowhead:contains('传输') + td"
                - "td.rowhead:contains('傳送') + td"
                - "td.rowhead:contains('Transfers') + td"
        ratio:
            filters:
                - name: regexp
                  args: '(?i)(?:分享率|Ratio)[\s\S]{0,120}?([\d.]+|无限|無限|Inf\.?|Infinity)'
                - name: replace
                  args: 无限:::9999
                - name: replace
                  args: 無限:::9999
                - name: replace
                  args: Infinity:::9999
                - name: replace
                  args: Inf.:::9999
            selectors:
                - "td.rowhead:contains('传输') + td"
        level:
            attr: title
            selectors:
                - "td.rowhead:contains('等级') + td > img"
                - "td.rowhead:contains('等級') + td > img"
                - "td.rowhead:contains('Class') + td > img"
        join_date:
            filters:
                - name: regexp
                  args: '(\d{4}[-/]\d{1,2}[-/]\d{1,2})'
            selectors:
                - "td.rowhead:contains('加入日期') + td"
                - "td.rowhead:contains('Join'):contains('date') + td"
        bonus:
            filters:
                - name: parse_number
            selectors:
                - "td.rowhead:contains('杏仁值') + td"
                - "td.rowhead:contains('Karma Points') + td"
                - "td.rowfollow:contains('杏仁值')"
        seeding_size:
            filters:
                - name: parse_size
            selectors:
                - "td.rowhead:contains('当前做种') + td"
                - "td.rowhead:contains('目前做種') + td"
                - "td.rowhead:contains('Current Seeding') + td"
                - "td.rowhead:contains('Seeding Size') + td"
    pages:
        - path: mybonus.php
          fields:
              bonus_per_hour:
                  filters:
                      - name: parse_number
                  selectors:
                      - "div:contains('你当前每小时能获取'):last"
                      - "td:contains('你当前每小时能获取'):last"
                      - "div:contains('你當前每小時能獲取'):last"
                      - "td:contains('你當前每小時能獲取'):last"
                      - "div:contains('You are currently getting'):last"
                      - "td:contains('You are currently getting'):last"
                      - "td[rowspan]"
