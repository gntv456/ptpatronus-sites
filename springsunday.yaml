name: SpringSunday
schema: nexusphp
medal:
    enabled: false
    shop_path: medal.php
selectors:
    fields:
        detail:
            attr: href
            selectors:
                - a[href*='details.php?id='][title]
        download:
            attr: href
            selectors:
                - a[href*='download.php?id=']:has(span.bi-download)
        subtitle:
            selectors:
                - div.torrent-smalldescr > span:not(.torrent-icon-fast)
tags:
    - 影视
    - 音乐
    - 综合
urls:
    - https://springsunday.net/
user_info:
    user_torrent_list_api: "/getusertorrentlistajax.php?userid={id}&type={type}"
    fields:
        bonus:
            filters:
                - name: parse_number
            selectors:
                - td.rowhead:contains('积分') + td
        bonus_per_hour:
            filters:
                - name: parse_number
            selectors:
                - tbody tr.nowrap td:last
        seeding_bonus_per_hour:
            filters:
                - name: parse_number
            selectors:
                - "tbody tr.nowrap:first > td:nth-child(9)"
    detail_fields:
        bonus: # 织梦的积分 rowhead 行在 userdetails.php（usercp 无），经 uid 自动补抓合并
            filters:
                - name: parse_number
            selectors:
                - td.rowhead:contains('积分') + td
                - td.rowfollow:contains('积分')
    pages:
        - path: mybonus.php
          use_fields:
              - bonus_per_hour
              - seeding_bonus_per_hour
