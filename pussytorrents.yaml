    rows:
        selector: table#torrenttable > tbody > tr:has(a[href^="/download/"])
tags:
    - XXX
timezone_offset: "+0000"
urls:
    - https://pussytorrents.org/
user_info:
    fields:
        downloaded:
            filters:
                - name: parse_size
            selector: '#profile button:has(.icon-arrow-down)'
