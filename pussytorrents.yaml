search_entry: /torrents/browse
selectors:
    fields:
        category:
            filters:
                - args: XXX
                  name: const
            selector: :self
        completed:
            filters:
                - name: parse_number
            selector: td:nth-last-child(4)
        detail:
            attr: href
            selector: a[href^="/torrent/"]
        download:
            attr: href
            selector: a[href^="/download/"]
        leechers:
            selector: td:nth-last-child(2)
        seeders:
            selector: td:nth-last-child(3)
        size:
            selector: td:nth-last-child(5)
        time:
            filters:
                - args: "Added on :::"
                  name: replace
                - name: parse_time
