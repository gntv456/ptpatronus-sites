# mypt — 自动生成自 PT-depiler（tools/convert-definitions.go）。
# schema: nexusphp。selectors/user_info 若未列出则由 EnsureDefaults 自填校准默认。

aka:
    - 我的PT
description: 我的PT(CC) | 人類資源庫
id: mypt
level_requirements:
    - id: 1
      name: Peasant
      privilege: 被降級的用戶，他們有30天時間來提升分享率，否則他們會被踢。無法發表趣味盒內容；無法申請友情鏈結；無法上傳字幕。
    - id: 2
      name: User
      privilege: 新用戶的預設級別。只能在每周六中午12點至每周日晚上11點59分發布種子。
    - downloaded: 50GB
      id: 3
      interval: P4W
      name: Power User
      privilege: 得到一個邀請名額；可以直接發布種子；可以檢視NFO文件；可以檢視用戶清單；可以要求續種； 可以傳送邀請； 可以檢視排行榜；可以檢視其他用戶的種子曆史(如果用戶隱私等級未設定為"強")； 可以移除自己上傳的字幕。
      ratio: 1.05
    - downloaded: 120GB
      id: 4
      interval: P8W
      name: Elite User
      privilege: Elite User及以上用戶封存賬號后不會被移除。
      ratio: 1.55
    - downloaded: 300GB
      id: 5
      interval: P15W
      name: Crazy User
      privilege: 得到兩個邀請名額；可以在做種/下載/發布的時候選取匿名型態。
      ratio: 2.05
    - downloaded: 500GB
      id: 6
      interval: P25W
      name: Insane User
      privilege: 可以檢視普通日誌。
      ratio: 2.55
    - downloaded: 750GB
      id: 7
      interval: P40W
      name: Veteran User
      privilege: 得到三個邀請名額；可以檢視其他用戶的評論、帖子曆史。Veteran User及以上用戶會永遠保留賬號。
      ratio: 3.05
    - downloaded: 1TB
      id: 8
      interval: P60W
      name: Extreme User
      privilege: 可以更新過期的外部資訊；可以檢視Extreme User論壇。
      ratio: 3.55
    - downloaded: 1.5TB
      id: 9
      interval: P60W
      name: Ultimate User
      privilege: 得到五個邀請名額。
      ratio: 5.05
    - downloaded: 3TB
      id: 10
      interval: P100W
      name: Nexus Master
      privilege: 得到十個邀請名額。
      ratio: 4.55
    - group_type: vip
      id: 100
      name: 貴賓(VIP)
      privilege: 和Nexus Master擁有相同許可權并被認為是精英成員。免除自動降級。
    - group_type: manager
      id: 200
      name: 養老族(Retiree)
      privilege: '  退休后的管理組成員。'
    - group_type: manager
      id: 201
      name: 發布員(Uploader)
      privilege: 專注的發布者。免除自動降級；可以檢視匿名用戶的真實身份。
    - group_type: manager
      id: 202
      name: 總版主(Moderator)
      privilege: 可以檢視管理組郵箱、舉報郵箱；管理趣味盒內容、投票內容；可以編輯或移除任何發布的種子；可以管理候選；可以管理論壇帖子、用戶評論；可以檢視機密日誌；可以移除任何字幕；可以管理日誌中的程式碼、史冊；可以檢視用戶的邀請記錄；可以管理用戶帳號的一般資訊。無法管理友情鏈結、最近訊息、論壇版塊；無法將種子設為置頂或促銷；無法檢視用戶IP或Email等機密資訊；無法移除賬號。
    - group_type: manager
      id: 203
      name: 管理員(Administrator)
      privilege: 除了無法改變網站設定、管理捐贈外，可以做任何事。
    - group_type: manager
      id: 204
      name: 維護開發員(Sysop)
      privilege: 網站開發/維護人員，可以改變網站設定，無法管理捐贈。
    - group_type: manager
      id: 205
      name: 主管(Staff Leader)
      privilege: 網站主管，可以做任何事。
name: MyPT
schema: nexusphp
tags:
    - 综合
timezone_offset: "+0800"
urls:
    - https://cc.mypt.cc/
user_info:
    path: index.php
    user_torrent_list_api: "/getusertorrentlistajax.php?userid={id}&type={type}"
    fields:
        id:
            attr: href
            filters:
                - name: queryparam
                  args: id
            selectors:
                - "#info_block a[href*='userdetails.php'][href*='id=']:first"
                - "a[href*='userdetails.php'][class*='Name']:first"
                - "a[href*='userdetails.php']:first"
        name:
            selectors:
                - "#info_block a[href*='userdetails.php'][href*='id=']:first"
                - "a[href*='userdetails.php'][class*='Name']:first"
                - "a[href*='userdetails.php']:first"
        uploaded:
            filters:
                - name: regexp
                  args: '(?i)(?:上传量|上傳量|Uploaded)[\s\S]{0,160}?([\d.,]+\s*(?:[KMGTPE]i?B|Bytes|B))'
                - name: parse_size
            selectors:
                - "#info_block"
                - ".medium"
                - "td.rowhead:contains('传输') + td"
                - "td.rowhead:contains('傳送') + td"
                - "td.rowhead:contains('Transfers') + td"
        downloaded:
            filters:
                - name: regexp
                  args: '(?i)(?:下载量|下載量|Downloaded)[\s\S]{0,160}?([\d.,]+\s*(?:[KMGTPE]i?B|Bytes|B))'
                - name: parse_size
            selectors:
                - "#info_block"
                - ".medium"
                - "td.rowhead:contains('传输') + td"
                - "td.rowhead:contains('傳送') + td"
                - "td.rowhead:contains('Transfers') + td"
        ratio:
            filters:
                - name: regexp
                  args: '(?i)(?:分享率|Ratio)[\s\S]{0,120}?([\d.]+|无限|無限|Inf\.?|Infinity)'
                - name: replace
                  args: 无限:::9999
                - name: replace
                  args: 無限:::9999
                - name: replace
                  args: Infinity:::9999
                - name: replace
                  args: Inf.:::9999
            selectors:
                - "#info_block"
                - ".medium"
                - "td.rowhead:contains('传输') + td"
        seeding:
            filters:
                - name: regexp
                  args: '(?i)(?:当前活动|当前做种|Torrents seeding|Current activity)[^0-9]{0,120}(\d+)'
            selectors:
                - "#info_block"
                - ".medium"
        bonus:
            filters:
                - name: regexp
                  args: '(?i)(?:魔力值|魔力|Karma Points)[\s\S]{0,120}?([\d.,]+)'
                - name: parse_number
            selectors:
                - td.rowhead:contains('魔力值') + td, td.rowhead:contains('Karma Points') + td
                - "td.rowhead:contains('魔力') + td"
                - "td.rowhead:contains('Karma Points') + td"
                - "td.rowfollow:contains('魔力')"
                - "#info_block"
                - ".medium"
    detail_fields:
        uploaded:
            filters:
                - name: regexp
                  args: '(?i)(?:上传量|上傳量|Uploaded)[\s\S]{0,160}?([\d.,]+\s*(?:[KMGTPE]i?B|Bytes|B))'
                - name: parse_size
            selectors:
                - "td.rowhead:contains('传输') + td"
                - "td.rowhead:contains('傳送') + td"
                - "td.rowhead:contains('Transfers') + td"
        downloaded:
            filters:
                - name: regexp
                  args: '(?i)(?:下载量|下載量|Downloaded)[\s\S]{0,160}?([\d.,]+\s*(?:[KMGTPE]i?B|Bytes|B))'
                - name: parse_size
            selectors:
                - "td.rowhead:contains('传输') + td"
                - "td.rowhead:contains('傳送') + td"
                - "td.rowhead:contains('Transfers') + td"
        ratio:
            filters:
                - name: regexp
                  args: '(?i)(?:分享率|Ratio)[\s\S]{0,120}?([\d.]+|无限|無限|Inf\.?|Infinity)'
                - name: replace
                  args: 无限:::9999
                - name: replace
                  args: 無限:::9999
                - name: replace
                  args: Infinity:::9999
                - name: replace
                  args: Inf.:::9999
            selectors:
                - "td.rowhead:contains('传输') + td"
        level:
            attr: title
            selectors:
                - "td.rowhead:contains('等级') + td > img"
                - "td.rowhead:contains('等級') + td > img"
                - "td.rowhead:contains('Class') + td > img"
        join_date:
            filters:
                - name: regexp
                  args: '(\d{4}[-/]\d{1,2}[-/]\d{1,2})'
            selectors:
                - "td.rowhead:contains('加入日期') + td"
                - "td.rowhead:contains('Join'):contains('date') + td"
        bonus:
            filters:
                - name: parse_number
            selectors:
                - "td.rowhead:contains('魔力') + td"
                - "td.rowhead:contains('Karma Points') + td"
                - "td.rowfollow:contains('魔力')"
        seeding_size:
            filters:
                - name: parse_size
            selectors:
                - "td.rowhead:contains('当前做种') + td"
                - "td.rowhead:contains('目前做種') + td"
                - "td.rowhead:contains('Current Seeding') + td"
                - "td.rowhead:contains('Seeding Size') + td"
    pages:
        - path: mybonus.php
          fields:
              bonus_per_hour:
                  filters:
                      - name: regexp
                        args: '(?i)(?:能获取|能獲取|currently\s+getting)[^0-9]{0,60}([\d.,]+\.?\d*)'
                      - name: parse_number
                  selectors:
                      - "td.text:contains('你当前每小时能获取')"
                      - "div:contains('你当前每小时能获取')"
                      - "td:contains('你当前每小时能获取')"
                      - "td.text:contains('你當前每小時能獲取')"
                      - "div:contains('你當前每小時能獲取')"
                      - "td:contains('你當前每小時能獲取')"
                      - "div:contains('currently getting')"
                      - "td:contains('currently getting')"
                      - "td[rowspan]"
