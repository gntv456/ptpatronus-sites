    - group_type: manager
      id: 8
      name: Elite Uploader
      privilege: Same access like Uploader.
      ratio: 7
      uploaded: 20TB
      uploads: 100
name: HD-Space
schema: xbtit
search_entry: /index.php
search_param: search
selectors:
    fields:
        category:
            attr: href
            filters:
                - args: category
                  name: queryparam
                - args: 15=Movie / Blu-ray:::40=Movie / Remux:::18=Movie / 720p:::19=Movie / 1080p:::46=Movie / 2160p:::21=TV Show / 720p HDTV:::22=TV Show / 1080p HDTV:::45=TV Show / 2160p HDTV:::24=Documentary / 720p:::25=Documentary / 1080p:::47=Documentary / 2160p:::27=Animation / 720p:::28=Animation / 1080p:::48=Animation / 2160p:::30=Music / HQ Audio:::31=Music / Videos:::33=XXX / 720p:::34=XXX / 1080p:::49=XXX / 2160p:::36=Trailers:::37=Software:::38=Others
                  name: map
            selector: td a[href^='index.php?page=torrents&category=']
        completed:
            selector: td:nth-child(9)
        detail:
            attr: href
            selector: td a[href^='index.php?page=torrent-details']
        download:
            attr: href
            selector: a[href^='download.php?id=']
        leechers:
            selector: td:nth-child(9)
        seeders:
            selector: td:nth-child(8)
        size:
            filters:
                - name: parse_size
            selector: td:nth-child(6)
        subtitle:
            remove: a
            selector: td:nth-child(2) > span
        time:
            filters:
                - name: parse_time
            selectors:
                - td:nth-child(5):contains('day')
                - td:nth-child(5):not(:contains('day'))
        title:
            selector: td a[href^='index.php?page=torrent-details']
    rows:
        selector: table.lista[width='100%'] > tbody > style ~ tr
tags:
    - 影视
timezone_offset: "+0000"
urls:
    - https://hd-space.org/
user_info:
    pages:
        - path: /index.php
          fields:
            id:
                selector: "a[href*='index.php?page=usercp']:first"
                attr: href
                filters:
                    - name: queryparam
                      args: uid
            name:
                selector: "td[align='center'][style='text-align:center;']:contains('Welcome back')>span"
            uploaded:
                selector: "td.green:contains('UP')"
                filters:
                    - name: parse_size
            downloaded:
                selector: "td.red:contains('DL')"
                filters:
                    - name: parse_size
            ratio:
                selector: "td.yellow:contains('Ratio')"
                filters:
                    - name: parse_number
            level:
                selector: "td[align='center'][style='text-align:center;']:contains('Rank')"
                filters:
                    - name: replace
                      args: "Rank: :::"
            bonus:
                selector: "td.green:contains('Bonus')"
                filters:
                    - name: replace
                      args: "Bonus: :::"
                    - name: parse_number
            seeding:
                selector: "img[src='images/actseed.png'] ~ font[color='green']"
                filters:
                    - name: parse_number
        - path: /index.php
          params:
            page: usercp
            uid: "{id}"
          fields:
            join_date:
                selectors:
                    - "td.header:contains('Joined on') + td:not(:contains('day'))"
                    - "td.header:contains('Joined on') + td:contains('day')"
                filters:
                    - name: parse_time
            last_access_at:
                selectors:
                    - "td.header:contains('Last access') + td:not(:contains('day'))"
                    - "td.header:contains('Last access') + td:contains('day')"
                filters:
                    - name: parse_time
        - path: /index.php
          params:
            page: modules
            module: seedbonus
          fields:
            bonus_per_hour:
                selector: "td[valign='top'] > h3"
                filters:
                    - name: parse_number
