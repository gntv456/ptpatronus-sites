name: U2
schema: nexusphp
selectors:
    fields:
        leechers:
            filters:
                - args: '^(\d+)'
                  name: regexp
                - name: parse_number
            selectors:
                - td[class*='leechhlc_']
                - a[href*='#leechers']
        subtitle:
            selectors:
                - span.tooltip
        title:
            selectors:
                - a.tooltip[href*='hit']
tags:
    - 影视
    - 动漫
urls:
    - https://u2.dmhy.org/
user_info:
    user_torrent_list_api: "/getusertorrentlistajax.php?userid={id}&type={type}"
    fields:
        bonus:
            attr: title
            filters:
                - name: parse_number
            selectors:
                - td.rowhead:contains('UCoin') + td > span
        bonus_per_hour:
            filters:
                - args: 'UCoin\s*([\d.,]+)'
                  name: regexp
                - args: "24"
                  name: divide
            selectors:
                - table.main td.text
        seeding:
            filters:
                - args: '<b>\s*(\d+)\s*</b>'
                  name: regexp
                - name: parse_number
            selectors:
                - :self
        seeding_size:
            filters:
                - args: '(?i)(?:大小|Size)[^0-9]*([\d.,]+\s*[KMGTPE]?i?B)'
                  name: regexp
                - name: parse_size
            selectors:
                - :self
    pages:
        - path: /mprecent.php
          params:
            user: "{id}"
          use_fields:
            - bonus_per_hour
