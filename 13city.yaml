aka:
    - 13城
categories:
    - id: "401"
      name: 电影/Movies
    - id: "402"
      name: 连续剧/TV Series
    - id: "403"
      name: 综艺/TV Shows
    - id: "405"
      name: 动漫/Animations
    - id: "406"
      name: 演唱会、MV/Music Videos
    - id: "408"
      name: 音乐/Music
    - id: "409"
      name: 有声小说/E-book
    - id: "413"
      name: 纪录片/Documentaries
description: 一切美好源于分享
id: 13city
legacy_urls:
    - https://13city.online/
level_requirements:
    - name: 小菜鸡
      name_aka:
        - Peasant
      privilege: 当以下情况时将被自动降至本级：1.如果你已经下载了超过64GB，你应该有大于0.5的分享率。2.如果你已经下载了超过256GB，你应该有大于0.6的分享率。3.如果你已经下载了超过512GB，你应该有大于0.7的分享率。4.如果你已经下载了超过768GB，你应该有大于0.8的分享率。5.如果你已经下载了超过1024GB，你应该有大于0.9的分享率。
    - id: 1
      name: 初窥门径
      name_aka:
        - User
      privilege: 注册时默认等级，无特殊要求。
    - downloaded: 256GB
      id: 2
      interval: P4W
      name: 小有所成
      name_aka:
        - Power User
      privilege: 首次升级至此等级的用户将获得1个邀请名额；可以直接发布种子；可以查看NFO文档；可以查看用户列表；可以请求续种； 可以发送邀请； 可以查看排行榜；可以查看其它用户的种子历史(如果用户隐私等级未设置为"强")； 可以删除自己上传的字幕。
      ratio: 1.05
      seeding_bonus: 40000
    - downloaded: 512GB
      id: 3
      interval: P8W
      name: 懵懂求知
      name_aka:
        - Elite User
      privilege: 懵懂求知及以上用户封存账号后不会被删除。
      ratio: 1.55
      seeding_bonus: 80000
    - downloaded: 1024GB
      id: 4
      interval: P15W
      name: 小试牛刀
      name_aka:
        - Crazy User
      privilege: 首次升级至此等级的用户将获得2个邀请名额；可以在做种/下载/发布的时候选择匿名模式。
      ratio: 2.05
      seeding_bonus: 150000
    - downloaded: 2048GB
      id: 5
      interval: P25W
      name: 渐入佳境
      name_aka:
        - Insane User
      privilege: 可以查看普通日志。
      ratio: 2.55
      seeding_bonus: 250000
    - downloaded: 3072GB
      id: 6
      interval: P40W
      is_kept: true
      name: 游刃有余
      name_aka:
        - Veteran User
      privilege: 首次升级至此等级的用户将获得3个邀请名额；可以查看其它用户的评论、帖子历史。游刃有余及以上用户会永远保留账号。
      ratio: 3.05
      seeding_bonus: 500000
    - downloaded: 4096GB
      id: 7
      interval: P60W
      is_kept: true
      name: 登堂入室
      name_aka:
        - Extreme User
      privilege: 可以更新过期的外部信息；可以查看Extreme User论坛。
      ratio: 3.55
      seeding_bonus: 1000000
    - downloaded: 6144GB
      id: 8
      interval: P70W
      is_kept: true
      name: 炉火纯青
      name_aka:
        - Ultimate User
      privilege: 首次升级至此等级的用户将获得5个邀请名额。
      ratio: 4.05
      seeding_bonus: 1550000
    - downloaded: 8192GB
      id: 9
      interval: P80W
      is_kept: true
      name: 返璞归真
      name_aka:
        - Nexus Master
      privilege: 首次升级至此等级的用户将获得10个邀请名额。
      ratio: 4.55
      seeding_bonus: 2400000
    - group_type: vip
      id: 100
      name: 贵宾(VIP)
      privilege: 由管理员仔细斟酌后分配给他们认为对于站点某方面有特殊贡献的用户。
    - group_type: vip
      id: 101
      name: 退休员工
      privilege: 退休后的管理组成员。
    - group_type: manager
      id: 200
      name: 勤劳小蜜蜂
      privilege: 专注的发布者。免除自动降级；可以查看匿名用户的真实身份。
    - group_type: manager
      id: 201
      name: 总版主(Moderator)
      privilege: 可以查看管理组信箱、举报信箱；管理趣味盒内容、投票内容；可以编辑或删除任何发布的种子；可以管理候选；可以管理论坛帖子、用户评论；可以查看机密日志；可以删除任何字幕；可以管理日志中的代码、史册；可以查看用户的邀请记录；可以管理用户帐号的一般信息。不能管理友情链接、最近消息、论坛版块；不能将种子设为置顶或促销；不能查看用户IP或Email等机密信息；不能删除账号。
    - group_type: manager
      id: 202
      name: 管理员(Administrator)
      privilege: 除了不能改变站点设定、管理捐赠外，可以做任何事。
    - group_type: manager
      id: 203
      name: 维护开发员(Sysop)
      privilege: 网站开发/维护人员，可以改变站点设定，不能管理捐赠。
    - group_type: manager
      id: 204
      name: 主管(Staff Leader)
      privilege: 网站主管，可以做任何事。
name: 13city
schema: nexusphp
tags:
    - 影视
    - 综合
timezone_offset: "+0800"
urls:
    - https://13city.org/
    - https://www.13city.org/
user_info:
    path: index.php
    user_torrent_list_api: "/getusertorrentlistajax.php?userid={id}&type={type}"
    fields:
        id:
            attr: href
            filters:
                - name: queryparam
                  args: id
            selectors:
                - "#info_block a[href*='userdetails.php'][href*='id=']:first"
                - "a[href*='userdetails.php'][class*='Name']:first"
                - "a[href*='userdetails.php']:first"
        name:
            selectors:
                - "#info_block a[href*='userdetails.php'][href*='id=']:first"
                - "a[href*='userdetails.php'][class*='Name']:first"
                - "a[href*='userdetails.php']:first"
        uploaded:
            filters:
                - name: regexp
                  args: '(?i)(?:上传量|上傳量|Uploaded)[\s\S]{0,140}?([\d.,]+\s*(?:[KMGTPE]i?B|Bytes|B))'
                - name: parse_size
            selectors:
                - "td.rowhead:contains('传输') + td"
                - "td.rowhead:contains('傳送') + td"
                - "td.rowhead:contains('Transfers') + td"
                - "td.rowfollow:contains('分享率')"
                - "#info_block"
        downloaded:
            filters:
                - name: regexp
                  args: '(?i)(?:下载量|下載量|Downloaded)[\s\S]{0,140}?([\d.,]+\s*(?:[KMGTPE]i?B|Bytes|B))'
                - name: parse_size
            selectors:
                - "td.rowhead:contains('传输') + td"
                - "td.rowhead:contains('傳送') + td"
                - "td.rowhead:contains('Transfers') + td"
                - "td.rowfollow:contains('分享率')"
                - "#info_block"
        ratio:
            filters:
                - name: regexp
                  args: '(?i)(?:分享率|Ratio)[\s\S]{0,120}?([\d.]+|无限|無限|Inf\.?|Infinity)'
                - name: replace
                  args: 无限:::9999
                - name: replace
                  args: 無限:::9999
                - name: replace
                  args: Infinity:::9999
                - name: replace
                  args: Inf.:::9999
            selectors:
                - "td.rowhead:contains('传输') + td"
                - "td.rowfollow:contains('分享率')"
                - "#info_block"
        seeding:
            filters:
                - name: regexp
                  args: '(?i)(?:当前活动|当前做种|Torrents seeding|当前传输)[^0-9]{0,120}(\d+)'
            selectors:
                - "#info_block"
                - "td:has(font.color_active)"
        bonus:
            filters:
                - name: parse_number
            selectors:
                - td.rowhead:contains('啤酒瓶') + td, td.rowhead:contains('Karma Points') + td
                - "#info_block"
    detail_fields:
        uploaded:
            filters:
                - name: regexp
                  args: '(?i)(?:上传量|上傳量|Uploaded)[\s\S]{0,140}?([\d.,]+\s*(?:[KMGTPE]i?B|Bytes|B))'
                - name: parse_size
            selectors:
                - "td.rowhead:contains('传输') + td"
                - "td.rowhead:contains('傳送') + td"
                - "td.rowhead:contains('Transfers') + td"
        downloaded:
            filters:
                - name: regexp
                  args: '(?i)(?:下载量|下載量|Downloaded)[\s\S]{0,140}?([\d.,]+\s*(?:[KMGTPE]i?B|Bytes|B))'
                - name: parse_size
            selectors:
                - "td.rowhead:contains('传输') + td"
                - "td.rowhead:contains('傳送') + td"
                - "td.rowhead:contains('Transfers') + td"
        ratio:
            filters:
                - name: regexp
                  args: '(?i)(?:分享率|Ratio)[\s\S]{0,120}?([\d.]+|无限|無限|Inf\.?|Infinity)'
                - name: replace
                  args: 无限:::9999
                - name: replace
                  args: 無限:::9999
                - name: replace
                  args: Infinity:::9999
                - name: replace
                  args: Inf.:::9999
            selectors:
                - "td.rowhead:contains('传输') + td"
        level:
            attr: title
            selectors:
                - "td.rowhead:contains('等级') + td > img"
                - "td.rowhead:contains('等級') + td > img"
                - "td.rowhead:contains('Class') + td > img"
                - "h1 img[src*='pic/flag']"
        join_date:
            filters:
                - name: regexp
                  args: '(\d{4}[-/]\d{1,2}[-/]\d{1,2})'
            selectors:
                - "td.rowhead:contains('加入日期') + td"
                - "td.rowhead:contains('Join'):contains('date') + td"
        bonus:
            filters:
                - name: parse_number
            selectors:
                - "td.rowhead:contains('啤酒瓶') + td"
                - "td.rowhead:contains('Karma Points') + td"
    pages:
        - path: mybonus.php
          fields:
              bonus_per_hour:
                  filters:
                      - name: parse_number
                  selectors:
                      - "h1:contains('每小时获得的合计啤酒瓶') ~ div table tr:contains('基本奖励') > td:last"
                      - "h1:contains('合计啤酒瓶') ~ div table tr:contains('基本奖励') > td:last"
                      - "tr:contains('基本奖励') > td:last"
