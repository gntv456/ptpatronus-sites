# tokyotosho — 自动生成自 PT-depiler（tools/convert-definitions.go）。
# schema: 。selectors/user_info 若未列出则由 EnsureDefaults 自填校准默认。

aka:
    - 東京 図書館
description: Tokyo Toshokan is a Public BitTorrent Library for JAPANESE Media
id: tokyotosho
legacy_urls:
    - https://tokyotosho.se/
name: Tokyo Toshokan
search_entry: /search.php
search_param: terms
selectors:
    fields:
        category:
            attr: href
            filters:
                - args: cat
                  name: queryparam
                - args: 0=All:::1=Anime:::10=Non-English:::2=Music:::3=Manga:::4=Hentai:::5=Other:::7=Raws:::8=Drama:::9=Music Video:::11=Batch:::12=Hentai (Anime):::13=Hentai (Manga):::14=Hentai (Games):::15=JAV
                  name: map
            selector: a[href*='cat=']
        completed:
            filters:
                - args: "C: (\\d+)"
                  name: regexp
            selector: td.stats
        detail:
            attr: href
            selector: a[href^="details.php?id="]
        download:
            attr: href
            selector: td.desc-top a[type="application/x-bittorrent"]
        leechers:
            filters:
                - args: "L: (\\d+)"
                  name: regexp
            selector: td.stats
        seeders:
            filters:
                - args: "S: (\\d+)"
                  name: regexp
            selector: td.stats
        size:
            filters:
                - args: "Size: ([^|]+) ?"
                  name: regexp
                - name: parse_size
            selector: td.desc-bot
        subtitle:
            filters:
                - args: "Comment: ([^|]+) ?"
                  name: regexp
            selector: td.desc-bot
        time:
            filters:
                - args: "Date: ([^|]+) ?"
                  name: regexp
                - args: UTC:::+0000
                  name: replace
                - name: parse_time
            selector: td.desc-bot
        title:
            selector: td.desc-top a[type="application/x-bittorrent"]
    rows:
        selector: table.listing tr.category_0
urls:
    - https://www.tokyotosho.info/
    - https://tokyo-tosho.net/
