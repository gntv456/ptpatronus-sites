name: 极速之星
no_login:
    selector: a[href*="login_pt.php"]
search_entry: /browse.php
search_param: s
selectors:
    fields:
        category:
            attr: href
            filters:
                - args: c
                  name: queryparam
                - args: 1000=电影:::1010=电影-原盘:::1015=电影-无损提取:::1020=电影-重编码:::1025=电影-WEB:::1030=电影-TV:::1033=电影-DVD:::1035=电影-其他:::1200=剧集:::1210=剧集-亚洲合集:::1215=剧集-欧美合集:::1220=剧集-其他合集:::1225=剧集-亚洲剧:::1230=剧集-欧美剧:::1235=剧集-其他:::1400=音乐:::1401=音乐-欧美:::1402=音乐-华语:::1403=音乐-日韩:::1404=音乐-MV:::1405=音乐-古典:::1406=音乐-原声:::1600=动漫:::1610=动漫-连载:::1615=动漫-完结:::1620=动漫-剧场:::1625=动漫-OVA/OAD:::1630=动漫-演唱会:::1635=动漫-漫画:::1640=动漫-轻小说:::1645=动漫-周边:::1800=游戏:::1801=游戏-PC:::1802=游戏-主机:::1803=游戏-周边:::1804=游戏-视频:::2000=节目:::2001=节目-体育:::2002=节目-综艺:::2003=节目-专题:::2010=节目-纪录片:::2200=书籍:::2400=软件:::2600=学习:::2601=学习-计算机:::2602=学习-外语:::2603=学习-考研:::2604=学习-课件:::2605=学习-视频:::2800=其他:::2801=其他-视频:::2802=其他-音频:::2803=其他-图片:::2804=其他-文档:::2805=其他-播种机
                  name: map
            selector: a[href*='browse.php?c=']
        completed:
            filters:
                - name: parse_number
            selector: td:nth-child(7)
        detail:
            attr: href
            selector: a[href^='details.php?tid=']
        download:
            attr: href
            selector: a[href^='download.php?tid=']:not([href*='ssl'])
        leechers:
            filters:
                - name: parse_number
            selector: td:nth-child(6)
        seeders:
            filters:
                - name: parse_number
            selector: td:nth-child(5)
        size:
            filters:
                - name: parse_size
            selector: td:nth-child(4)
        subtitle:
            attr: html
            filters:
                - name: bitpt_subtitle
            selector: td:nth-child(2)
        time:
            filters:
                - args: '[yyyy-MM-dd HH:mm]'
                  name: parse_time
            selector: td:nth-child(8) p.add_t
        title:
            remove: span.t_t_d, span.t_t_d_n, img
            filters:
                - name: collapse_space
            selector: a[href^='details.php?tid=']
    rows:
        selector: table.torrenttable > tbody > tr:has(a[href^='details.php?tid='])
tags:
    - 教育网
    - 综合
    - 影视
timezone_offset: "+0800"
urls:
    - https://bitpt.cn/
user_info:
    fields:
        id:
            attr: href
            filters:
                - args: uid
                  name: queryparam
            selectors:
                - "#userinfotop a[href*='userdetails.php?uid=']"
                - a[href*='userdetails.php?uid=']
        name:
            selectors:
                - "#userinfotop a[href*='userdetails.php?uid=']"
                - a[href*='userdetails.php?uid=']
        uploaded:
            filters:
                - name: parse_size
            selector: "td.lefttdud:contains('上传流量') + td"
        downloaded:
            filters:
                - name: parse_size
            selector: "td.lefttdud:contains('下载流量') + td"
        ratio:
            filters:
                - name: parse_number
            selector: "td.lefttdud:contains('共享率') + td"
        bonus:
            filters:
                - args: 累计\s*([\d.,]+)
                  name: regexp
            selector: "td.lefttdud:contains('星辰') + td"
        level:
            selector: "td.lefttdud:contains('用户级别') + td"
        join_date:
            filters:
                - name: parse_time
            selector: "td.lefttdud:contains('注册时间') + td"
        last_access_at:
            filters:
                - name: parse_time
            selector: "td.lefttdud:contains('最后访问时间(IPv4)') + td"
        uploads:
            filters:
                - name: parse_number
            selector: "td.lefttdud:contains('发种次数') + td"
        seeding:
            filters:
                - args: (\d+)\s*个
                  name: regexp
            selector: a[href*='seedtype=seeding']
        seeding_size:
            filters:
                - args: 共\s*([\d.,]+\s*[TGMKZEP]?i?B)
                  name: regexp
                - name: parse_size
            selector: a[href*='seedtype=seeding']
    pages:
        - path: /index.php
          use_fields:
            - id
            - name
        - path: /userdetails.php
          params:
            uid: "{id}"
          use_fields:
            - uploaded
            - downloaded
            - ratio
            - bonus
            - level
            - join_date
            - last_access_at
            - uploads
            - seeding
            - seeding_size
