      seeding_bonus: 80000
    - downloaded: 300GB
      group_type: user
      id: 5
      interval: P15W
      name: Crazy User
      name_aka:
        - 轻舟飘渺
      privilege: 得到两个邀请名额；可以在做种/下载/发布的时候选择匿名模式。
      ratio: 4
