    - downloaded: 500GB
      group_type: user
      id: 6
      interval: P25W
      name: Insane User
      name_aka:
        - 长空啸傲
      privilege: '  可以查看普通日志。'
      ratio: 5
      seeding_bonus: 250000
    - downloaded: 750GB
      group_type: user
      id: 7
      interval: P40W
      is_kept: true
      name: Veteran User
      name_aka:
        - 江东帆影
      privilege: 得到三个邀请名额；可以查看其它用户的评论、帖子历史。Veteran User及以上用户会永远保留账号。
      ratio: 6
      seeding_bonus: 400000
    - downloaded: 1TB
      group_type: user
      id: 8
      interval: P60W
      is_kept: true
      name: Extreme User
      name_aka:
        - 碧海潮生
      privilege: 可以更新过期的外部信息；可以查看Extreme User论坛
      ratio: 7
      seeding_bonus: 600000
    - downloaded: 4TB
      group_type: user
      id: 9
      interval: P80W
      is_kept: true
      name: Ultimate User
      name_aka:
        - 九州雷动
      privilege: 得到五个邀请名额。
      ratio: 8
      seeding_bonus: 800000
    - downloaded: 10TB
      group_type: user
      id: 10
      interval: P100W
      is_kept: true
      name: Nexus Master
      name_aka:
        - 一鳞半爪
      privilege: 得到十个邀请名额。
      ratio: 10
      seeding_bonus: 1000000
    - group_type: vip
      id: 100
      name: VIP
      name_aka:
        - 贵宾
      privilege: 和Nexus Master拥有相同权限并被认为是精英成员。免除自动降级
    - group_type: manager
      id: 200
      name: Retiree
      name_aka:
        - 养老族
      privilege: 退休后的管理组成员。
    - group_type: manager
      id: 201
      name: Uploader
      name_aka:
        - 发布员
      privilege: 专注的发布者。免除自动降级；可以查看匿名用户的真实身份。
    - group_type: manager
      id: 202
      name: Moderator
      name_aka:
        - 总版主
      privilege: 可以查看管理组信箱、举报信箱；管理趣味盒内容、投票内容；可以编辑或删除任何发布的种子；可以管理候选；可以管理论坛帖子、用户评论；可以查看机密日志；可以删除任何字幕；可以管理日志中的代码、史册；可以查看用户的邀请记录；可以管理用户帐号的一般信息。不能管理友情链接、最近消息、论坛版块；不能将种子设为置顶或促销；不能查看用户IP或Email等机密信息；不能删除账号。
