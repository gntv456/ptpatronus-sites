      ratio: 2
      seeding_bonus: 40000
    - downloaded: 120GB
      group_type: user
      id: 4
      interval: P8W
      name: Elite User
      name_aka:
        - 五湖信步
      privilege: Elite User及以上用户封存账号后不会被删除。
