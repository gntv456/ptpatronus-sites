      id: 4
      name: VIP
      privilege: This class always has a minimum ratio equal to 2, regardless of the downloads made, and is exempt from hit&run rules. They can set their own Custom Title.
name: FileList
schema: filelist
search_entry: /browse.php
search_param: search
selectors:
    fields:
        category:
            attr: alt
            selectors:
                - div:nth-child(1) img[alt]
        completed:
            selector: div:nth-child(8)
        detail:
            attr: href
            filters:
                - args: id
                  name: queryparam
                - args: /details.php?id=
                  name: prepend
            selectors:
                - a[href*="download.php?id="]
        download:
            attr: href
            selectors:
                - a[href*="download.php?id="]
        leechers:
            selector: div:nth-child(10)
        seeders:
            selector: div:nth-child(9)
        size:
            filters:
                - name: parse_size
            selector: div:nth-child(7)
        subtitle:
            filters:
                - args: ""
                  name: const
            selector: :self
        time:
            filters:
                - name: dmy_hms
            selector: div:nth-child(6)
        title:
            attr: title
            selectors:
                - a[href*='details.php'][title]
                - a[href*='details.php']:has(b)
    rows:
        selector: .torrentrow
tags:
    - 影视
    - 综合
timezone_offset: "+0000"
urls:
    - https://filelist.io/
user_info:
    pages:
        - path: /index.php
          fields:
            id:
                attr: href
                filters:
                    - args: id
                      name: queryparam
                selectors:
                    - .statusbar a[href*='userdetails.php']:has(>span)
                    - .statusbar a[href*='userdetails.php']
            name:
                selectors:
                    - .statusbar a[href*='userdetails.php'] span
            uploaded:
                filters:
                    - name: parse_size
                selectors:
                    - span:has(img[src*='uploaded'])
            downloaded:
                filters:
                    - name: parse_size
                selectors:
                    - span:has(img[src*='downloaded'])
            bonus:
                filters:
                    - name: parse_number
                selectors:
                    - .statusbar a[href*='shop.php']
        - path: /userdetails.php
          params:
            id: "{id}"
          fields:
            level:
                selectors:
                    - "td:contains('Class') + td"
            join_date:
                filters:
                    - name: parse_time
                selectors:
                    - "td:contains('Join'):contains('date') + td"
            last_access_at:
                filters:
                    - name: split
                      args: " (:::0"
                    - name: parse_time
                selectors:
                    - "td:contains('Last'):contains('seen') + td"
            seeding:
                filters:
                    - args: Seeding\s+(\d+)\s+torrents
                      name: regexp
                selectors:
                    - "td:contains('Seed'):contains('bonus') + td > div:first"
            seeding_size:
                filters:
                    - args: total seed size of ([\d.\s,ZEPTGMKiB]+)\.
                      name: regexp
                    - name: parse_size
                selectors:
                    - "td:contains('Seed'):contains('bonus') + td > div:first"
            bonus_per_hour:
                filters:
                    - name: parse_number
                selectors:
                    - "td:contains('Seed'):contains('bonus') + td > div:nth-child(3)"
