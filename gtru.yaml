urls:
    - https://www.gaytor.rent/
user_info:
    pages:
        - path: /userdetails.php
          fields:
            name:
                selector: .ud-profile-name
            uploaded:
                selector: ".ud-stat-row:contains('Uploaded') .ud-stat-value"
                filters:
                    - name: split
                      args: "[:::0"
                    - name: parse_size
            downloaded:
                selector: ".ud-stat-row:contains('Downloaded') .ud-stat-value"
                filters:
                    - name: split
                      args: "[:::0"
                    - name: parse_size
            ratio:
                selector: ".ud-stat-row:contains('Share ratio') .ud-stat-value"
                filters:
                    - name: parse_number
            bonus:
                selector: ".ud-stat-row:contains('Total Seed Bonus') .ud-stat-value"
                filters:
                    - name: parse_number
            seeding:
                selector: "#activeseed"
                filters:
                    - name: parse_number
            level:
                selector: ".ud-profile-meta img[src*='/classes/']"
                attr: src
                filters:
                    - name: regexp
                      args: '/([^/]+)\.\w+$'
                    - name: lower
                    - name: map
                      args: user=User:::power=PowerUser:::vip=VIP:::mod=Moderator:::sysop=SysOp:::admin=Admin
            join_date:
                selector: ".ud-profile-meta span:has(i.fa-calendar-o)"
                filters:
                    - name: regexp
                      args: '^([^(]+)'
                    - name: parse_time
            last_access_at:
                selector: ".ud-profile-meta span:has(i.fa-clock-o)"
                filters:
                    - name: regexp
                      args: '^([^(]+)'
                    - name: parse_time
            uploads:
                selector: "#uploaded table.dc-torrent-table tbody tr"
                attr: count
            seeding_size:
                selector: "#seeding table.dc-torrent-table tbody tr td:nth-child(3)"
                attr: text_all
                filters:
                    - name: sum_size
