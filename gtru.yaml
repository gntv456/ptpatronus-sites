name: GayTorrent.ru
search_entry: /search.php
search_param: search
selectors:
    fields:
        category:
            attr: title
            selector: span.dc-grid-main-cat
        completed:
            filters:
                - name: parse_number
            selector: span.dc-grid-card-snat
        detail:
            attr: href
            selector: a.dc-grid-card-title
        download:
            attr: href
            selector: a.index[href*='download.php/']
        leechers:
            filters:
                - name: parse_number
            selector: span.dc-grid-card-leechers
        seeders:
            filters:
                - name: parse_number
            selector: span.dc-grid-card-seeders
        size:
            filters:
                - name: parse_size
            selector: span.dc-grid-card-size
        time:
            attr: title
            filters:
                - args: '^[^:]*:\s*(.+)$'
                  name: regexp
                - args: '[yyyy-MM-dd HH:mm:ss]'
                  name: parse_time
            selector: span.dc-grid-card-age
        title:
            attr: title
            selector: a.dc-grid-card-title
    rows:
        selector: div.dc-search-grid article.dc-grid-card
tags:
