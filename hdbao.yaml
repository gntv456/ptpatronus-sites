# hdbao - user fields migrated from PT-manager/PT-depiler; live smoke still recommended.
id: hdbao
name: HDBao
aka:
    - 红豆包
description: HDBao 红豆包
schema: nexusphp
urls:
    - https://hdbao.cc/
categories:
    - id: "407"
      name: Sports/赛事
    - id: "401"
      name: Movies/电影
    - id: "402"
      name: TV Series/电视剧
    - id: "404"
      name: Documentaries/纪录片
    - id: "403"
      name: TV Shows/综艺
    - id: "409"
      name: Misc/音乐
    - id: "408"
      name: Concert/演唱会
    - id: "406"
      name: Music Videos/音乐MV
    - id: "405"
      name: Animations/动漫&动画
    - id: "410"
      name: Tutorial/教程
    - id: "411"
      name: Others/其他
search_categories:
    movie:
        - "401"
        - "404"
        - "405"
    tv:
        - "402"
        - "403"
    music:
        - "409"
        - "408"
        - "406"
level_requirements:
    - id: 0
      name: User
    - id: 1
      name: Power User
      interval: P4W
      downloaded: 50GB
      ratio: 1.05
    - id: 2
      name: Elite User
      interval: P8W
      downloaded: 120GB
      ratio: 1.55
    - id: 3
      name: Crazy User
      interval: P15W
      downloaded: 300GB
      ratio: 2.05
    - id: 4
      name: Insane User
      interval: P25W
      downloaded: 500GB
      ratio: 2.55
    - id: 5
      name: Veteran User
      interval: P40W
      downloaded: 750GB
      ratio: 3.05
      is_kept: true
    - id: 6
      name: Extreme User
      interval: P60W
      downloaded: 1TB
      ratio: 3.55
      is_kept: true
    - id: 7
      name: Ultimate User
      interval: P80W
      downloaded: 1.5TB
      ratio: 4.05
      is_kept: true
    - id: 8
      name: Nexus Master
      interval: P100W
      downloaded: 3TB
      ratio: 4.55
      is_kept: true
user_info:
    path: index.php
    user_torrent_list_api: "/getusertorrentlistajax.php?userid={id}&type={type}"
    fields:
        id:
            attr: href
            filters:
                - name: queryparam
                  args: id
            selectors:
                - "#info_block a[href*='userdetails.php'][href*='id=']:first"
                - "a[href*='userdetails.php'][class*='Name']:first"
                - "a[href*='userdetails.php']:first"
        name:
            selectors:
                - "#info_block a[href*='userdetails.php'][href*='id=']:first"
                - "a[href*='userdetails.php'][class*='Name']:first"
                - "a[href*='userdetails.php']:first"
        uploaded:
            filters:
                - name: regexp
                  args: '(?i)(?:上传量|上傳量|Uploaded)[\s\S]{0,120}?([\d.,]+\s*(?:[KMGTPE]i?B|Bytes|B))'
                - name: parse_size
            selectors:
                - "#info_block"
                - "td.rowhead:contains('传输') + td"
                - "td.rowhead:contains('傳送') + td"
                - "td.rowhead:contains('Transfers') + td"
        downloaded:
            filters:
                - name: regexp
                  args: '(?i)(?:下载量|下載量|Downloaded)[\s\S]{0,120}?([\d.,]+\s*(?:[KMGTPE]i?B|Bytes|B))'
                - name: parse_size
            selectors:
                - "#info_block"
                - "td.rowhead:contains('传输') + td"
                - "td.rowhead:contains('傳送') + td"
                - "td.rowhead:contains('Transfers') + td"
        ratio:
            filters:
                - name: regexp
                  args: '(?i)(?:分享率|Ratio)[\s\S]{0,160}?([\d.]+|无限|無限|Inf\.?|Infinity)'
                - name: replace
                  args: 无限:::9999
                - name: replace
                  args: 無限:::9999
                - name: replace
                  args: Infinity:::9999
                - name: replace
                  args: Inf.:::9999
            selectors:
                - "#info_block"
                - "td.rowhead:contains('传输') + td"
                - "td.rowhead:contains('傳送') + td"
                - "td.rowhead:contains('Transfers') + td"
        seeding:
            filters:
                - name: regexp
                  args: '(?i)(?:当前活动|当前做种|Torrents seeding)[^0-9]{0,80}(\d+)'
            selectors:
                - "#info_block"
        bonus:
            filters:
                - name: regexp
                  args: '(?i)(?:魔力值|Karma Points)[\s\S]{0,180}?([\d.,]+)'
                - name: parse_number
            selectors:
                - "#info_block"
                - "td.rowhead:contains('魔力值') + td"
                - "td.rowfollow:contains('魔力值')"
                - "td.rowhead:contains('Karma Points') + td"
    detail_fields:
        uploaded:
            filters:
                - name: regexp
                  args: '(?i)(?:上传量|上傳量|Uploaded)[\s\S]{0,120}?([\d.,]+\s*(?:[KMGTPE]i?B|Bytes|B))'
                - name: parse_size
            selectors:
                - "td.rowhead:contains('传输') + td"
                - "td.rowhead:contains('傳送') + td"
                - "td.rowhead:contains('Transfers') + td"
        downloaded:
            filters:
                - name: regexp
                  args: '(?i)(?:下载量|下載量|Downloaded)[\s\S]{0,120}?([\d.,]+\s*(?:[KMGTPE]i?B|Bytes|B))'
                - name: parse_size
            selectors:
                - "td.rowhead:contains('传输') + td"
                - "td.rowhead:contains('傳送') + td"
                - "td.rowhead:contains('Transfers') + td"
        ratio:
            filters:
                - name: regexp
                  args: '(?i)(?:分享率|Ratio)[\s\S]{0,160}?([\d.]+|无限|無限|Inf\.?|Infinity)'
                - name: replace
                  args: 无限:::9999
                - name: replace
                  args: 無限:::9999
                - name: replace
                  args: Infinity:::9999
                - name: replace
                  args: Inf.:::9999
            selectors:
                - "td.rowhead:contains('传输') + td"
                - "td.rowhead:contains('傳送') + td"
                - "td.rowhead:contains('Transfers') + td"
        level:
            attr: title
            selectors:
                - "td.rowhead:contains('等级') + td > img"
                - "td.rowhead:contains('等級') + td > img"
                - "td.rowhead:contains('Class') + td > img"
        join_date:
            filters:
                - name: regexp
                  args: '(\d{4}[-/]\d{1,2}[-/]\d{1,2})'
            selectors:
                - "td.rowhead:contains('加入日期') + td"
                - "td.rowhead:contains('Join'):contains('date') + td"
        bonus:
            filters:
                - name: parse_number
            selectors:
                - "td.rowhead:contains('魔力值') + td"
                - "td.rowhead:contains('Karma Points') + td"
                - "td.rowfollow:contains('魔力值')"
        seeding:
            filters:
                - name: regexp
                  args: '(?i)(?:当前活动|当前做种|Torrents seeding)[^0-9]{0,80}(\d+)'
            selectors:
                - "#info_block"
                - "td.rowhead:contains('当前做种') + td"
    pages:
        - path: mybonus.php
          fields:
              bonus_per_hour:
                  filters:
                      - name: parse_number
                  selectors:
                      - "tr:contains('基本奖励') > td:last"
                      - "tr:contains('Basic') > td:last"
