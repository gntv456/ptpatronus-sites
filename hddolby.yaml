description: 高清杜比
id: hddolby
legacy_urls:
    - https://hddolby.com/
level_requirements:
    - id: 1
      name: User
      privilege: 新用户的默认级别。
    - downloaded: 120GB
      id: 2
      interval: P2W
      name: Power User
      privilege: 得到0个邀请名额；可以直接发布种子；可以查看NFO文档；可以查看用户列表；可以请求续种；以查看排行榜；可以查看其它用户的种子历史(如果用户隐私等级未设置为"强")； 可以删除自己上传的字幕。
      ratio: 2
      seeding_bonus: 60000
    - downloaded: 256GB
      id: 3
      interval: P4W
      name: (连长)Elite User
      privilege: Elite User及以上用户封存账号后不会被删除。
      ratio: 2.5
      seeding_bonus: 120000
    - downloaded: 512GB
      id: 4
      interval: P8W
      name: Crazy User
      privilege: 得到0个邀请名额；可以在做种/下载/发布的时候选择匿名模式。
      ratio: 3
      seeding_bonus: 240000
    - downloaded: 768GB
      id: 5
      interval: P12W
      name: Insane User
      privilege: 无
      ratio: 3.5
      seeding_bonus: 360000
    - downloaded: 1TB
      id: 6
      interval: P20W
      name: Veteran User
      privilege: 可以查看其它用户的评论、帖子历史。
      ratio: 4
      seeding_bonus: 600000
    - downloaded: 2TB
      id: 7
      interval: P28W
      is_kept: true
      name: Extreme User
      privilege: Extreme User及以上用户会永远保留账号。
      ratio: 4.5
      seeding_bonus: 720000
    - downloaded: 4TB
      id: 8
      interval: P40W
      is_kept: true
      name: Ultimate User
      privilege: 无
      ratio: 5
      seeding_bonus: 1200000
    - downloaded: 8TB
      id: 9
      interval: P56W
      is_kept: true
      name: Nexus Master
      privilege: 无
      ratio: 5.5
      seeding_bonus: 1680000
name: HD Dolby
no_login:
    selector: script:contains('take2fa.php?returnto=')
schema: nexusphp
selectors:
    fields:
        subtitle:
            selectors:
                - td:has(a[href*='hit'][title]) > span:last
tags:
    - 影视
    - 综合
urls:
    - https://www.hddolby.com/
user_info:
    path: index.php
    user_torrent_list_api: "/getusertorrentlistajax.php?userid={id}&type={type}"
    fields:
        bonus:
            filters:
                - name: parse_number
            selectors:
                - td.rowhead:contains('鲸币') + td
                - td.rowhead:contains('Karma Points') + td
    detail_fields:
        uploaded:
            filters:
                - name: regexp
                  args: '(?i)(?:上传量|上傳量|Uploaded)[\s\S]{0,120}?([\d.,]+\s*(?:[KMGTPE]i?B|Bytes|B))'
                - name: parse_size
            selectors:
                - "td.rowhead:contains('传输') + td"
                - "td.rowhead:contains('傳送') + td"
                - "td.rowhead:contains('Transfers') + td"
        downloaded:
            filters:
                - name: regexp
                  args: '(?i)(?:下载量|下載量|Downloaded)[\s\S]{0,120}?([\d.,]+\s*(?:[KMGTPE]i?B|Bytes|B))'
                - name: parse_size
            selectors:
                - "td.rowhead:contains('传输') + td"
                - "td.rowhead:contains('傳送') + td"
                - "td.rowhead:contains('Transfers') + td"
        ratio:
            filters:
                - name: regexp
                  args: '(?i)(?:分享率|Ratio)[\s\S]{0,120}?([\d.]+|无限|無限|Inf\.?|Infinity)'
                - name: replace
                  args: 无限:::9999
                - name: replace
                  args: 無限:::9999
                - name: replace
                  args: Infinity:::9999
                - name: replace
                  args: Inf.:::9999
            selectors:
                - "td.rowhead:contains('传输') + td"
                - "td.rowhead:contains('傳送') + td"
                - "td.rowhead:contains('Transfers') + td"
        bonus:
            filters:
                - name: parse_number
            selectors:
                - td.rowhead:contains('鲸币') + td
                - td.rowhead:contains('Karma Points') + td
    pages:
        - path: mybonus.php
          fields:
              bonus_per_hour:
                  filters:
                      - args: /:::0
                        name: split
                      - name: parse_number
                  selectors:
                      - table[width='800'] > tbody > tr:contains('合计') > td:last-of-type
                      - table[width='800'] tr:contains('合计') > td:last
